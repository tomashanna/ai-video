    first_person_pov_locked: true

  hook_sub_beats:                                      # PAUTA § 2.5 + § 19.5 ordering canonical (countdown LAST). v11.2 A1: hook LLAMATIVO + INTERACTIVO + CON MÚSICA. 2 shots (shot_01 hook_a + shot_01b hook_b).
