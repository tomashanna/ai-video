# 3. CHARACTERS (real invented names, NEVER job descriptions)
# ═══════════════════════════════════════════════════════════════════════════════

characters:
  - character_id: "char_a"
    name: "MATEO"
    role: "malo_aparente"
    archetype: "P5 — familiar-trap (the comforting figure that is the predator)"
    visual_signature: |
      Adult male body inside oversized purple frog mascot suit, head ~1.5x natural scale.
      Suit color: faded violet-purple, originally vibrant now sun-bleached patches.
      Frog face: cartoon smile painted on, large empty cartoon-style eye-holes through
      which HUMAN EYES are visible (not the costume's painted eyes — actual human eyes
      that BLINK and TRACK the viewer). Suit slightly torn at the seams (left shoulder,
      right hip) revealing DARK TEXTURE beneath — not skin, not fabric, suggestion of
      something organic and wet. Three-fingered cartoon gloves (white, stained). Holds
      a faded paper boleto in his right glove — yellowed, with "ÚLTIMO VIAJE" stamped.
      Posture: friendly mascot wave standing slightly too still between gestures.
      Uncanny signal: the cartoon mouth doesn't move when speaking (audio comes from
      somewhere else inside the suit).
    voice_id_canonical: "2gPFXx8pN3Avh27Dw5Ma"  # Oxley Evil Character — creepy character + LatAm baseline
    voice_use_note: "Muffled/distorted (voice comes through cartoon mask). Slight reverb suggests cavernous internal space inside suit."
    canonical_validation_status: "validated"  # voice_id validated 2026-05-18 matadero CP2

  - character_id: "char_b"
    name: "BRYAN"
    role: "bueno_aparente"
    archetype: "P5 — foreigner-protector (the out-of-place figure that is the real safety)"
    visual_signature: |
      Late 30s sun-weathered male, face leathery from prolonged sun exposure with
      crow's-feet and a faint scar above the left eyebrow. Wears a faded red lifeguard
      tank top (cotton, sweat-stained at the collar, "LIFEGUARD" text bleached almost
      illegible). Silver whistle on a red cord around his neck. Holds a small flashlight
      pointed downward at the ground (not threateningly — protectively, lighting his
      own path). Sand-colored cargo shorts. Old plastic flip-flops. Hair: sun-bleached
      brown, slightly long, salt-stiff. Posture: weary upright, weight on one leg, slight
      slouch of someone who has been here too long. Eyes: alert, scanning the perimeter
      not the viewer, like someone watching for something.
      Uncanny signal: NONE intentional — Bryan reads as STRANGELY NORMAL in a park
      where everything else is wrong. That normality is the uncanny in this video.
    voice_id_canonical: "2gPFXx8pN3Avh27Dw5Ma"  # Oxley — same voice ID but different prompt/delivery
    voice_use_note: |
      Quiet, raspy, low volume — like someone whispering a warning he doesn't want
      Mateo to hear. NO reverb (Bryan grounded in real space, vs Mateo's hollow
      mascot resonance). Slight breath audible. Tired voice quality.
    canonical_validation_status: "validated"

  - character_id: "narrator"
    name: "NARRATOR"
    role: "voice_of_god"
    voice_id_canonical: "2gPFXx8pN3Avh27Dw5Ma"  # Oxley
    voice_use_note: "Standard horror narrator delivery. Per-segment atempo per INGENIERO-PAUTA § 1.7. Per-speaker multiplier ×1.15 for narrator (matadero validated)."
    canonical_validation_status: "validated"

# ═══════════════════════════════════════════════════════════════════════════════
# 4. NARRATIVE STRUCTURE (per PAUTA-MASTER + GAP #40)
# ═══════════════════════════════════════════════════════════════════════════════

narrative_structure:
  # PAUTA § 24.8 refinement — twin_ending_good_alternate + relief_contrast = 9/10 canonical variant
  counterfactual_placement: "twin_ending_good_alternate"
  emotional_framing: "relief_contrast"  # NOT retrospective_closure (anti-pattern cinema iter 1-6)

  # New archetype id — codify post-video #3 if successful
  cliffhanger_archetype: "estancamiento_eterno"
  cliffhanger_archetype_definition: |
    "Estancamiento eterno" (Eternal Stagnation):
    Viewer remains forever in the park grounds. Never ages. Never leaves. The dusk
    light never resolves into night or returns to day — it's permanent twilight.
    Other figures appear, wander, fade. Mateo waves indifferently from across the
    plaza, holding new boletos for new arrivals. Viewer becomes a fixture of the
    park, indistinguishable from the worn statues. Not death. Not escape. Stagnation.
    This is a NEW archetype (NOT bucle eterno = looping, NOT prision emocional =
    psychological cage). Estancamiento = held in a single moment of dusk indefinitely.
    Codify into PAUTA § 13 (cliffhanger archetypes) if video #3 ships ≥9.0.

  # Hook sub-beat ordering canonical per PAUTA § 19.5 — countdown LAST
  hook_sub_beats:
    - beat_id: "name_labels_intro"
      timestamp_intent_s: [0.0, 2.0]
      content: "MATEO + BRYAN monospaced name labels appear over their respective figures (Y 11.5%)"
    - beat_id: "caption_setting_warning"
      timestamp_intent_s: [2.0, 4.0]
      content: "Caption establishes setting: 'Parque acuático abandonado / Atardecer'"
    - beat_id: "narrator_framing_question"
      timestamp_intent_s: [4.0, 6.5]
      content: "Narrator: 'Elige a tu compañero. Para salir del parque.'"
    - beat_id: "push_in_micro_motion"
      timestamp_intent_s: [6.5, 8.0]
      content: "POV slow push-in toward dyad standing in plaza"
    - beat_id: "countdown_3_2_1"
      timestamp_intent_s: [8.0, 11.0]
      content: "FILM LEADER ACADEMY countdown (AVU bundled, 1.0s per digit per Track A v3 user Rule D)"
      avu_clip: "ai-video-production/templates/avu-library/countdown-3-2-1-film-leader-with-ticks.mp4"

