# ============================================================
plot_pattern:
  matriz_pattern_id: 3  # P3 — Seguro era trampa (bueno aparente era el real peligro)
  matriz_appearance: "asimétrico (1 amenazante visualmente — Nico / 1 visualmente cinematic-elegant — Salvador)"
  matriz_truth: "el bueno aparente (Salvador elegant) ES la trampa eterna; el malo aparente (Nico uncanny) ES quien salva"
  has_twist: true
  twist_revelation_timestamp: "outro 75-88s — counterfactual reveal"
  rotation_check: |
