<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

#lower-blackletter {
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  background: #060606;
  position: relative;
}

.scanlines {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent 0px, transparent 3px,
    rgba(0,0,0,0.3) 3px, rgba(0,0,0,0.3) 4px
  );
  pointer-events: none;
  z-index: 900;
}

.vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 100%, transparent 0%, rgba(0,0,0,0.9) 100%);
  pointer-events: none;
  z-index: 890;
}

.lower-content {
  position: absolute;
  bottom: 210px;
  left: 80px;
  right: 80px;
}

.rule {
  width: 0%;
  height: 2px;
  background: rgba(240,240,240,0.42);
  margin-bottom: 20px;
}

.main-text {
  font-family: 'UnifrakturMaguntia', serif;
  font-size: 90px;
  line-height: 1.05;
  color: #f0f0f0;
  text-shadow: 0 0 28px rgba(255,255,255,0.22), 2px 2px 0 rgba(0,0,0,0.85);
  opacity: 0;
  letter-spacing: 6px;
}

.sub-text {
  font-family: 'Special Elite', 'Courier New', monospace;
  font-size: 30px;
  letter-spacing: 10px;
  color: rgba(175,175,175,0.65);
  text-transform: uppercase;
  opacity: 0;
  margin-top: 16px;
}

.flash {
  position: absolute;
  inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
  z-index: 850;
}
</style>
</head>
<body>
<div id="lower-blackletter" data-composition-id="lower-blackletter" data-width="1080" data-height="1920" data-start="0">
  <div class="vignette"></div>
  <div class="lower-content" id="lower-content">
    <div class="rule" id="rule"></div>
    <div class="main-text" id="main-text">The Witness</div>
    <div class="sub-text" id="sub-text">Disappeared · 1987</div>
  </div>
  <div class="flash" id="flash"></div>
  <div class="scanlines"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });

// Rule draws left to right
tl.to("#rule", { width: "100%", duration: 0.38, ease: "power3.out" }, 0.15);

// Gothic text slides in with letter-spacing collapse
tl.fromTo("#main-text",
  { x: -200, opacity: 0, letterSpacing: "28px" },
  { x: 0, opacity: 1, letterSpacing: "6px", duration: 0.55, ease: "power3.out" },
  0.3
);

// Subtitle fades up
tl.fromTo("#sub-text",
  { y: 16, opacity: 0 },
  { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" },
  0.74
);

// CRT flicker during hold
tl.to("#lower-blackletter", { opacity: 0.82, duration: 0.04, ease: "none" }, 1.6);
tl.to("#lower-blackletter", { opacity: 1, duration: 0.05, ease: "none", overwrite: "auto" }, 1.64);
tl.to("#lower-blackletter", { opacity: 0.88, duration: 0.03, ease: "none" }, 2.72);
tl.to("#lower-blackletter", { opacity: 1, duration: 0.04, ease: "none", overwrite: "auto" }, 2.75);

// Exit — slide left, fade
tl.to(["#main-text", "#sub-text"], { x: -60, opacity: 0, duration: 0.38, ease: "power2.in" }, 3.42);
tl.to("#rule", { opacity: 0, duration: 0.38, ease: "power2.in" }, 3.42);

window.__timelines["lower-blackletter"] = tl;
</script>
</body>
</html>
