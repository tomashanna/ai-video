# ============================================================
# REFERENCE ANCHORS (character consistency cross-shots)
# ============================================================
reference_anchors:
  - id: maikol_anchor
    severity: STRICT
    revision: "v2 post-audit 2026-05-13 — IP-safe rewrite (engineer flagged anchor↔risk_flag contradiction)"
    visual_anchor_prompt: |
      Photorealistic full body portrait, plain dark gray studio background, neutral standing
      pose looking at camera, 8k detail, dramatic single-source rim lighting.
      Subject: cursed animatronic pop entertainer from a decommissioned 1980s theme park
      attraction, decayed by decades of saltwater humidity. Latex mask face: pale skin
      with visible hairline cracks running across cheeks and forehead, high rounded
      cheekbones, medium-width nose (NOT narrow), angular jaw with visible animatronic
      seam where the jaw plate disconnects from the skull.
      Hair: straight black greasy hair combed back, slicked flat against the scalp
      (NOT curly, NOT wet curls, NOT jheri curl style).
      Animatronic glass eyes that converge with slight delay, micro-twitching every 2-3s,
      with faint mechanical iris adjustment visible.
      Wardrobe: oxidized white tuxedo jacket with yellow humidity stains + open black shirt
      revealing barnacle-encrusted animatronic chest plate underneath + red crooked bowtie.
      Red fedora hat tilted at an angle with rotten brim edge. Visible white socks above
      polished black loafers crusted with sea salt.
      Right hand: SINGLE WHITE SEQUIN-COVERED GLOVE catching the light — sequins on close
      inspection are small razor blades fanning outward.
      Signature pose: right index finger pointed upward toward sky, body leaning slightly
      backward, left hand resting on hip — theatrical animatronic stage pose.
      Atmosphere: subtle animatronic motion blur, particles of salt dust in the air,
      faint mildew aesthetic. Uncanny valley horror, mechanically degraded performer.
      Style reference: cursed amusement-park animatronic horror, hyperreal 8k cinema
      horror photography (think "decommissioned Disney animatronic found at the bottom
      of a flooded warehouse").
      Avoid: cartoon, anime, friendly, modern human realistic, ANY reference to specific
      real-world celebrities or their likenesses, narrow post-rhinoplasty noses,
      wet-curl hairstyles. Required: animatronic + pop-entertainer-trope + decay + uncanny.
    approval_checkpoint: true

  - id: chelo_anchor
    severity: STRICT
    visual_anchor_prompt: |
      Photorealistic full body portrait, plain dark gray studio background, sitting pose
      on simple wooden chair, looking at camera with calm warmth, 8k detail, soft warm
      single-source lighting from upper left.
      Subject: anthropomorphic squid-humanoid hybrid standing about 5'8" sitting.
      Head: complete squid cephalon with 8 short tentacles hanging downward like dreadlocks
      and 2 long arm-tentacles coiled forward holding objects. Skin color: pale lavender
      base with iridescent orange and blue mottling spots scattered. Large expressive
      black eyes with blinking eyelids. Mouth: subtle squid beak curved into a friendly
      emoji-style smile.
      Wardrobe: classic French sailor striped bodysuit (white and navy horizontal stripes)
      + red waist sash + vintage round eyeglasses hanging from cord around neck +
      small anchor tattoo on one tentacle.
      Posture: SEATED on chair, body leaning forward warmly toward camera, ONE arm-tentacle
      holding a wooden mate gourd with bombilla (Argentine yerba mate) steaming gently,
      OTHER arm-tentacle holding small plate with ceviche and lime wedges.
      Movement intent: serene, tentacles undulate softly, occasional eye blink, slight
      warm head tilt toward viewer.
      Atmosphere: warm gentle ambient, almost cozy despite the alien anatomy.
      Style: hyperreal 8k cinematic, painterly creature design (think Guillermo del Toro
      meets Studio Ghibli sea creature). Uncanny but warm — the goodness reads through
      posture and offering gesture.
      Avoid: monstrous, threatening, cold, sterile. Required: warm + offering + seated +
      tentacles undulating.
    approval_checkpoint: true

