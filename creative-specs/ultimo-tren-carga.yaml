narrative_structure:
  model_constraints_acknowledged: true                  # HR#28/#29 — narración por shot ≤ canonical@165 ≤ min(dur, hailuo_std 5.9s); shots con narración >5.9s → freeze_extend_required:true (declarado per shot)
  pattern: "P2"
  counterfactual_placement: "good_path_at_end"          # ref-03 placement (counterfactual FINAL — default 4/5 refs). Enum válido v11 (NO retrospective)
  emotional_framing: "stakes_lift"                      # la apariencia monstruosa de Dario sube las stakes de cada decisión (PAUTA § 24.8)
