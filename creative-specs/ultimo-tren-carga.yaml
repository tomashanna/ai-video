    architectural_decisions_log: ".claude/skills/creative-director/master-flow-v2/ARCHITECTURAL-DECISIONS.md"
    cost_delta_note_v11_2: |
      Costo CP4 (animación) estimado: 31 shots i2v. Mix: 4 shots kling_v2.5_pro (shot_01, shot_01b, shot_07a,
      shot_12a, shot_17a = 5 shots kling pro) + resto hailuo pro/std. Hailuo std $0.28/clip observado V5; hailuo
      pro y kling_v2.5_pro = TBD por engineer (kling 2.5 pro Replicate ≈ $0.35-0.50/clip 5s estimado de mercado,
      VERIFICAR). Estimado grueso: ~26 hailuo × ~$0.30 (≈$7.8) + 5 kling × ~$0.45 (≈$2.25) ≈ $10.0 total CP4.
      DELTA vs v11.1 (22 hailuo ≈ $6.2): ≈ +$3.8 (9 shots extra del split + upgrade kling en 5 shots). Cae en el
      nuevo cap 10.0. Engineer DEBE verificar el costo real de kling_v2.5_pro en Replicate al agregar la entrada
      a MODEL-CAPABILITIES-MATRIX (HR#28/29) y flaguear al arquitecto si supera el cap.

