reference_anchors:
  characters:
    - id: salvador_anchor
      severity: STRICT
      visual_anchor_prompt: |
        Humanoide alto extremadamente delgado 2.05m, miembros largos, piel pálida grisácea
        cera-translúcida (venas oscuras subdérmicas visibles), ojos hundidos negros
        profundos GLOW warm tungsten orange-amber (luz desde dentro del cráneo).
        BOCA COSIDA con hilo de film celluloide marrón translúcido — 12-15 puntadas
        irregulares cruzando labios horizontalmente. Uniforme proyeccionista años 1950:
        camisa blanca arrugada manchada de aceite negro en cuello + chaleco gris ratón
        desgastado + corbatín negro deshilachado + guantes blancos algodón sucios con
        manchas celuloide quemado. Pantalones grises altos. Postura recta head erect.
        Plain neutral gray background. Photorealistic 35mm cinematic lighting. 8k.
