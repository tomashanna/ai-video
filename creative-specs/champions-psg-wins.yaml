    informs:
      - "narrative_structure.counterfactual_placement"
      - "narrative_structure.emotional_framing"
      - "shot_list.shot_02.narration_in_this_shot"
    why_relevant: "ref-09 obtuvo 10/10 en comprensión narrativa con counterfactual OPENING ('Si hubieras elegido Axel, habrían hablado toda la noche...') ANTES de que el path peligroso resuelva = sube stakes (PAUTA § 24, before_choice_resolves + stakes_lift). Calco esa colocación: el cozy de Dembélé (levantar la orejona, vuelta olímpica, PSG bicampeón) se enuncia temprano (shot_02) para crear contraste emocional antes de entrar al path fatal de Saka. También la cadena de 3 decisiones escaladas + cierre 'sigues con vida'."

