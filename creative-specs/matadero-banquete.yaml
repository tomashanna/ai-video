# CREATIVE-SPEC v6.1 — matadero-banquete (post-9-fixes 2026-05-17)
# Designed by creative-director architect 2026-05-16, fixes applied 2026-05-17
# v6 → v6.1 fixes: camera per shot + mini_cuts_internal + voice_processing + LUTs + music_refs +
#                  silence_by_design flag + shot_19 animation_full + D16 strengthened
# 7 de 9 fixes son schema gaps de CREATIVE-SPEC-TEMPLATE v6 (TODO Bloque H: upgrade a v7)
# Pattern: P6 (Hedonismo eterno — único caso canónico ref-13)
# Format: reel_9_16 / Duration: 87s / Setting: fábrica de hielo refrigerada
# Reference primaria: canonical-scenes/ref-13-miro-bryan-electrica.md (detail level matched)
# Quality bar dual gate target: Gemini ≥9.7 holístico + audit-against-referent ≥85%

# ============================================================
# META
# ============================================================
project_id: matadero-banquete
template_used: elige-tu-companero
delivery_format: reel_9_16
duration_target: 87s
budget_target_usd: 12  # P6 con animation_full 18/22 shots → tier hero alto
created_at: 2026-05-16
status: approved_by_user  # approved 2026-05-17 — handoff a engineer authorized
architect: creative-director
engineer_handoff_blocked_until: auto_audit_passed  # all D14-D22 passed + post-fixes audit passed
approved_at: 2026-05-17
approval_authority: user

# ============================================================
# SLOTS A-H (PAUTA-MASTER § 2 estructura primaria)
# ============================================================

# Slot A — Escenario
slot_A_escenario:
  setting_id: matadero-refrigerado
  setting_name: "Fábrica de hielo / matadero refrigerado a -30°C, turno noche 2-6 AM"
  function_lugar: "despiece y procesamiento de carcasas vacunas en cámara fría industrial"
  elementos_diegeticos:
    - "Carcasas vacunas colgantes de ganchos metálicos (8-12 visibles frame)"
    - "Reloj industrial digital pared (5:40 AM persistente)"
    - "Cuchillo cleaver del viewer en mano enguantada"
    - "Sirena luz roja del relevo (visible solo en H10/H17)"
    - "Olla humeante caldo dorado (Cocinera prop — H1, H12 glimpse, H20-22)"
  iluminacion_dominante: "fluorescentes industriales amarillos cenitales + breath visible viewer + paleta cool cyan-gris"
  iluminacion_outro_cliffhanger: "luz cálida tungsteno + olla humeante key light + steam volumétrico (paleta warm orange)"
  material_paredes_suelo: "acero inoxidable + azulejos blancos manchados + suelo concreto con drenajes + ganchos cromados"
  ref_canonical_anchor: "ref-10 fundición industrial (PAUTA § 7 setting 5) — atrapamiento + función específica + iluminación dramática cumplida"

# Slot B — Visual del malo aparente
slot_B_malo_aparente:
  name: EL_MATARIFE
  plantilla_base: "Humano + cabeza geométrica imposible (PAUTA § 8 plantilla 2 — análogo Ivan esfera beige; matarife usa cleaver vertical industrial gris)"
  visual_description: |
    Humanoide flaco con torso humano normal pero cabeza reemplazada por
    una cuchilla cleaver vertical (la cabeza ES literalmente una cuchilla
    de carnicero gigante: acero gris brillante 60cm de alto, filo afilado
    visible apuntando hacia arriba, mango grueso negro donde estaría la
    boca, sin ojos visibles pero el "filo" parece ver). Delantal de cuero
    grueso color marrón oscuro manchado de sangre seca + óxido. Guantes
    industriales gruesos color azul plástico. Botas de goma negra hasta
    rodilla. Mirada vacía sin rostro humano pero postura concentrada en
    el trabajo. Movimiento metódico, ritualizado. Aliento helado NO visible
    (porque no tiene boca convencional).
  reference_anchor_required: true
  contrast_vs_bueno: "vertical industrial gris afilado / metálico vs horizontal carnal cálido / orgánico"

# Slot C — Visual del bueno aparente
slot_C_bueno_aparente:
  name: LA_COCINERA
  plantilla_base: "Humano + alteración corporal extrema (ojos como brasas + dientes demasiado perfectos) — PAUTA § 9 'bueno visualmente extreme también' (7/8 canónicos)"
  visual_description: |
    Mujer obesa de mediana edad con bata blanca de cocinera con manchas
    oscuras (caldo viejo, salsa, sangre indistinguible) cubriendo torso
    y mangas. Cabello recogido en moño bajo gorro de chef blanco arrugado.
    Ojos como brasas anaranjadas que emiten luz tenue propia (#FF6B1F glow
    sutil — visible incluso a contraluz). Piel pálida con micro-quemaduras
    rosadas en mejillas y nariz. Sonrisa cálida ancha que revela demasiados
    dientes humanos perfectos blanquísimos (28-32 dientes uniformes adultos
    donde habría 16 — uncanny pero no monstruoso al primer vistazo).
    Sostiene olla de aluminio grande humeante con caldo dorado espeso con
    AMBAS manos cerca del pecho. Postura horizontal acogedora, ligeramente
    inclinada hacia el viewer. Movimiento lento, cordial.
  reference_anchor_required: true
  has_dialogue: true  # ref-08 Hugo precedent — bueno aparente habla en hook
  dialogue_count_estimated: 2  # "No me elijas" en hook + "Probá el caldo" en cliffhanger
  contrast_summary: "Color: gris-azul-acero (Matarife) vs blanco-naranja-cálido (Cocinera). Forma: vertical filo (M) vs horizontal redondo (C). Postura: parado rígido (M) vs inclinado acogedor (C)."

# Slot D — Regla del malo aparente
slot_D_regla_del_malo:
  texto: "No mires los ganchos. El turno termina solo."
  tipo: "procedural industrial — sumisión al ritmo del trabajo"
  count_palabras: 8  # within 5-10 range ✓
  conecta_con_dilemas: true
  conecta_explicacion: |
    D1 (curiosidad): testea "no mires los ganchos" — el gancho 6 vibra, tentación de mirar.
    D2 (acción/pasividad): testea "el turno termina solo" — Matarife sale al baño, puerta abierta tentadora.
  consecuencia_inmediata_si_rompe_D1: "Carcasa abre boca enorme con dientes humanos, te traga, sos cena sin terminar."
  consecuencia_inmediata_si_rompe_D2: "El pasillo se alarga. Las paredes se vuelven carne tibia. Caminás eternamente sin encontrar salida."

# Slot E — 2 dilemas internos
slot_E_dilemas:
  - id: D1
    timestamp_intent: "post-H3 setup decision 1"
    categoria: 3  # Curiosidad vs obediencia
    setup: "El gancho seis empieza a vibrar. Algo adentro respira."
    pregunta: "¿Mirás o seguís cortando?"
    opcion_A_impulso: "MIRAR (curiosidad natural humana)"
    opcion_B_estoica: "SEGUIR CORTANDO (obediencia procedural Matarife)"
    opcion_ganadora: B  # contra impulso ✓
    consecuencia_A_body_horror: "La carcasa abre la boca grande con dientes humanos perfectos. Te traga entero. Quedás cena sin terminar dentro de su cavidad estomacal con el reloj congelado."
    consecuencia_B_apertura: "La carcasa deja de vibrar. El Matarife asiente. Quedan veinte minutos."

  - id: D2
    timestamp_intent: "post-H7 setup decision 2"
    categoria: 2  # Acción vs pasividad (DIFERENTE a D1) ✓
    setup: "El Matarife sale al baño. La puerta del corredor queda abierta. La Cocinera asoma al fondo con la olla humeante."
    pregunta: "¿Salís a estirar (curioso/tentado por Cocinera) o esperás (procedural Matarife)?"
    opcion_A_impulso: "SALIR (acción + tentación cozy)"
    opcion_B_estoica: "ESPERAR (pasividad estoica + cumplir el procedural)"
    opcion_ganadora: B
    consecuencia_A_body_horror: "El pasillo se alarga. Las paredes metálicas se vuelven carne tibia palpitante con venas. Caminás. Caminás. Caminás. Y nunca encontrás la salida — sos un intestino vivo del edificio."
    consecuencia_B_apertura: "El Matarife vuelve. Suena la sirena de las seis. Fin del turno."

# Slot F — Body horror específico (existencial — P6 variant)
slot_F_body_horror:
  tipo_principal: "pérdida progresiva de identidad/libertad (PAUTA § 12 tipo 7)"
  imagenes_validables:
    - "Carcasa con dientes humanos perfectos abre mandíbula enorme y te absorbe al interior estomacal rojo carnoso"
    - "Reloj industrial digital congelado 5:40 AM dentro de cavidad estomacal de la carcasa"
    - "Paredes metálicas industriales transicionan suavemente a carne palpitante con venas visibles bajo superficie"
    - "Viewer (POV manos) camina pasillo infinito que se elonga conforme avanza, perspective warp tunnel"
    - "Cuchara con caldo dorado se levanta, otra cuchara, otra, multiplicación visual de tiempo loop"
    - "Reloj pared 5:40 AM persistente en comedor con platos que se multiplican sobre mesa"
  test_pasa_IA_generable: "SÍ — todas las imágenes son visualizables con Flux/Seedream/Midjourney"
  diferenciacion_vs_fisico: |
    NO body horror físico (sangre, mutilación, quemadura). TODO existencial:
    - D1 A: te volvés contenido de la carne (cena eterna)
    - D2 A: te volvés órgano del edificio (intestino eterno)
    - Counterfactual: te volvés comensal eterno (cena infinita)
    Tema común: pérdida de identidad humana, atrapamiento atemporal en placer/horror.

# Slot G — Cliffhanger archetype
slot_G_cliffhanger_archetype:
  archetype: "Hedonismo trampa (P6 variant — único caso canónico ref-13)"
  rotation_check: "video-log.md consultado: últimos 6 videos NO usaron P6 — primera vez para nosotros. Pattern empírico ref-13 score TOP 9.10."
  elementos_sensoriales_validados:
    - "comedor cozy con luz tungsten cálida (PAUTA § 13 elemento 'comida cozy' + 'iluminación cálida')"
    - "olla humeante caldo dorado (variant 'comida caliente' presente en ref-08 4/8)"
    - "cuchara primera + segunda + multiplicación (visual loop — variant pattern ref-13)"
    - "platos multiplicándose sobre mesa (visual signature)"
    - "música cozy waltz acústica (genre shift industrial → cálido — ref-13 pattern)"
    - "reloj pared 5:40 AM persistente (visual signature del trap atemporal)"
  texto_intent: |
    "Si hubieras elegido a la Cocinera, te lleva al comedor de empleados.
    [Cocinera dialogue]: Probá el caldo. Solo una cucharada.
    Probás una. Probás otra. Probás todo el caldero. La olla nunca se vacía.
    Cenás toda la noche. Cenás todo el día.
    La sirena de las seis nunca suena para vos."
  ref_canonical_anchor: "ref-13 INDEX § 12 (cliffhanger TRAP variant) — frame_125.5 keyframe canonical pattern + music shift radical"
  body_horror_existencial_outro: "el viewer pierde el OBJETIVO del hook (terminar el turno + salir al amanecer) — el bueno aparente te lo roba con seducción cozy"
  cliffhanger_risk_forward_CP5:
    risk: "emotional payoff del P6 reveal puede comprimirse demasiado, perdiendo el peso eterno. SPEC cliffhanger TRAP = 19.5s (22% del video) vs ref-13 cliffhanger TRAP = 77s (60% del video) — compresión ~25%."
    cp5_expansion_options_if_needed:
      - "Add 1 image olla multiplying visual loop (+3s)"
      - "Add narration beat 'cucharada / cucharada / cucharada' repetitive (+2s)"
      - "Music decay sostenido vs hard cut (sustain envelope + reverb tail)"
    decision_authority_cp5: architect+auditor visual audit
    trigger: "si CP5 draft render se siente 'rápido' o emocionalmente flat en el cliffhanger TRAP"
    added_at: 2026-05-17
    added_by: auditor_recommendation_post_audit_estructural

# Slot H — Ambient creatures / easter eggs
slot_H_ambient_creatures:
  setting_aplicable: "matadero refrigerado nocturno"
  criatura_seleccionada: "ratas pequeñas grises corriendo entre carcasas al fondo (0.5s visible en H3 setup decision 1 + 0.3s en H7 setup decision 2)"
  proposito: "scroll-stop pasivo + densidad del setting + sugerir 'algo se alimenta acá aunque no veas qué'"
  visible_shots: [shot_04_decision_1_setup, shot_12_matarife_sale]

# ============================================================
# PATTERN + ROTATION MATRIX
# ============================================================
plot_pattern:
  matriz_pattern_id_pauta_master: P6  # Hedonismo eterno (único canónico ref-13)
  matriz_appearance: "asimétrico (1 industrial filoso + 1 cozy carnal)"
  matriz_truth: "el bueno aparente cozy te seduce a perder el objetivo + el malo aparente filoso te SALVA si seguís su procedural"
  has_twist: true
  twist_type: "P9-like en path Matarife (peligroso te ayuda si obedecés su regla) + P6 en cliffhanger Cocinera (cozy es trampa)"
  rotation_check: "video-log.md: P6 NUNCA usado en producción propia. Diferenciador máximo + score canónico TOP del catálogo."

# ============================================================
# H0 OPCIONAL
# ============================================================
slot_H0_personal_stakes:
  habilitado: false
  razon: "P6 no requiere H0. El objetivo (terminar el turno) es declarado en el hook, suficiente para que el twist cliffhanger funcione retroactivamente."

# ============================================================
# ESTRUCTURA TEMPORAL (87s, 12 hitos, 22 shots)
# ============================================================
estructura_temporal:
  hook_0_8pct: 7s              # H1: dyad + Cocinera warning + countdown
  setup_path_matarife_8_16pct: 7s   # H2: establishing path malo
  decision_1_complete_16_37pct: 18s # H3-H6: setup + UI + consequence A + bridge B
  decision_2_complete_37_72pct: 30s # H7-H10: setup + UI + consequence A + resolution B
  cliffhanger_intro_72_82pct: 4s    # H11: "saliste con vida"
  cliffhanger_TRAP_82_100pct: 16s   # H12: Cocinera + comedor + caldo eterno
  total: 87s
  ref_comparable: "ref-13 distribute: hook 7s + setup 7s + decisions 51s + cliffhanger 70s = 129s. Mi proyecto compresión a 87s con cliffhanger reducido 16s vs ref-13 77s."

# ============================================================
# NARRATION SCRIPT (texto unificado, target WPM median 165 — p25-p75 canónico)
# ============================================================
narration_script:
  meta:
    target_total_duration: 87s
    target_speaking_wpm: 165  # median canónico INGENIERO-PAUTA-MASTER § 1.1
    target_total_words_estimated: 193
    register: tu_implicito_presente_indicativo
    speakers: [narrator, matarife, cocinera]
    coherence_rule: "narración CLARA NO tenebrosa (PAUTA § 3 2026-05-16). Verbo + sujeto + objeto LITERAL. Estilo tenebroso emerge de visual+SFX, NO de narración."

  segments:
    - id: hook_cocinera_warning
      order: 1
      speaker: cocinera
      text: "No me elijas. La cena nunca termina."
      target_duration_s: 3
      pause_after_strict_seconds: 0.3
      keyword_highlights: [{word: "ELIJAS", color: red}, {word: "TERMINA", color: red}]

    - id: hook_dyad_names
      order: 2
      speaker: narrator
      text: "El Matarife o La Cocinera."
      target_duration_s: 2
      pause_after_strict_seconds: 1.8  # countdown 3-2-1 corre acá
      countdown_ui_after: 1.8
      keyword_highlights: [{word: "MATARIFE", color: yellow}, {word: "COCINERA", color: yellow}]

    - id: setup_matarife_path
      order: 3
      speaker: narrator
      text: "Si elegiste al Matarife, trabajás en despiece. Turno noche en la cámara cuatro."
      target_duration_s: 5
      pause_after_strict_seconds: 0.3
      keyword_highlights: [{word: "MATARIFE", color: yellow}, {word: "DESPIECE", color: red}]

    - id: matarife_rule_dialogue
      order: 4
      speaker: matarife
      text: "No mirés los ganchos. El turno termina solo."
      target_duration_s: 3.5
      pause_after_strict_seconds: 0.3
      keyword_highlights: [{word: "NO_MIRÉS", color: red}, {word: "GANCHOS", color: red}]

    - id: decision_1_setup
      order: 5
      speaker: narrator
      text: "El gancho seis empieza a vibrar. Algo adentro respira."
      target_duration_s: 4
      pause_after_strict_seconds: 0.3

    - id: decision_1_question
      order: 6
      speaker: narrator
      text: "Decidís. Mirás o seguís cortando."
      target_duration_s: 3
      pause_after_strict_seconds: 0.8  # countdown + loading

    - id: consequence_A1
      order: 7
      speaker: narrator
      text: "Si mirás, la carcasa abre la boca grande. Te traga entero. Quedás cena para siempre. Cena sin terminar."
      target_duration_s: 7
      pause_after_strict_seconds: 0.5
      keyword_highlights: [{word: "TRAGA", color: red}, {word: "CENA_SIN_TERMINAR", color: red}]
      staccato_climax: "CENA SIN TERMINAR."

    - id: consequence_B1_bridge
      order: 8
      speaker: narrator
      text: "Si seguís cortando, el gancho deja de vibrar. El Matarife asiente."
      target_duration_s: 5
      pause_after_strict_seconds: 0.2

    - id: matarife_count_dialogue
      order: 9
      speaker: matarife
      text: "Veinte minutos."
      target_duration_s: 1.5
      pause_after_strict_seconds: 0.5

    - id: decision_2_setup
      order: 10
      speaker: narrator
      text: "El Matarife sale al baño. La puerta del corredor queda abierta."
      target_duration_s: 4.5
      pause_after_strict_seconds: 0.3

    - id: decision_2_question
      order: 11
      speaker: narrator
      text: "Decidís. Salís a estirar o seguís acá."
      target_duration_s: 3
      pause_after_strict_seconds: 0.8  # countdown + loading

    - id: consequence_A2
      order: 12
      speaker: narrator
      text: "Si salís, el pasillo se alarga. Las paredes se vuelven carne tibia. Caminás. Caminás. Caminás. Y nunca encontrás la salida."
      target_duration_s: 9
      pause_after_strict_seconds: 0.5
      keyword_highlights: [{word: "CARNE_TIBIA", color: red}, {word: "NUNCA", color: red}, {word: "SALIDA", color: red}]
      staccato_climax: "NUNCA ENCONTRÁS LA SALIDA."

    - id: consequence_B2_resolution
      order: 13
      speaker: narrator
      text: "Si esperás, el Matarife vuelve. Suena la sirena de las seis."
      target_duration_s: 4.5
      pause_after_strict_seconds: 0.2

    - id: matarife_exit_dialogue
      order: 14
      speaker: matarife
      text: "Vámonos. Fin del turno."
      target_duration_s: 2
      pause_after_strict_seconds: 0.3

    - id: cliffhanger_intro_positive
      order: 15
      speaker: narrator
      text: "Saliste con vida. Café y sándwich en la cafetería."
      target_duration_s: 4
      pause_after_strict_seconds: 0.5

    - id: cliffhanger_TRAP_intro
      order: 16
      speaker: narrator
      text: "Si hubieras elegido a la Cocinera, te lleva al comedor de empleados."
      target_duration_s: 4.5
      pause_after_strict_seconds: 0.2
      keyword_highlights: [{word: "COCINERA", color: yellow}, {word: "COMEDOR", color: orange}]

    - id: cocinera_offer_dialogue
      order: 17
      speaker: cocinera
      text: "Probá el caldo. Solo una cucharada."
      target_duration_s: 3
      pause_after_strict_seconds: 0.2
      keyword_highlights: [{word: "CALDO", color: orange}, {word: "UNA_CUCHARADA", color: orange}]

    - id: cliffhanger_TRAP_loop
      order: 18
      speaker: narrator
      text: "Probás una. Probás otra. Probás todo el caldero. La olla nunca se vacía. Cenás toda la noche. Cenás todo el día."
      target_duration_s: 8
      pause_after_strict_seconds: 0.3
      keyword_highlights: [{word: "NUNCA_SE_VACÍA", color: red}, {word: "TODA_LA_NOCHE", color: red}, {word: "TODO_EL_DÍA", color: red}]

    - id: cliffhanger_TRAP_closure
      order: 19
      speaker: narrator
      text: "La sirena de las seis nunca suena para vos."
      target_duration_s: 4
      pause_after_strict_seconds: 0.5
      staccato_climax: "NUNCA SUENA PARA VOS."

# ============================================================
# REFERENCE ANCHORS (consistency cross-shots)
# ============================================================
reference_anchors:
  characters:
    - id: matarife_anchor
      severity: STRICT
      visual_anchor_prompt: |
        Photorealistic 8k portrait, full body neutral standing pose, plain
        gray background, soft front light. Subject: tall thin male humanoid
        figure, height 1.85m. CRITICAL: his head is literally replaced by
        a large vertical butcher cleaver knife (60cm tall stainless steel
        blade pointing up, sharp edge visible at top, black molded grip
        where mouth would be at bottom — no human face, no eyes). Body
        wears thick brown leather butcher apron stained with dried blood
        and rust patches covering chest and thighs. Industrial blue plastic
        gloves up to elbows. Black rubber boots knee-high. Arms hang neutral
        at sides. No human facial expression possible (no face). The cleaver-
        head reflects ambient light subtly (steel sheen). Cinematic horror
        aesthetic but composed and frontal. No text, no logos.
      approval_checkpoint: true
      appears_in_shots: [shot_01_hook, shot_03_matarife_rule, shot_11_matarife_count, shot_12_matarife_sale, shot_17_matarife_return]
      as_built_2026_05_17:
        decision: "apron direct on torso accepted — refuerza humanoid uncanny per PAUTA-MASTER L301 HUGO + L303 ENZO ref-10 body-direct exposure pattern"
        spec_changes: none
        shirt_required: false
        gloves_at_elbow_joint_verified: true
        decision_at: 2026-05-17
        auditor_concurrence: true

    - id: cocinera_anchor
      severity: STRICT
      visual_anchor_prompt: |
        Photorealistic 8k portrait, mid-body inclined-forward warm pose,
        plain gray background, warm tungsten key light from upper-left.
        Subject: obese middle-aged woman, height 1.65m, weight ~110kg.
        Wears stained white chef coat (visible dark patches of broth/sauce/
        blood indistinguishable on chest, sleeves, lower hem) buttoned to
        neck. White wrinkled chef hat covering hair pulled in low bun.
        CRITICAL FEATURES: (1) Eyes glow with subtle orange-amber light
        (#FF6B1F, soft volumetric inner glow visible even in fill light),
        (2) Pale skin with small pinkish micro-burn marks on cheeks and
        nose tip, (3) Warm wide smile revealing 28-32 perfectly uniform
        adult human teeth bright white (twice normal count, all same size
        — uncanny but only noticeable on close inspection). Holds large
        aluminum pot with both hands close to chest, golden viscous broth
        steaming visibly with volumetric steam rising. Posture slightly
        inclined forward toward camera, inviting. Cinematic warm aesthetic
        contrasting cold industrial setting. No text, no logos.
      approval_checkpoint: true
      appears_in_shots: [shot_01_hook, shot_12_matarife_sale, shot_20_cocinera_comedor, shot_21_caldo_loop, shot_22_eternal_trap]
      as_built_2026_05_17:
        path: B_accept_with_deferral
        teeth_count_delivered: "~20-22 (uniform, dense)"
        teeth_count_spec_target: "28-32"
        deferral_to: shot_20_cocinera_comedor_close_up
        deferral_strategy: "extreme prompt + dedicated close-up framing in CP2"
        features_preserved:
          - "glow #FF6B1F"
          - "uniform smile"
          - "dense teeth"
          - "micro-burns"
          - "chef coat stained"
          - "warm inclined pose"
        rationale_architect: "PAUTA-MASTER § 9 L297-306 buenos signatures categóricas NO numerical (8/8). SPEC L391 'only noticeable on close inspection' → anchor mid-body NO es close inspection."
        auditor_concurrence: true
        spec_changes: none
        decision_at: 2026-05-17
        escalation_trigger_cp2: "if shot_20 generated teeth count <28 OR not uniform, ESCALATE to architect+auditor before proceeding to shot_21"

  settings:
    - id: matadero_interior_anchor
      severity: STRICT
      visual_anchor_prompt: |
        Photorealistic 8k wide establishing of industrial cold storage
        meat plant interior at night. Ceiling 4m high with hanging steel
        meat hooks, 8-12 visible beef carcasses (skinned, red musculature
        visible) suspended from hooks at 1.8m height (eye level for viewer).
        Floor: polished concrete with central drain grates, slightly wet.
        Walls: stainless steel panels + white ceramic tiles to 1.5m, some
        tiles cracked or stained. Ceiling: industrial fluorescent yellow
