      content: "POV slow push-in hacia el dyad al fondo del túnel bajo la luz ámbar + micro-motion de AMBOS (Dario gotea/respira bajo la máscara, Tobias parpadea y mueve el termo) — NO zoom-cut, push-in continuo (feedback_hook_continuity_no_zoom_cut). Music hook_crescendo pico."
