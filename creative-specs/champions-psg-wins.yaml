      content: "Narrator framing 'Final de la Champions. Minuto decisivo. Elige a tu compañero.' + caption marcador ARSENAL 1 - PSG 0"
    - beat_id: "push_in_micro_motion"
      timestamp_intent_s: [4.5, 6.0]
      content: "POV slow push-in hacia el dyad sobre el césped (NO zoom-cut — feedback_hook_continuity_no_zoom_cut)"
    - beat_id: "countdown_3_2_1"
      timestamp_intent_s: [6.0, 9.0]
      content: "Film Leader Academy countdown vía AVU clip (digit 1.0s c/u)"
