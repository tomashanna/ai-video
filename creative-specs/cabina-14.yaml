camera_shots_strategy:
  ref_doc: camera-and-shots.md
  pov_percentage_intent: 88  # ≥80 requirement (PAUTA-MASTER § 3 Producción 2026-05-15 enforcement)
  pov_enforcement_note: |
    El viewer ES el ocupante #3 de la cabina (POV implícito). TADEO está sentado
    enfrente, EMI al lado o enfrente. Casi todos los shots son desde la posición
    del viewer en su asiento. Excepción: 3 shots de presentación / establishing
    son NON-POV justificados (hook teaser exterior + 2 close-ups standalone).
  shot_types_by_hito:
    H1:
      - { id: H1_S1, type: NON_POV, descripcion: "wide cabina exterior teaser meciéndose en tormenta", justificacion: "hook establishing — único exterior justificado" }
      - { id: H1_S2, type: POV, descripcion: "POV desde tu asiento: materializan EMI (al lado) y TADEO (enfrente) frente a vos" }
      - { id: H1_S3, type: POV, descripcion: "POV con name labels arriba de cada personaje, vos mirándolos alternando" }
    H2:
      - { id: H2_S4, type: POV, descripcion: "POV viewer recibe anuncio radio walkie en pared lateral" }
      - { id: H2_S5, type: POV, descripcion: "POV close-up TADEO susurrándote las reglas (su boca visible desde tu POV)" }
      - { id: H2_S6, type: POV, descripcion: "POV mirando ventanuco lateral mientras silueta cuadrúpeda cruza nieve abajo (4s, Slot H)" }
      - { id: H2_S7, type: POV, descripcion: "POV close-up EMI sonriéndote demasiado" }
    H3:
      - { id: H3_S8, type: POV, descripcion: "POV EMI extiende chicle hacia vos, su mano avanza al frame" }
      - { id: H3_S9, type: POV, descripcion: "POV tus propias manos en tu regazo (lengua se calienta sola)" }
      - { id: H3_S10, type: NON_POV, descripcion: "wide cabina meciéndose vista lateral exterior (1 shot atmospheric break)", justificacion: "atmospheric reset, 1.5s solo" }
      - { id: H3_S11_A, type: POV, descripcion: "POV body horror: viewer asfixiándose, EMI quieto sonriendo frente a vos" }
      - { id: H3_S12_bridge, type: CAPTION_ONLY, descripcion: "bridge separator 'SI ELEGISTE SILENCIO:' fade tenue" }
      - { id: H3_S13_B, type: POV, descripcion: "POV TADEO asiente despacio + EMI cierra boca lentamente, ambos frente a vos" }
    H4:
      - { id: H4_S14, type: POV, descripcion: "POV mirando hacia abajo: rodillas de EMI tocando las tuyas" }
      - { id: H4_S15, type: POV, descripcion: "POV reflejo en vidrio del ventanuco: vos + ellos" }
      - { id: H4_S16, type: POV, descripcion: "POV ves dedos largos de TADEO tensándose sobre su rodilla" }
      - { id: H4_S17_A, type: POV, descripcion: "POV body horror: ráfaga, cabina se abre lateral, vos saliendo despedido (caída 30m)" }
      - { id: H4_S18_bridge, type: CAPTION_ONLY, descripcion: "bridge 'SI NO TE MOVISTE:' fade tenue" }
      - { id: H4_S19_B, type: POV, descripcion: "POV TADEO cruza su brazo largo sobre tu pecho fijándote; EMI re-abrocha mirándote" }
    H5:
      - { id: H5_S20, type: POV, descripcion: "POV piso metálico vibrando con los 3 golpes sub-bass desde abajo" }
      - { id: H5_S21, type: POV, descripcion: "POV dedos de EMI sobre pestillo, visiblemente MÁS LARGOS (setup element, 3s data-duration)" }
      - { id: H5_S22_A, type: POV, descripcion: "POV body horror: brazo largo entra por ventanuco, te agarra, te arrastra al vacío congelándote a mitad de caída" }
      - { id: H5_S23_bridge, type: CAPTION_ONLY, descripcion: "bridge 'SI NO ABRISTE:' fade tenue" }
      - { id: H5_S24_revelation, type: POV, descripcion: "POV TADEO se interpone con brazos en cruz, ventanuco se rompe, EMI desencaja: mandíbula cae al piso metálico, ojos negros, brazos duplican largo saliendo por ventanuco — todo presenciado desde tu asiento (payoff element, 3s data-duration)" }
      - { id: H5_S25_close_tadeo, type: POV, descripcion: "POV close-up TADEO mirándote en silencio post-evento, narrador cierra twist" }
    H6:
      - { id: H6_S26_warm_bridge, type: CAPTION_ONLY, descripcion: "warm white transition + caption ámbar 'Y SI HUBIERAS PASADO LA NOCHE CON TADEO...'" }
      - { id: H6_S27, type: POV, descripcion: "POV refugio interior 6:15 AM: tu mano sosteniendo mate humeante, manta de lana cruda sobre tus piernas, labrador echado sobre tus botas, ventana al fondo con amanecer rosado sobre Cerro Catedral" }
      - { id: H6_S28, type: POV, descripcion: "POV TADEO sereno enfrente en sillón viejo, también con mate, radio AM folclore lejano" }
      - { id: H6_S29_CTA, type: CAPTION_ONLY, descripcion: "CTA '¿SOBREVIVISTE? COMENTA A o B' caption Y 50-58% (fuera de banda caption canónica)" }
  pov_count_audit:
    total_shots: 29
    pov_shots: 22  # POV
    non_pov_shots: 3  # justified establishing (H1_S1 exterior, H3_S10 atmospheric break + 1 buffer)
    caption_only_shots: 5  # bridges + CTA + warm bridge — neutral, no break POV
    pov_ratio_pct: 88  # de shots con imagen: 22/(22+3) = 88% ✓ ≥80
    method: "caption-only shots no cuentan como break de POV (son overlays, no shots de cámara)"

