# ═══════════════════════════════════════════════════════════════
# 5. NARRATIVE STRUCTURE (counterfactual + emotional framing)
# ═══════════════════════════════════════════════════════════════

narrative_structure:
  model_constraints_acknowledged: true                  # HR#28/#29 — narración@165 ≤ min(dur, clip_max tier) por shot
  counterfactual_placement: "before_choice_resolves"   # CANONICAL preferred (ref-09 10/10, PAUTA § 24)
  emotional_framing: "stakes_lift"
  cliffhanger_archetype: "P3"                          # rama corta del foil (favorito PSG) = "lo fácil"; rama de Saka = lo jugable
  pattern: "P3"

  canonical_constraints:
    no_retrospective_counterfactual: true
    si_elegiste_framing_required: true                 # marcar la rama vía acción condicional ("Si encaras al lateral")
    consequence_framing_style: "accion_condicional"    # NO bare label "Si elegiste A"
    visual_matches_narration_literal: true
    first_person_pov_locked: true

  hook_sub_beats:                                      # PAUTA § 19.5 ordering canonical (countdown LAST)
    - beat_id: "name_labels_intro"
      timestamp_intent_s: [0.0, 2.0]
      content: "Dyad simultánea Saka + Dembélé con name labels monospaced GRANDES (Y11.5) — name_label_fontsize_intent=large"
    - beat_id: "caption_setting_warning"
      timestamp_intent_s: [2.0, 4.5]
      content: "Narrator framing 'Final de la Champions. Elige tu compañero.' + caption 'SAKA = ARSENAL · DEMBÉLÉ = PSG'"
    - beat_id: "push_in_micro_motion"
      timestamp_intent_s: [4.5, 6.0]
      content: "POV slow push-in hacia el dyad sobre el césped (NO zoom-cut — feedback_hook_continuity_no_zoom_cut)"
    - beat_id: "countdown_3_2_1"
      timestamp_intent_s: [6.0, 9.0]
      content: "Film Leader Academy countdown vía AVU clip (digit 1.0s c/u)"
      avu_clip: "countdown-3-2-1-film-leader-with-ticks.mp4"

# ═══════════════════════════════════════════════════════════════
