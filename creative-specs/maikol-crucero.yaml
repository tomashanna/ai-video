  pov_strict_rule: |
    Decisión creativa del arquitecto: 100% POV en todas las tomas del video.
    Más estricto que PAUTA-MASTER § 3 (que pide >70%). Razón: maximizar inmersión
    horror-choice — el viewer ES el protagonista, nunca lo ve desde afuera.
    Shots con apariencia third-person deben resolverse como POV indirecto
    (reflejo en espejo, en bola disco, en pantalla, en agua).
  signature_shots:
    - "H1 dyad — POV mirando a MAIKOL (izq) y CHELO (der) frente a vos. Tus manos en el frame inferior si aporta."
    - "H2 setup — POV entrando al salón, parquet acercándose. MAIKOL aparece bailando frente a cámara."
    - "POV bar del salón — MAIKOL sirve dos copas frente a vos. Las perlas brillantes flotan dentro."
    - "POV copa de champagne en primer plano — perlas-cristal flotando, dorado profundo."
    - "POV garganta cortada (D1 A) — tu mano agarrándote el cuello, copa con sangre y cristales, MAIKOL bebe la suya."
    - "POV MAIKOL bebe (D1 B) — las perlas-cristal pasan por su mecanismo animatronic visible bajo la camisa abierta."
    - "POV salón reveal — pan lento horizontal mostrando bailarines-sombra al fondo."
    - "POV luces parpadean (D2 setup) — ojos parpadeando junto con las luces, bola disco frontal."
    - "POV pasillo iluminado (D2) — el pasillo se abre frente a vos al fondo del salón."
    - "POV espejos infinitos (D2 A) — MAIKOL multiplicado en cada espejo lateral."
    - "POV ojo de buey rompiéndose (D2 A) — vidrio se quiebra, océano negro entra al lente."
    - "POV cayendo al océano (D2 A) — agua negra subiendo, luna distorsionada arriba."
    - "POV MAIKOL quitándose fedora (D2 B) — frente a tus ojos su cabeza se abre revelando caja de música."
    - "POV bola disco (H5 reveal) — mirás hacia arriba a la bola disco rota; tu reflejo aparece entre bailarines-sombra (truco POV indirecto)."
    - "POV cubierta amanecer (H6) — mirás a CHELO sentado frente a vos. Sus tentáculos extendidos sirviéndote mate."
    - "POV mate humeante closeup — el mate sostenido por tentáculo entrando al frame frontal."
    - "POV perro labrador — el perro se acerca a tus pies / lente."
    - "POV gaviotas y horizonte — mirás al horizonte naranja amanecer."
  truco_POV_indirecto:
    descripcion: |
      Cuando el shot requiera mostrarte a vos mismo (e.g., "te ves bailando entre ellos"),
      resolver SIEMPRE vía superficie reflectante diegética:
