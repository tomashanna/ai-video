        salvador: "Permanece de pie a la izquierda del frame, posture erecta, mira al viewer fijamente, eyes glow tungsten warm sutil pulse (no habla — boca cosida). Gloved hands relajadas a los lados."
        nico: "De pie a la derecha del frame, head turn slow hacia viewer, sostiene linterna en mano derecha apuntada al piso, caja de popcorn en mano izquierda con kernels jumping ocasional. Slight forward lean."
        viewer: "POV estático en pasillo central del cine a 3m del dyad, ojos altura media, ve sala parcial al fondo (filas de butacas + pantalla blanca lejos)."
