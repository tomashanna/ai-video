# ═══════════════════════════════════════════════════════════════
# 7. MUSIC LAYERS (3 mandatory — PAUTA § 25)
# ═══════════════════════════════════════════════════════════════

music_continuous_layers:
  - layer_id: "drone_base"                             # LAYER 1 drone (continuous 80-100%)
    scope: "cross_clip_continuous"
    sections: [{from: 0, to: 90, intent: "drone subharmónico clínico, tensión sostenida bajo-frecuencia"}]
    eleven_labs_prompt: "low subharmonic drone, sterile clinical tension, deep sustained bass tone, no melody, faint high-frequency sine shimmer like fluorescent hum, dark cinematic horror ambient bed"
    compose_strategy: "single_continuous_90s"
    target_lufs_pre_mix: -27
    sidechain_duck_target: true
  - layer_id: "ambient_lab"                            # LAYER 2 ambient (scene-specific)
    scope: "cross_clip_continuous"
    sections: [{from: 6, to: 75, intent: "ambiente BSL-4: hum de campana de flujo laminar + buzz de tubos UV + refrigeración"}]
    eleven_labs_prompt: "biosafety lab room tone, laminar flow hood air hum, UV tube electrical buzz, distant refrigeration compressor, subtle ventilation hiss, no music"
    compose_strategy: "loop_10s_stretched"
    target_lufs_pre_mix: -30
  - layer_id: "ambient_restroom_warm"                  # LAYER 2 ambient variante cozy (counterfactual/outro)
    scope: "cross_clip_continuous"
    sections: [{from: 9, to: 16, intent: "sala de descanso cálida"}, {from: 80, to: 90, intent: "outro cozy"}]
    eleven_labs_prompt: "cozy break room ambience, warm electric kettle steam, soft ventilation, faint clock tick, calm, no horror"
    compose_strategy: "single_8s_reusable"
    target_lufs_pre_mix: -29
  - layer_id: "ambient_dawn"                            # LAYER 2 ambient resolución (esclusa amanecer)
    scope: "cross_clip_continuous"
    sections: [{from: 74, to: 82, intent: "esclusa abriéndose al amanecer"}]
    eleven_labs_prompt: "airlock decompression hiss releasing, soft morning tone, relief swell, distant birds faint through sealed door, calm"
    compose_strategy: "single_8s"
    target_lufs_pre_mix: -28
  - layer_id: "accent_climax"                           # LAYER 3 accent (event-driven D3 clímax)
    scope: "clip_scoped_or_effect"
    sections: [{from: 58, to: 70, intent: "tensión rising en decisión 3 + body horror ducha"}]
    eleven_labs_prompt: "rising dark cinematic strings tension, pressurized hiss building, climax buildup, no drums"
    compose_strategy: "single_12s"
    target_lufs_pre_mix: -25
  - layer_id: "outro_drone"
    scope: "cross_clip_continuous"
    sections: [{from: 82, to: 90, intent: "cliffhanger sostenido final"}]
    eleven_labs_prompt: "sustained low hum gradual fade, cliffhanger atmospheric warm-cool blend, loop cue"
    compose_strategy: "single_8s_fade_in"
    target_lufs_pre_mix: -27

cross_clip_continuous_audio_layers:
  layer_3_continuous:
    - "drone_base"
    - "ambient_lab"
    - "ambient_restroom_warm"
    - "ambient_dawn"
    - "outro_drone"
    - "narrator_master_continuous"
  layer_1_clip_scoped:
    - "axel_voice_off_within_clip"
    - "hugo_dialog_within_clip"
    - "diegetic_sfx_within_clip"
    - "accent_climax"

# ═══════════════════════════════════════════════════════════════
# 8. PACING + EDITING TARGETS (PAUTA § 23 — band 14-22 cuts/min)
# ═══════════════════════════════════════════════════════════════

editing_targets:
  target_cuts_per_min: [18, 22]
  target_total_cuts: [27, 33]                          # 22 shots base + mini-cuts/reaction inserts → ~28-30 perceived cuts en 90s ≈ 19-20 cuts/min
  transition_variety_min: 3
  pacing_modulation:
    hook: [10, 13]
    counterfactual_opening: [12, 15]
    setup_pre_decision: [16, 20]
    decision_1: [10, 13]
    consequence_d1: [22, 28]
    decision_2: [10, 13]
    consequence_d2: [22, 28]
    decision_3_climax: [25, 30]
    consequence_d3: [25, 30]
    resolution_b: [12, 16]
    cliffhanger_outro: [10, 14]

# ═══════════════════════════════════════════════════════════════
# 9. NARRATION SCRIPT (texto canónico exacto — Spanish neutral)
# ═══════════════════════════════════════════════════════════════
# Estilo calibrado a primary source ref-03/09/10: 2ª persona presente, staccato,
# framing acción-condicional, "Ahora decides" gatillo, body horror nominal en climax.
# Total ≈ 192 palabras → ~70s narrados en 90s (resto = countdowns + loadings + beats).

narration_script:
  - segment_id: "narrator_hook"
    speaker: "narrator"
    voice_id: "K3TeN3ZVK8WnOeJ0NYqZ"
    text_canonical: "Elige a tu compañero para esta noche. Axel o Hugo."
    timestamp_intent_s: [2.0, 5.0]
    shot_id_anchor: "shot_01"
    lip_sync_required: false

  - segment_id: "narrator_cozy_counterfactual"
    speaker: "narrator"
    voice_id: "K3TeN3ZVK8WnOeJ0NYqZ"
    text_canonical: "Si hubieras elegido a Hugo, habrían tomado café en la sala de descanso, jugado cartas y salido al amanecer cuando se abre la esclusa."
    timestamp_intent_s: [9.0, 16.0]
