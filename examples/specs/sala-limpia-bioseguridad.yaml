project:
  project_id: "sala-limpia-bioseguridad"
  format: "horror-choice"
  delivery: "reel"
  pattern: "P1"                          # Verdad visible — el obvio peligroso (Axel) ES peligroso
  pattern_rotation_check: "previous: matadero=P6 (Hedonismo). V5 NOT P6 → P1 (Verdad visible) NUNCA usado por nosotros (canonical refs ref-03/06/08/10/12). Compliant HR#14."
  setting: "Laboratorio de bioseguridad nivel 4 (BSL-4), turno noche, sellado por cuarentena automática hasta el amanecer"
  total_duration_s_intent: 90            # banda 80-100s; target 90s
  channel: "@elige_tucompanero"
  language: "Spanish neutral"            # tú/dices/eliges — NUNCA voseo
  # Cross-video uniqueness (video-log.md schema PRE-4.J — declarado HIGH confidence pre-emit V5)
