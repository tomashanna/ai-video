# CLIFFHANGER ARCHETYPE (P3 inverse twist)
# ⭐ Spanish neutral + anti-cliché rewrite per memory feedback_anti_cliche_horror 2026-05-20
cliffhanger:
  type: prision_emocional_eterna
  ref_canonical_anchor: ref-08  # acuario equivalent emotional prison
  description: |
    Si eliges al PROYECTOR (bueno aparente): te sienta en la fila tres asiento siete.
    El proyector enciende. En pantalla: tu cumpleaños de los nueve años, el que olvidaste.
    La película retrocede sola cuando intentas levantarte. El boleto en tu mano marca
    una fecha en blanco. La función dura lo que dura tu memoria.

    Si eliges al ACOMODADOR (malo aparente que salva — TWIST): camina hacia la salida
    con la linterna apuntando al piso. Te abre la puerta lateral del cine. Te entrega
    un boleto sin imprimir y dice "no regreses el martes". Sales al amanecer con
    olor a celuloide quemado en la camisa.
  counterfactual_punchline: |
    Si hubieras elegido al acomodador, habrías salido a tiempo... con un boleto que
    nunca usaste para entrar.

