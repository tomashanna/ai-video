# CREATIVE-SPEC-TEMPLATE.yaml — v10 (post Phase 2 + Phase 3 + GAP #40 — 2026-05-21 PM late)
#
# CHANGES v7 → v10 (consolidated 2026-05-20 → 2026-05-21):
#
# v8 (2026-05-20 Phase 2 architectural refactor):
# - NEW field assembly_strategy: per_clip_atomic | global_master (default per_clip_atomic forward)
# - NEW per-shot fields: motion_type (enum for Hailuo Pro tier auto-select)
# - NEW transitions[] array (effects library reference)
# - NEW music_continuous_layers (cross-clip Layer 3 architecture)
#
# v9 (2026-05-21 6 architect amendments post cinema-abandonado comparative):
# - NEW per-shot fields: anchor_strict (default true), model_tier_override (default veo_3_1 or hailuo)
# - NEW field target_cuts_per_min (canonical band 14-22)
# - NEW field counterfactual_placement (enum: before_choice_resolves | twin_ending_good_alternate | good_path_at_end | parallel_alternation | NEVER after_both_paths_retrospective)
# - NEW field emotional_framing (stakes_lift | relief_contrast | retrospective_closure)
# - REQUIRED music_layers (3 mandatory: drone + ambient + accent)
#
# v10 (2026-05-21 PM late post GAP #40 EXECUTION CONTINUITY codification + Veo 3.1 enterprise):
# - ⭐⭐ NEW per-shot motion_bridge_intent (from_previous + to_next) — required to score EXECUTION CONTINUITY
# - ⭐⭐ NEW per-shot pov_traversal (enum walking_forward | descending | ascending | approaching_character | turning_left | turning_right | static_with_micro_bob)
# - NEW per-shot audio_layer_continuity (list of layer_ids that MUST NOT cut at boundary)
# - NEW per-shot visual_style_lut (LUT id reference for section consistency)
# - NEW narrative_sections[] grouping for section-level LUT + audio continuity
# - NEW per-shot dialog_text (if character speaking — Veo 3.1 generates native lip-sync from this)
# - NEW per-shot has_lip_sync_required (boolean — triggers Veo 3.1 generation)
# - NEW per-shot is_safe_for_veo (boolean — false for explicit gore = use Hailuo fallback)
# - Backward compat: v9 specs still valid. v10 adds fields, NO removes.
# - Validates GAP #40 EXECUTION CONTINUITY via shot-by-shot motion bridges + audio bridges + style LUT + kinetic momentum.

schema_version: "v10"
schema_revised: "2026-05-21"
schema_purpose: "Per-clip atomic assembly + EXECUTION CONTINUITY + Veo 3.1 enterprise primary + lip-sync native"

# ═══════════════════════════════════════════════════════════════
# 1. PROJECT METADATA
# ═══════════════════════════════════════════════════════════════

project:
  project_id: "<kebab-case-id>"          # ej: cabina-14, biblioteca-eternal
  format: "horror-choice"                 # genre per video-log rotation
  delivery: "reel"                        # IG Reel 9:16 1080×1920 mp4
  pattern: "P<N>"                         # P1-P10 archetype matrix
  pattern_rotation_check: "videos previous: matadero=P6, cinema-abandonado=P3, [next-must-differ]"
  setting: "<descriptive>"
  total_duration_s_intent: 90             # canonical band 80-95s
  channel: "@elige_tucompanero"           # NEVER @referent-a (canonical ref only)
  language: "Spanish neutral"             # NUNCA voseo argentino — feedback_spanish_neutral

# ═══════════════════════════════════════════════════════════════
# 2. ASSEMBLY STRATEGY (Phase 2 architectural)
# ═══════════════════════════════════════════════════════════════

assembly_strategy: "per_clip_atomic"      # v8+ canonical. Legacy: "global_master" (matadero/cinema-abandonado only)
                                          # Per-clip atomic eliminates 7/8 recurring bug classes

# ═══════════════════════════════════════════════════════════════
# 3. CHARACTERS (real invented names, NEVER job descriptions)
# ═══════════════════════════════════════════════════════════════

characters:
  - character_id: "char_a"
    name: "<RealName1>"                   # e.g., Bruno, Mateo, Felipe, Bryan, Damián, Lorenzo
                                          # NEVER: Proyector/Matarife/Cocinera (job descriptions BLACKLISTED)
    role: "malo_aparente"                 # or bueno_aparente — dyad
    archetype: "<P<N> dyad assignment>"
    visual_signature: |
      <detailed visual description for anchor generation>
      e.g., "tall thin uncanny figure, stitched mouth with thick dark twine,
       sunken orbital sockets, lanky ectomorph body, weathered industrial vest"
    voice_id_canonical: "<elevenlabs voice id>"  # validated per feedback_voice_id memory

  - character_id: "char_b"
    name: "<RealName2>"
    role: "bueno_aparente"
    archetype: "<P<N> dyad partner>"
    visual_signature: |
      <detailed visual description>
    voice_id_canonical: "<elevenlabs voice id>"

# ═══════════════════════════════════════════════════════════════
# 4. NARRATIVE STRUCTURE (per PAUTA-MASTER + GAP #40)
# ═══════════════════════════════════════════════════════════════

narrative_structure:
  counterfactual_placement: "before_choice_resolves"  # ENUM per PAUTA § 24:
                                                       # before_choice_resolves  ← CANONICAL preferred
                                                       # twin_ending_good_alternate ← acceptable variant
                                                       # good_path_at_end ← acceptable variant
                                                       # parallel_alternation ← acceptable variant
                                                       # after_both_paths_retrospective ← ⛔ ANTI-PATTERN
  emotional_framing: "stakes_lift"                    # stakes_lift | relief_contrast | retrospective_closure
                                                       # AVOID retrospective_closure unless paired with good ending visible

  cliffhanger_archetype: "<archetype id>"             # e.g., bucle_eterno, prision_emocional, hedonismo_eterno

  hook_sub_beats:                                     # per PAUTA § 18 ordering canonical
    - beat_id: "name_labels_intro"
      timestamp_intent_s: [0.0, 2.0]
      content: "Two character names appear with monospaced labels"
    - beat_id: "caption_setting_warning"
      timestamp_intent_s: [2.0, 4.0]
      content: "Caption establishes setting + horror premise"
    - beat_id: "push_in_micro_motion"
      timestamp_intent_s: [4.0, 5.5]
      content: "POV slow push-in toward dyad"
    - beat_id: "countdown_3_2_1"                      # OPTIONAL — always LAST if present
      timestamp_intent_s: [5.5, 8.5]
      content: "Film Leader Academy style countdown"
      avu_clip: "countdown-3-2-1-film-leader-with-ticks.mp4"

# ═══════════════════════════════════════════════════════════════
# 5. NARRATIVE SECTIONS (grouping for cross-shot audio + LUT continuity)
# ═══════════════════════════════════════════════════════════════

narrative_sections:
  - section_id: "hook"
    shot_ids: ["shot_01"]
    audio_layer_continuity_within_section: ["drone_base", "ambient_room"]
    visual_style_lut: "warm_industrial_v1"

  - section_id: "setup_pre_decision"
    shot_ids: ["shot_02", "shot_03", "shot_04", "shot_05"]
    audio_layer_continuity_within_section: ["drone_base", "ambient_corridor"]
    visual_style_lut: "warm_industrial_v1"

  - section_id: "decision_1"
    shot_ids: ["shot_06"]
    audio_layer_continuity_within_section: ["drone_base"]
    visual_style_lut: "warm_industrial_v1_freeze_filter"  # freeze frame + VHS filter for decision UI

  - section_id: "consequence_path_a"
    shot_ids: ["shot_07", "shot_08", "shot_09"]
    audio_layer_continuity_within_section: ["drone_base", "ambient_consequence_a"]
    visual_style_lut: "cool_horror_v1"

  - section_id: "consequence_path_b"
    shot_ids: ["shot_10", "shot_11"]
    audio_layer_continuity_within_section: ["drone_base", "ambient_consequence_b"]
    visual_style_lut: "warm_relief_v1"

  - section_id: "cliffhanger_outro"
    shot_ids: ["shot_12"]
    audio_layer_continuity_within_section: ["drone_base", "outro_drone"]
    visual_style_lut: "cool_horror_v1"

# ═══════════════════════════════════════════════════════════════
# 6. MUSIC LAYERS (cross-clip continuous Layer 3 — PIPELINE § 13.7.5)
# ═══════════════════════════════════════════════════════════════

music_continuous_layers:
  - layer_id: "drone_base"
    sections: [{from: 0, to: 90, intent: "tension low-freq sustained"}]
    eleven_labs_prompt: "low industrial drone, deep bass sustained, no melody, slow atmospheric swells, dark cinematic horror ambient"
    compose_strategy: "single_continuous_90s"
    target_lufs_pre_mix: -27
    sidechain_duck_target: true               # duck under TTS speech segments

  - layer_id: "ambient_corridor"
    sections: [{from: 8, to: 45, intent: "scene ambience pre-decision"}]
    eleven_labs_prompt: "abandoned cinema corridor room tone, distant footsteps echo, subtle texture, no music"
    compose_strategy: "loop_8s_stretched"
    target_lufs_pre_mix: -30

  - layer_id: "ambient_consequence_a"
    sections: [{from: 50, to: 75, intent: "horror consequence atmosphere"}]
    eleven_labs_prompt: "deep horror ambient, eerie metallic resonance, distant rumble"
    compose_strategy: "single_25s"
    target_lufs_pre_mix: -28

  - layer_id: "accent_climax"
    sections: [{from: 60, to: 70, intent: "rising tension climax"}]
    eleven_labs_prompt: "dark cinematic strings rising, climax-buildup, no drums"
    compose_strategy: "single_10s"
    target_lufs_pre_mix: -25

  - layer_id: "outro_drone"
    sections: [{from: 80, to: 90, intent: "cliffhanger sustained final tension"}]
    eleven_labs_prompt: "sustained low frequency hum, gradual fade, cliffhanger atmospheric"
    compose_strategy: "single_10s_fade_in"
    target_lufs_pre_mix: -27

# ═══════════════════════════════════════════════════════════════
# 7. PACING + EDITING TARGETS (per PAUTA § 23 + INGENIERO § 8.12)
# ═══════════════════════════════════════════════════════════════

editing_targets:
  target_cuts_per_min: [14, 22]              # canonical band per PAUTA § 23.8 (refined n=7)
  target_total_cuts: [21, 33]                # for 90s reel
  transition_variety_min: 3                  # min 3 unique transition types per video
  pacing_modulation:                         # by section
    hook: [10, 13]                           # slower establishing
    setup_pre_decision: [14, 18]
    decision_1: [10, 13]                     # freeze + countdown UI
    consequence_path_a: [20, 28]             # climax peak fast cuts
    consequence_path_b: [14, 18]
    cliffhanger_outro: [10, 14]

# ═══════════════════════════════════════════════════════════════
# 8. NARRATION SCRIPT (per character / per segment)
# ═══════════════════════════════════════════════════════════════

narration_script:
  - segment_id: "narrator_framing_question_intro"
    speaker: "narrator"                       # narrator | char_a | char_b
    voice_id: "<elevenlabs voice id>"
    text_canonical: "Elige a tu compañero. Para sobrevivir esta noche."
    timestamp_intent_s: [2.0, 5.0]
    shot_id_anchor: "shot_01"                # which shot this narration is during
    lip_sync_required: false                 # narrator off-screen

  - segment_id: "char_a_warning_dialogue"
    speaker: "char_a"
    voice_id: "<voice_id>"
    text_canonical: "No me elijas. Es una trampa."
    timestamp_intent_s: [8.0, 10.5]
    shot_id_anchor: "shot_02"
    lip_sync_required: true                  # character on-screen speaking — triggers Veo 3.1 generation

  # ... etc per all narration segments

# ═══════════════════════════════════════════════════════════════
# 9. ⭐⭐ SHOT LIST (per-shot complete spec for EXECUTION CONTINUITY)
# ═══════════════════════════════════════════════════════════════

shot_list:
  - shot_id: "shot_01"
    section_id: "hook"
    description: "POV first-person in abandoned cinema lobby entrance, dim warm lights, dust particles, two uncanny figures (Salvador + Nico) visible at end of hallway"
    duration_intent_s: 8.0                  # 9s if includes countdown sub-beat

    # SCENE CONTEXT (per SPEC v6 + storyboard rule)
    scene_context:
      who_is_there: ["char_a", "char_b", "viewer_pov"]
      who_does_what: "Viewer enters lobby, characters slowly approach from distance"
      why_this_shot_exists: "Establish dyad + setting + uncanny premise"
      camera_intent: "POV first-person, slight handheld micro-bob, looking forward toward characters"

    # ⭐⭐ EXECUTION CONTINUITY fields (GAP #40 codification — v10 NEW)
    motion_bridge_intent:
      from_previous: "N/A — first shot, establish camera at standstill"
      to_next: "POV begins slow forward push-in continuing into shot_02"
    pov_traversal: "static_with_micro_bob"   # enum: walking_forward | descending | ascending | approaching_character | turning_left | turning_right | static_with_micro_bob
    audio_layer_continuity: ["drone_base", "ambient_room"]  # MUST NOT cut at this shot's boundaries
    visual_style_lut: "warm_industrial_v1"   # same as section

    # MODEL TIER + ANCHOR
    is_safe_for_veo: true                    # NSFW filter check pre-flight
    model_tier_override: "veo_3_1"           # PRIMARY default forward (Gemini Enterprise free)
                                              # Fallback: hailuo_pro / hailuo_std if Veo rejects OR not character
    anchor_strict: true                      # STRICT mode all shots policy per INGENIERO § 8.14
    motion_type: "walking_forward"           # for Hailuo Pro escalation if Veo unavailable
    hero: true                               # is this hero shot (hook + climax + cliffhanger)

    # AVU OVERLAY (if applicable)
    avu_overlay_clip: null                   # e.g., "countdown-3-2-1-film-leader-with-ticks.mp4" for hook countdown

    # NARRATIVE
    narration_in_this_shot: "Elige a tu compañero. Para sobrevivir esta noche."
    has_lip_sync_required: false             # character not speaking on-screen
    dialog_text: null

    # VISUAL DETAIL
    visual_intent: |
      Wide POV shot, dim warm orange tungsten lights flickering, peeling
      maroon wallpaper, dust particles in light beams, two characters
      Salvador (left, tall thin with stitched mouth) and Nico (right, short
      shadowy with lantern) standing at far end ~10m away. Atmospheric.
    visual_action_match:
      matches_literal: true                  # architect certifies visual matches narration text
      atmospheric_motions_count: 4           # ≥3 mandatory per PAUTA § 26
      atmospheric_motions_list: ["light_flicker", "dust_particles", "character_breathing", "subtle_wind"]

    # UI ELEMENTS ACTIVE
    ui_active:
      - element_id: "name_label_char_a"
        timestamp_visible_s: [0.0, 4.0]
        position: {y_pct: 11.5}              # canonical Y top 11.5% per Hard Rule #4
        text: "SALVADOR"
        font: "monospaced"                   # canonical per CHARACTER-NAMES-CATALOG
      - element_id: "name_label_char_b"
        timestamp_visible_s: [0.0, 4.0]
        position: {y_pct: 11.5}
        text: "NICO"
        font: "monospaced"

  - shot_id: "shot_02"
    section_id: "setup_pre_decision"
    description: "POV walks forward toward Salvador, who stops smiling and raises hand defensively"
    duration_intent_s: 4.5

    scene_context:
      who_is_there: ["char_a", "viewer_pov"]
      who_does_what: "POV approaches Salvador, Salvador speaks warning dialogue"
      why_this_shot_exists: "Character A introduces dilemma + speaks warning"
      camera_intent: "POV continues forward motion from shot_01, slows as Salvador gets closer"

    # ⭐⭐ EXECUTION CONTINUITY
    motion_bridge_intent:
      from_previous: "POV continuing forward push-in from shot_01 (kinetic momentum sustained)"
      to_next: "POV stops approaching Salvador, transitions to shot_03 reaction view"
    pov_traversal: "walking_forward"          # continues kinetic momentum
    audio_layer_continuity: ["drone_base", "ambient_corridor"]
    visual_style_lut: "warm_industrial_v1"

    is_safe_for_veo: true
    model_tier_override: "veo_3_1"            # character speaking on-screen = Veo native lip-sync
    anchor_strict: true
    motion_type: "lip_sync_close_up"
    hero: false

    avu_overlay_clip: null
    narration_in_this_shot: "(silent — character speaks)"
    has_lip_sync_required: true               # Salvador speaks — Veo 3.1 generates with native lip-sync
    dialog_text: "No me elijas. Es una trampa."

    visual_intent: |
      Medium close-up of Salvador, POV camera now ~2m from him. His
      stitched mouth opens slightly to speak, eyes lock onto viewer.
      Subtle warm light flicker on his face. Background dust still
      visible. POV camera micro-still during dialogue.
    visual_action_match:
      matches_literal: true
      atmospheric_motions_count: 3
      atmospheric_motions_list: ["light_flicker_face", "dust_particles", "character_breathing"]

    ui_active:
      - element_id: "caption_dialog_a"
        timestamp_visible_s: [0.0, 3.5]
        position: {y_pct: 62}
        text: "NO ME ELIJAS. ES UNA TRAMPA."
        font: "drop_shadow_canonical"
        color: "white_with_red_accent"

  # ... continue per all ~20-25 shots
  # Each shot MUST have: scene_context + motion_bridge_intent + pov_traversal
  # + audio_layer_continuity + visual_style_lut + is_safe_for_veo +
  # model_tier_override + anchor_strict + visual_intent + visual_action_match.matches_literal

# ═══════════════════════════════════════════════════════════════
# 10. TRANSITIONS (effects library — Phase 2)
# ═══════════════════════════════════════════════════════════════

transitions:                                  # between shots in shot_list
  - from_shot_id: "shot_01"
    to_shot_id: "shot_02"
    transition_type: "hard_cut_with_whoosh"   # from effects-library/transitions/
    sting_audio: "whoosh-warm.mp3"
    duration_s: 0.3
    rationale: "Hook → setup transition, organic momentum continuation"

  - from_shot_id: "shot_02"
    to_shot_id: "shot_03"
    transition_type: "cross_fade_0.5s"
    duration_s: 0.5
    rationale: "Dialogue beat → reaction beat, smooth"

  # ... per all transitions. Variety target ≥3 unique types per PAUTA § 23 + AUDITOR anti-pattern #13

# ═══════════════════════════════════════════════════════════════
# 11. ASSET LIST INVENTORY (per AUDITOR C-INVENTORY gate)
# ═══════════════════════════════════════════════════════════════

asset_list:
  sfx_prompts_to_generate:                    # ElevenLabs SFX events
    - sfx_id: "footsteps_lobby"
      prompt: "single footstep on wooden floor, slight echo, dim ambient"
      duration_s: 0.5
      uses_shots: ["shot_01", "shot_02"]
    - sfx_id: "salvador_breath_close"
      prompt: "uncanny shallow breath, slight rasp, very close mic"
      duration_s: 1.5
      uses_shots: ["shot_02"]
    # ... per all SFX events

  music_to_generate:                          # Maps to music_continuous_layers above
    - "drone_base"
    - "ambient_corridor"
    - "ambient_consequence_a"
    - "accent_climax"
    - "outro_drone"

  ambient_continuous_to_generate:             # subset of music_to_generate, separate inventory
    - "drone_base"
    - "ambient_corridor"

# ═══════════════════════════════════════════════════════════════
# 12. CHANNEL IDENTITY (forward-compat for video #5+ when codified)
# ═══════════════════════════════════════════════════════════════

channel_signature:
  watermark_handle: "@elige_tucompanero"      # NEVER @referent-a
  caption_style_canonical:
    name_labels:
      font: "monospaced"
      position_y_pct: 11.5
      color: "yellow_or_white"
    narration_captions:
      font: "drop_shadow_canonical"
      position_y_pct: 62
      color: "white"
    warning_captions:
      font: "drop_shadow_canonical"
      position_y_pct: 62
      color: "red"
      prefix: "SI ELEGISTE {character}"        # canonical framing per memory feedback_si_elegiste_framing
  audio_signature:
    target_lufs: -14
    true_peak_max: -1
    music_layers_min: 3
  visual_signature:
    aspect_ratio: "9:16"
    resolution: "1080x1920"
    frame_rate: 24

# ═══════════════════════════════════════════════════════════════
# 13. ARCHITECT ANNOTATIONS (in-flight tracking)
# ═══════════════════════════════════════════════════════════════

architect_annotations:
  - timestamp: "2026-XX-XX"
    track: "FASE 0 user interview"
    note: "User confirmed pattern P<N> + setting + dyad. Counterfactual placement before_choice_resolves."

  - timestamp: "2026-XX-XX"
    track: "post-CP1 anchors"
    note: "<as auditor + engineer iter feedback flows>"

# ═══════════════════════════════════════════════════════════════
# 14. ENGINEER NOTES (carryover from CP handoffs)
# ═══════════════════════════════════════════════════════════════

engineer_notes:
  pipeline_strategy: "per_clip_atomic"
  primary_model_target: "veo_3_1"
  fallback_model: "hailuo_pro_1080p"          # for NSFW reject OR non-character shots
  lip_sync_strategy: "veo_3_1_native"          # since Veo bundles audio + lip-sync
  veo_quota_observations: "TBD"

# ═══════════════════════════════════════════════════════════════
# END SCHEMA v10
# ═══════════════════════════════════════════════════════════════
