# ═══════════════════════════════════════════════════════════════
# 1.5 REFERENCES CANONICAL (≥5/8 — mandatory linkage)
# ═══════════════════════════════════════════════════════════════

references_canonical:
  - ref_id: "ref-03"                              # canonical-scenes/ref-03-bruno-pablo-mina.md
    informs:
      - "narrative_structure.pattern"                  # P2 primario — Bruno scary-savior sobrevivible
      - "narrative_structure.counterfactual_placement" # counterfactual FINAL (default 4/5; ref-03 lo pone al final)
      - "narrative_structure.cliffhanger_archetype"    # P2 reveal sin twist verbal + Paz-perdida outro
      - "characters.char_a"                            # Dario = Bruno-analog (apariencia uncanny máxima + scary-savior P2)
      - "shot_list.shot_06.narration_in_this_shot"     # D1 categoría curiosidad/obediencia (linterna→riel) + objeto/entorno tentador
      - "shot_list.shot_07.narration_in_this_shot"     # consequence-A framing acción-condicional ('Si la enciendes'→'Si pisas los rieles')
      - "editing_targets.pacing_modulation"
    why_relevant: "ref-03 (P2, 9.04/10) es el referente MAESTRO de este video — su estructura calca 1:1 la mía. (a) PATTERN P2: Bruno (cíclope cuello largo, casco minero — apariencia uncanny máxima) parece trampa pero es SOBREVIVIBLE si esperás (no enciendes linterna / no activás alarma) → Dario (máscara respirador goteando) parece trampa pero sus reglas procedurales ('Pisa el cemento' / 'Quieto' / 'Espera la siguiente') te sacan vivo. (b) 3 DECISIONES ANIDADAS ESCALADAS con stakes crecientes (linterna→seguir→alarma → riel→quieto/correr→barra), categorías DIFERENTES. (c) DINÁMICA DE CONTROL PROCEDURAL del malo (Bruno apaga luces 'los ojos se adaptan solos' / Dario da órdenes cortas señalando el piso). (d) COUNTERFACTUAL FINAL Paz-perdida (Pablo cartas+pan+amanecer → Tobias caseta+estufa+termo+gato+tango). (e) P2 REVEAL SIN VERBALIZAR (Bruno entrega el relevo al amanecer = era trabajador → Dario te sube la escalera y ves el cielo = el túnel ya lo tocó a él, conocía las reglas). (f) Body horror específico al setting (taladro/dinamita/pozo de mina → descarga eléctrica/agua negra/barra al rojo de túnel)."

  - ref_id: "ref-10"                              # canonical-scenes/ref-10-rurik-enzo-fundicion.md
    informs:
      - "shot_list.shot_05.narration_in_this_shot"    # D1 dinámica procedural del malo (Bruno-Rurik dan órdenes técnicas)
      - "shot_list.shot_15.narration_in_this_shot"    # D3 prop diegético de la decisión climática (escalera/barra ↔ válvula/llave)
      - "music_continuous_layers.drone_base"
    why_relevant: "Préstamo de dinámica procedural + body horror industrial. (1) Rurik (traje hazmat, máscara con globos oculares — enmascarado/deforme como Dario) da órdenes PROCEDURALES técnicas ('Ponte el traje / Abre la válvula') que el viewer debe seguir o resistir → calco la dinámica de control de Dario (operario enmascarado que da órdenes cortas señalando el piso/escalera). (2) ref-10 categoría sumisión/resistencia procedural en su decisión de la válvula → mi D3 (atrapar la barra que Dario suelta vs esperar la siguiente) es la misma categoría procedural-confianza en el clímax. (3) Body horror específico al setting industrial-eléctrico (Rurik vapor/quemadura → la barra al rojo del cableado sella la palma de Dario-context). (4) Drone industrial bajo continuo del túnel de metro."

  - ref_id: "ref-06"                              # canonical-scenes/ref-06-enzo-axel-carretera.md
    informs:
      - "shot_list.shot_11.narration_in_this_shot"    # D2 acción/pasividad (correr vs quedarse inmóvil)
      - "shot_list.shot_12.narration_in_this_shot"    # consequence-A acción-condicional ('Si tocas el claxon'→'Si corres')
      - "narrative_structure.canonical_constraints.consequence_framing_style"
    why_relevant: "ref-06 (P1 puro) es el calco directo de mi D2: la opción ganadora va CONTRA el impulso. Axel: 'quedate inmóvil, no reacciones' → 'Si tocas el claxon / Si enciendes la luz, Axel se enfurece y te arrastra'; quedarse quieto = sobrevivir. Mi D2 es idéntico en mecánica: 'algo respira en el agua de filtración, Dario levanta la mano: quieto' → 'Si corres, el chapoteo atrae lo que vive en el charco y te arrastra bajo el agua negra'; quedarse inmóvil = sobrevivir. Calco: (a) la dinámica acción/pasividad donde el impulso (huir del ruido) mata y la pasividad salva; (b) el framing acción-condicional 'Si corres'; (c) body horror específico (Axel rompe ventana y arrastra → la criatura del charco arrastra bajo el agua negra). Categoría DIFERENTE a D1 (curiosidad/obediencia) y D3 (confianza procedural) — variedad PAUTA § 11."

  - ref_id: "ref-09"                              # canonical-scenes/ref-09-victor-axel-cockpit.md
    informs:
      - "narrative_structure.emotional_framing"        # stakes_lift
      - "shot_list.shot_19.narration_in_this_shot"     # resolución P2/P9 somber sin twist verbal ('sales con vida' / 'ves el cielo')
      - "shot_list.shot_21.narration_in_this_shot"     # cierre somber relief, NO festivo
    why_relevant: "ref-09 (P9, 8.99/10) informa el TONO de la resolución y el cierre. Victor (esquelético+máscara, parece amenazante) SALVA cuando obedecés sus órdenes técnicas y el cierre es 'Felicidades, sigues con vida' — resolución SOMBER, no festiva, sin twist verbal. Calco ese registro para mi resolución: Dario te sube la escalera, sueltas la barra correcta, ves el cielo abrir → 'Sales con vida' somber relief (NO celebración). emotional_framing stakes_lift (la apariencia monstruosa de Dario sube las stakes de cada decisión). NOTA: mi counterfactual va al FINAL (ref-03 placement), NO al inicio como ref-09 — solo tomo de ref-09 el registro de la resolución del scary-savior, no su placement invertido."

  - ref_id: "ref-08"                              # canonical-scenes/ref-08-hugo-pablo-acuario.md
    informs:
      - "characters.char_b"                          # Tobias = bueno aparente que OFRECE algo (termo ↔ Pablo/Hugo) — presente SOLO en hook/counterfactual/cliffhanger (§2.2)
      - "shot_list.shot_01.narration_in_this_shot"    # hook dyad — el bueno aparente con postura acogedora ofreciendo
    why_relevant: "Préstamo de diseño del bueno-aparente. ref-08 Hugo (esqueleto humanoide alto + pipa — visualmente extreme PERO postura no amenazante, ofrece, habla suave) + Pablo (ofrece, postura relajada) informan a Tobias: bueno-aparente cuya seña es la POSTURA ACOGEDORA (sentado, ofreciendo un termo caliente, sonriendo) NO la tameness visual — Tobias tiene una sonrisa con demasiados dientes pequeños (uncanny por contraste, PAUTA § 5: el bueno aparente puede ser visualmente extreme). INVARIANTE § 2.2: como Pablo/Hugo, Tobias aparece SOLO en hook + counterfactual + cliffhanger, NUNCA decidiendo en el played path. Su outcome cozy en el counterfactual (caseta+estufa+termo) calca el Paz-perdida laboral cozy de Hugo (acuario+café+relevo)."

  # Refs NOT usados (declaro razón — recomendado):
  # - ref-11 (@referent-c atypical, NO referent-a canon — excluido per INDEX outliers flag)
  # - ref-12 (outro emocional 43s melodramático + apuñalamiento, tono ajeno al P2 procedural-industrial)
  # - ref-13 (P6 hedonismo + Miro sin boca + cuts-flooding 77s outro — pattern ajeno; mi cliffhanger NO es trampa hedonista)

# ═══════════════════════════════════════════════════════════════
# 2. ASSEMBLY STRATEGY
# ═══════════════════════════════════════════════════════════════

assembly_strategy: "per_clip_atomic_hybrid"     # Hard Rule #25 — V4+ canonical

# ═══════════════════════════════════════════════════════════════
# 3. HYBRID LAYERS DECLARATION (Hard Rule #25)
# ═══════════════════════════════════════════════════════════════

hybrid_layers:
  layer_1_per_clip_atomic:
    description: "Per-shot mp4 con visual + audio clip-scoped + captions BURNED en frame data"
    captions_source: "whisper_from_clip_audio"
    captions_burn_script: "scripts/build_clip_atomic.py --bake-captions"
    audio_bundled_per_clip:
      # HR#25: narrator EXCLUIDO de Layer 1 → vive SOLO como narrator_master_continuous en Layer 3
      # (captions burned per-clip + narrator continuous Layer 3). Layer 1 bundlea SOLO:
      # character dialog (Dario, lip-sync) + diegetic SFX + clip-scoped ambient.
      - "character_dialog_within_this_clip"        # Dario (lip-sync, tiene boca bajo la máscara → voz procesada) — shots 05/10/15. Tobias NO habla en played path (removido por invariante § 2.2).
      - "diegetic_sfx_within_this_clip"
      - "clip_scoped_ambient_short"
    output_path_convention: "<project>/assets/clips-atomic/shot_NN_<descriptor>_atomic.mp4"
    manifest_path_convention: "<project>/assets/clips-atomic/shot_NN_<descriptor>_manifest.yaml"

  layer_2_effects_between_clips:
    # v11.2 NB-2 fix: alineado 1:1 con la transitions table (§11). old_screen_glitch_error se usa SOLO en
    # los boundaries muerte→bridge y bridge→ramaB (glitch corte-TV — cambio de historia); el boundary
    # played→counterfactual usa cross_fade_warm (NO glitch). white-flash en decisión→consecuencia-A; hard-cut+whoosh hook→setup.
    description: "Transiciones + stings en boundaries (alineado a §11 transitions table): hard_cut+whoosh metálico (hook→setup); freeze_into_decision_filter (setup→decisión); white_flash_impact en decisión→consecuencia-A (body horror); old_screen_glitch_error (glitch corte-TV pantalla antigua) SOLO en muerte→bridge y bridge→ramaB (PAUTA § 2.4 perspectiva 6); cross_fade_warm en resolución→played→counterfactual→cliffhanger (NO glitch en played↔counterfactual)"
    effects_library_ref: "transitions/horror-choice/transitions/"   # carpeta global root (2026-06-05); old_screen_glitch_error horror-choice ONLY
    transition_variety_min: 3
    non_diegetic_sfx_placement: "effect_layer"

  layer_3_cross_clip_continuous:
    description: "Audio que NO corta en boundaries — overlaid post-concat con sidechain duck"
    layers:
      - "narrator_master_continuous"
      - "music_drone_base"
      - "ambient_continuous_environment"
    sidechain_target_db: -6
    overlay_pipeline: "scripts/build-video-hybrid.py --post-concat-overlay"

  layer_4_hyperframes_ui_overlay:
    description: "Countdown film-leader academy + decision UI (loading Y52 / countdown Y46) + outro card + name labels persistentes through-countdown"
    elements:
      - "countdown_3_2_1_hook"
      - "decision_freeze_d1"
      - "decision_freeze_d2"
      - "decision_freeze_d3"
      - "outro_card_cliffhanger"
      - "watermark_handle_persistent"

# ═══════════════════════════════════════════════════════════════
# 4. CHARACTERS (real invented names + name_validation gate)
# ═══════════════════════════════════════════════════════════════

characters:
  - character_id: "char_a"
    name: "Dario"
    name_validation:
      is_real_invented_name: true
      blacklist_check_passed: true                 # NO job description (no "Operario/Maquinista/Guardavías")
      canonical_8_refs_pattern: "real_first_name"
    role: "malo_aparente"                          # APARIENCIA: monstruosa/amenazante (máscara respirador, hule goteando). VERDAD P2: sobrevivible — el elegido que JUGÁS.
    archetype: "P2 — Supervivencia si manejás bien (el operario enmascarado del túnel conoce las reglas; obedecerlo sin pánico te saca vivo) — Bruno-analog (ref-03) / Rurik-analog (ref-10)"
    visual_signature: |
      Operario de túnel humano, complexión robusta, ≈1.85m. Overol de hule reflectante NEGRO
      empapado que GOTEA constantemente agua de filtración (textura húmeda brillante, no anatomía).
      LA FIRMA UNCANNY (legible, estática, máscara-coupled): la cara cubierta por una MÁSCARA DE
      RESPIRADOR ANTIGUO de DOBLE FILTRO — dos cilindros de filtro gemelos sobresaliendo a la altura
      del pecho/mentón como "ojos falsos", lentes de visor circulares empañados que ocultan los ojos
      reales. La máscara le deforma la voz a un zumbido grave. Casco con lámpara frontal que NUNCA
      apunta al viewer: SIEMPRE apunta al piso (cono de luz hacia abajo). Guantes de hule negro
      mojados. Postura procedural, gestos cortos y secos. Da miedo: el viewer desconfía de él y
      confía en el cálido Tobias. Contraste vs Tobias: hule-negro-mojado-máscara-zumbido vs
      lana-cálida-rostro-humano-termo.
    voice_id_canonical: "K3TeN3ZVK8WnOeJ0NYqZ"     # placeholder; engineer asigna voz propia de personaje (procesada: lowpass + reverb leve para el zumbido de máscara) en CP2 — ver D27 voice processing block + MODEL-CAPABILITIES-MATRIX character_voices
    anchor_image_id: "char_a_v1"
    visual_signature_critical_loci: ["respirator_mask_twin_filters"]   # MODEL-BEHAVIOR-LOG Entry 1 — la máscara de doble filtro es el rasgo raro aislable de la cara en close-ups
    locus_anchor_required: true                    # firma rara (máscara doble filtro) aislable en close-ups POV → locus anchor obligatorio
    locus_anchors:
      - locus_id: "respirator_mask_twin_filters"
        anchor_image_id: "char_a_v1_mask"
        when_used: "SOLO close-ups donde la máscara ocupa el frame sin cuerpo/escena (Entry 3: usar este locus como --ref en full-scene inserta la máscara como objeto duplicado flotante; en full-scene del personaje va el full anchor + máscara reforzada por prompt)"

  - character_id: "char_b"
    name: "Tobias"
    name_validation:
      is_real_invented_name: true
      blacklist_check_passed: true                 # NO job description
      canonical_8_refs_pattern: "real_first_name"
    role: "bueno_aparente"                         # APARIENCIA: cálida, acogedora (chaleco de lana, termo). VERDAD P2: su path cozy es el counterfactual (lo que NO viviste).
    archetype: "P2 dyad partner — el guardavías cálido cuyo recorrido cozy es el counterfactual Paz-perdida; visualmente extreme por contraste (sonrisa con demasiados dientes), no tame (PAUTA § 5) — Pablo/Hugo-analog (ref-03/ref-08)"
    visual_signature: |
      Guardavías viejo, hombre mayor de rostro apergaminado y arrugado, ≈1.70m, postura SENTADA
      acogedora en un banco de servicio. Viste un CHALECO DE LANA GRUESO color MOSTAZA sobre camisa
      de trabajo gastada, gorra de guardavías. Sostiene una LINTERNA DE ACEITE de luz cálida ámbar y
      un TERMO metálico que ofrece al viewer. Su uncanny es sutil y por contraste: una SONRISA CON
      DEMASIADOS DIENTES PEQUEÑOS, demasiado parejos, que se ve cálida a primera vista pero inquieta
      al mirarla fijo. Piel apergaminada, ojos amables entrecerrados. NO tiene deformidad obvia: el
      horror es que lo CÁLIDO y acogedor es el camino que dejaste atrás. Contraste vs Dario:
      lana-cálida-rostro-humano-termo-luz-ámbar vs hule-negro-mojado-máscara-zumbido-luz-al-piso.
    voice_id_canonical: "K3TeN3ZVK8WnOeJ0NYqZ"     # placeholder; engineer asigna voz cálida masculina mayor propia en CP2. v11.2: Tobias AHORA habla 1 línea de lure en el hook (shot_01) → voz cálida diegética (D27 block tobias_voice_processing). NO usado en el played path (invariante § 2.2 intacto — hook ES zona permitida de Tobias).
    anchor_image_id: "char_b_v1"
