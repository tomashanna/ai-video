# 13. ARCHITECT ANNOTATIONS (design rationale + creative decisions)
# ═══════════════════════════════════════════════════════════════════════════════

architect_annotations:
  - timestamp: "2026-05-21 PM late"
    track: "CP0 SPEC v10 initial design"
    note: |
      DESIGN DECISIONS LOG:

      1. PATTERN P5 selection — "Familiaridad aterradora / Extranjería protectora":
         P5 has NEVER been used. PATTERNS.md matriz expandida § 3.5 lists P5 as
         "Doble peligro visible" (fatalism) — but architect reframes for this video
         as familiarity/foreignness lens, which fits canonical patterns (one figure
         REAL danger, other REAL safety) without being P3 (ambos engañan). Cliffhanger
         remains horror (estancamiento) but the OPTION B path is genuinely safe.
         This is closest to a P1/P9 hybrid actually — but framed by architect as a
         distinct P5 variant. Codify post-ship if successful.

      2. CLIFFHANGER "estancamiento_eterno" — NEW archetype:
         Differentiated from "bucle_eterno" (loop = repeating events) and
         "prision_emocional" (psychological prison). Estancamiento = held in a
         single moment of dusk indefinitely, no time progression, no events
         happening, no escape. The sun position never changes. Mateo holds new
         boletos for new arrivals. Viewer becomes part of the park furniture.

      3. LONGER CLIPS strategy — 13 shots × ~7s avg:
         Per user directive 2026-05-21 PM late. Trading cuts/min canonical band
         (14-22) for EXECUTION CONTINUITY gain. Bet: longer clips with internal
         kinetic momentum + cross-shot motion bridges = higher exec dim score
         than dense cuts with teleports.

      4. EXECUTION CONTINUITY ENGINEERING:
         Every cut transition designed with motion_bridge_intent + pov_traversal
         enum + audio_layer_continuity declared + visual_style_lut consistent
         within section. Section boundaries (warm→cool at shot_06→shot_07, cool→warm
         at shot_09→shot_10, etc.) are EXPLICITLY DESIGNED LUT shifts with
         narrative motivation (warm dusk = surface, cool teal = underground/trap,
         softer warm = relief).

      5. COUNTERFACTUAL TWIN ENDING per PAUTA § 24.8:
         Twin ending at 60-70s = brief safe walk with Bryan to exit gate. Framed as
         RELIEF CONTRAST (NOT retrospective closure). Critically: counterfactual
         appears AFTER path A climax (shot_09) but BEFORE final cliffhanger (shot_12).
         This is the "good_path_at_end" variant per § 24.3 catalog.
         Per § 24.8 refinement: twin_ending_good_alternate + relief_contrast = 9/10
         canonical variant. NOT after_both_paths_retrospective (which would be
         cinema-abandonado anti-pattern).

      6. VEO 3.1 PRIMARY all shots:
         All 13 shots designated VEO-SAFE (no explicit gore, atmospheric horror only).
         Mateo uncanny but not gore. Bryan grounded normal. Tunnel descent atmospheric
         not graphic. Climax = recognition + stagnation reveal (not blood). Cliffhanger
         = new boleto + waiting (not death). Per § 8.18 test bench validated Veo accepts
         this content type.

      7. CHARACTER VOICE strategy:
         Same voice_id (Oxley 2gPFXx8pN3Avh27Dw5Ma) for narrator + Mateo + Bryan,
         differentiated by voice_processing_note (Mateo muffled + reverb hollow,
         Bryan quiet raspy no-reverb, narrator standard). Per voices-catalog.json
         this voice is validated canonical default 2026-05-18.

      8. SPANISH NEUTRAL throughout:
         Per memory feedback_spanish_neutral (matadero post-ship lesson). All
         narration uses tú/dices/eliges. NEVER vos/decís/elegís. International
         Instagram audience.

      9. ANTI-CLICHÉ horror writing:
         No "te conviertes en cena", no "bucle eterno", no "nunca encuentras la
         salida". Original specific concrete sensory: "El sol está donde lo dejaste",
         "Otro boleto para el próximo que llegue".

      10. CALIBRATED v4 10-DIMENSION COVERAGE design notes:

      Dim 1 EXECUTION CONTINUITY (30%): EVERY shot has motion_bridge_intent +
      pov_traversal + audio_layer_continuity + visual_style_lut. Per-section LUT
      consistency declared. Cross-section LUT transitions narratively motivated.
      Target: 9.0+ on this dimension primary.

      Dim 2 INMERSIÓN POV (15%): First-person POV permanent (memory
      feedback_first_person_pov). POV hands visible at shot_07 (taking boleto).
      POV body visible at shot_08 (descending). POV breath visible multiple shots.
      Target: 9.0+.

      Dim 3 SOUND DEPTH (15%): 9 music_continuous_layers declared (Layers 1-4
      including footsteps_continuous foley). drone_base spans 0-91s continuous.
      Per-section ambient changes (park_dusk → tunnel_resonance → ambient_park_dusk
      brief return → tunnel_resonance → estancamiento_drone). Accents declared
      per § 25.1 catalog. Target: 9.0+.

      Dim 4 ATMOSPHERE (10%): Every shot has atmospheric_motions_count ≥4
      explicitly listed. Setting "alive" elements per PAUTA § 20 declared.
      Park-dusk catalog includes dust + umbrella sway + leaves + Mateo wave +
      Bryan flashlight. Tunnel catalog includes water drip + teal light pulse +
      breath visible + rust particles + amber dusk flash. Target: 9.0+.

      Dim 5 CHARACTER (10%): Mateo uncanny signature (cartoon mask fixed smile +
      human eyes through holes + torn seams) is DISTINCT and READABLE. Bryan
      "strangely normal" signature works as P5 inversion. STRICT anchors all
      shots policy per § 8.14. Active gestures: Mateo's mechanical wave repeating,
      mechanical head turn at shot_12, boleto reveal. Bryan: flashlight sweep,
      tank top breeze, whistle cord swing, eye contact + glance-aside gesture.
      Target: 9.0+.

      Dim 6 STORY LOGIC (5%): Counterfactual placement = twin_ending_good_alternate
      + relief_contrast = canonical 9/10 variant per § 24.8. NOT retrospective.
      Story chain: enter → meet dyad → choose Mateo → descend → return to start →
      see counterfactual → return to trap → cliffhanger new boleto. Clean.

      Dim 7 EDITING (5%): cuts/min target 8-11 BELOW canonical band 14-22 = ACCEPTED
      TRADE-OFF for execution continuity per V3 directive. Transition variety = 6
      types declared (hard_cut_with_whoosh, cross_fade_0_5s, cross_fade_1_0s,
      light_flash_impact, glitch_transition, fade_to_black_partial_0_5s). ≥4
      target MET. Pacing modulation: hook slow + dialogue mid + descent + climax
      + counterfactual relief + cliffhanger + outro = modulated.

      Dim 8 HOOK 0-9s (5%): shot_01 = 9.0s = entire hook ONE shot per V3 directive.
      Name labels @ 0-4s + caption setting @ 2-4s + narrator framing @ 4-6.5s +
      push-in @ 6.5-8s + countdown @ 8-11s (countdown FILM LEADER ACADEMY AVU
      bundled). Canonical hook sub-beat ordering per PAUTA § 19.5.

      Dim 9 CAPTIONS (3%): canonical drop-shadow style per channel_signature.
      Monospaced name labels Y 11.5. Narration captions Y 62. Warning captions
      red. "SI ELEGISTE BRYAN/MATEO" framing per memory.

      Dim 10 NARRATIVE COMPREHENSION (2%): Clear dilemma (familiar mascot vs
      foreign protector). Clear counterfactual logic (Bryan would have led to exit).
      Clear cliffhanger (estancamiento). Viewer can explain video in 1 frase.

      ALL 10 DIMENSIONS addressed in design. Target overall ≥9.0 calibrated v4.

