# ═══════════════════════════════════════════════════════════════════════════════
# 6. MUSIC LAYERS (cross-clip Layer 3 — PAUTA § 25 + INGENIERO § 8.11)
# ═══════════════════════════════════════════════════════════════════════════════

music_continuous_layers:
  # ─── LAYER 1: DRONE (continuous 0-91s, the tonal bed) ───
  - layer_id: "drone_base"
    sections: [{from: 0, to: 91, intent: "low subharmonic tonal bed sustains entire video, sets dread"}]
    eleven_labs_prompt: "low subharmonic drone, sustained 40-100 Hz fundamental, dark cinematic horror ambient, no melody, no rhythm, slight atmospheric swells every 15s, evocative of dusk emptiness, suitable for abandoned park horror"
    compose_strategy: "single_continuous_91s"
    target_lufs_pre_mix: -27
    sidechain_duck_target: true  # ducks under narration

  # ─── LAYER 2: AMBIENT (per-section setting texture) ───
  - layer_id: "ambient_park_dusk"
    sections:
      - {from: 0, to: 35, intent: "abandoned park exterior dusk ambience"}
      - {from: 60, to: 70, intent: "return for counterfactual twin"}
    eleven_labs_prompt: "abandoned amusement park dusk atmosphere, distant cicadas fading, subtle wind through empty corridors, faint creak of metal swing in distance, mid-frequency textural bed, no music"
    compose_strategy: "loop_15s_stretched"
    target_lufs_pre_mix: -30

  - layer_id: "tunnel_resonance"
    sections:
      - {from: 37, to: 60, intent: "underground slide tunnel resonance"}
      - {from: 70, to: 84, intent: "return to path A trapped"}
    eleven_labs_prompt: "underground concrete tunnel resonance, claustrophobic acoustic, distant water drip echo, low-frequency rumble, hollow reverb tail, no music"
    compose_strategy: "loop_12s_stretched"
    target_lufs_pre_mix: -28

  - layer_id: "ambient_park_dusk"  # NOTE intentional reuse for sec 60-70 counterfactual return
    # (architect declares reuse for continuity — engineer can implement as same source file)
    sections: [{from: 60, to: 70, intent: "counterfactual park return — same ambient signals path B is the safe alternate"}]
    eleven_labs_prompt: "(same as above — same source asset reused for continuity)"
    compose_strategy: "loop_8s_stretched"
    target_lufs_pre_mix: -29

  # ─── LAYER 3: ACCENT (event-driven cues) ───
  - layer_id: "wind_subtle"
    sections:
      - {from: 22, to: 35, intent: "wind accents during dyad dialogue, slight cold breath visible cue"}
      - {from: 32, to: 37, intent: "wind sustained through decision UI"}
    eleven_labs_prompt: "very subtle dry wind through empty space, low whisper-like quality, slight modulation"
    compose_strategy: "loop_8s_stretched"
    target_lufs_pre_mix: -32

  - layer_id: "low_pulse_climax"
    sections: [{from: 50, to: 60, intent: "rising tension accent during climax reveal"}]
    eleven_labs_prompt: "dark cinematic low-frequency pulse rising, accent buildup, no melody, drone-adjacent climax cue"
    compose_strategy: "single_10s"
    target_lufs_pre_mix: -25

  - layer_id: "warm_relief_accent"
    sections: [{from: 60, to: 70, intent: "subtle warmth accent during counterfactual twin"}]
    eleven_labs_prompt: "soft warm tonal accent, slight harmonic resolution, gentle relief from horror tension, subtle, brief"
    compose_strategy: "single_10s_fade_in_out"
    target_lufs_pre_mix: -27

  - layer_id: "estancamiento_drone"
    sections: [{from: 70, to: 91, intent: "stagnation drone — eternal twilight tonality"}]
    eleven_labs_prompt: "deeper subharmonic drone with slight harmonic distortion, eternal-feeling sustained tone, suggests time-frozen quality, slow swell every 10s"
    compose_strategy: "single_21s_seamless_loop"
    target_lufs_pre_mix: -26

  - layer_id: "outro_subdrone"
    sections: [{from: 84, to: 91, intent: "outro card sustained tension fade"}]
    eleven_labs_prompt: "sustained low frequency hum, gradual fade-out target -45 dB at 91s"
    compose_strategy: "single_7s_fade_out"
    target_lufs_pre_mix: -28

  # ─── LAYER 4: FOOTSTEPS (continuous foley — bridges cuts per GAP #40 audio bridge) ───
  - layer_id: "footsteps_continuous"
    sections: [{from: 9, to: 22, intent: "POV walking footsteps bridges shots 2-3 (audio bridge GAP #40)"}]
    eleven_labs_prompt: "single pair of dry footsteps on concrete plaza, slow steady walking pace, slight echo, no shoes squeak, continuous loop"
    compose_strategy: "loop_4s_seamless"
    target_lufs_pre_mix: -22

# ═══════════════════════════════════════════════════════════════════════════════
# 7. PACING + EDITING TARGETS (V3 LONGER CLIPS STRATEGY — user creative direction)
# ═══════════════════════════════════════════════════════════════════════════════

editing_targets:
  # ⚠️ V3 STRATEGY: longer clips intentionally below canonical band 14-22 cuts/min
  # User creative direction 2026-05-21 PM late: "Better 10 cuts bien bridged than 20 cuts con teleports"
  # Trade-off: lower cuts/min, MUCH higher EXECUTION CONTINUITY scoring
  target_cuts_per_min: [8, 11]              # V3 INTENTIONAL — below canonical
  target_total_cuts: [12, 16]               # for 91s reel
  rationale_for_below_canonical_band: |
    Per ARCHITECT-BRIEFING-VIDEO-3.md § "V3 PRIMARY DIRECTIVE — Longer clips":
    - Canonical band 14-22 cuts/min was empirically measured but PRIMARY GOAL is
      EXECUTION CONTINUITY ≥9.0 (calibrated v4 dim 1, 30% weight).
    - Cinema iter 1-6 had 12 cuts/min and was perceptually weak BECAUSE of
      execution discontinuity, not the cut count itself.
    - Ref-2 cockpit had 13 cuts/min modulated and scored 9.0/10 overall — proving
      LOW cuts/min works IF execution bridges hold.
    - V3 designed with 13 shots ~7s each = ~9 cuts/min. Each shot has INTERNAL
      kinetic motion (Veo 3.1 prompts encode journey-within-clip). Cross-shot
      transitions all have motion_bridge_intent encoded.
    - Architect commits: pace target ≥9.0 calibrated v4 + ≥9.0 user perceptual
      with this strategy. Failure would invalidate the longer-clips hypothesis.

  transition_variety_min: 4  # min 4 unique transition types per INGENIERO § 8.13.2 body target

  pacing_modulation:                         # by section
    hook: [6, 7]                             # 1 shot, ~8.5s = ~7 cuts/min equivalent
    approach_setup: [10, 12]                 # 2 shots, 13s
    dyad_dialogue: [10, 12]                  # 2 shots, 10s
    decision_ui: [12, 13]                    # 1 shot, 5s
    path_a_descent: [10, 12]                 # 2 shots, 15s
    path_a_climax: [7, 8]                    # 1 shot, 8s
    counterfactual_twin: [6, 7]              # 1 shot, 10s
    return_path_a: [8, 10]                   # 2 shots, 14s
    outro_card: [4, 6]                       # 1 shot, 7s

# ═══════════════════════════════════════════════════════════════════════════════
# 8. NARRATION SCRIPT (per speaker / per segment)
# ═══════════════════════════════════════════════════════════════════════════════
# Spanish neutral per memory feedback_spanish_neutral — tú/dices/eliges
# Anti-cliché per memory feedback_anti_cliche_horror — NO "te conviertes en cena", "bucle eterno"
# "Si elegiste X" framing per memory feedback_si_elegiste_framing — universal canonical
# Narration coherence per memory feedback_narration_coherence — sujeto+verbo+conexión NOT staccato

narration_script:
  meta:
    target_total_duration: 91s
    target_speaking_wpm: 165               # median canonical INGENIERO-PAUTA § 1.1
    target_total_words_estimated: 195
    register: "tu_implicito_presente_indicativo"  # Spanish neutral
    speakers: [narrator, char_a, char_b]
    coherence_rule: |
      Narración CLARA NO tenebrosa (PAUTA § 3 2026-05-16). Sujeto + verbo + conexión.
      Estilo tenebroso emerge de visual+SFX+drone, NO de adjetivos. Anti-cliché:
      no "bucle eterno", no "te conviertes en", no "nunca encuentras la salida".
    coverage_target_pct: 70                # ≥70% per Hard Rule #13 + INGENIERO § 1.3

  segments:
    - segment_id: "hook_narrator_setting"
      order: 1
      speaker: "narrator"
      voice_id: "2gPFXx8pN3Avh27Dw5Ma"
      text_canonical: "Elige a tu compañero. Para salir del parque."
      timestamp_intent_s: [4.0, 6.5]
      shot_id_anchor: "shot_01"
      lip_sync_required: false             # narrator off-screen
      pause_after_strict_s: 1.5            # countdown space
      keyword_highlights: [{word: "ELIGE", color: yellow}, {word: "SALIR", color: red}]

    - segment_id: "approach_narrator_setup"
      order: 2
      speaker: "narrator"
      voice_id: "2gPFXx8pN3Avh27Dw5Ma"
      text_canonical: "El parque cerró hace años. Pero las luces todavía funcionan al atardecer."
      timestamp_intent_s: [12.0, 16.5]
      shot_id_anchor: "shot_02"
      lip_sync_required: false
      pause_after_strict_s: 0.5

    - segment_id: "approach_narrator_dyad_intro"
      order: 3
      speaker: "narrator"
      text_canonical: "Mateo te ofrece un boleto. Bryan baja la luz cuando pasas."
      voice_id: "2gPFXx8pN3Avh27Dw5Ma"
      timestamp_intent_s: [17.0, 21.5]
      shot_id_anchor: "shot_03"
      lip_sync_required: false
      pause_after_strict_s: 0.3
      keyword_highlights: [{word: "MATEO", color: yellow}, {word: "BRYAN", color: yellow}, {word: "BOLETO", color: red}]

