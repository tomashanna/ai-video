<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

#lower-stamp {
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  background: #060606;
  position: relative;
}

.scanlines {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent 0px, transparent 3px,
    rgba(0,0,0,0.3) 3px, rgba(0,0,0,0.3) 4px
  );
  pointer-events: none;
  z-index: 900;
}

.vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 100%, transparent 0%, rgba(0,0,0,0.9) 100%);
  pointer-events: none;
  z-index: 890;
}

.lower-content {
  position: absolute;
  bottom: 210px;
  left: 80px;
  right: 80px;
}

.rule {
  width: 100%;
  height: 3px;
  background: #e8e8e8;
  margin-bottom: 18px;
  transform-origin: left center;
  transform: scaleX(0);
  box-shadow: 0 0 10px rgba(255,255,255,0.4);
}

.main-text {
  font-family: 'Bebas Neue', 'Impact', sans-serif;
  font-weight: 400;
  font-size: 118px;
  line-height: 1;
  color: #f0f0f0;
  text-shadow: 0 0 30px rgba(255,255,255,0.3), 3px 3px 0 rgba(0,0,0,0.95);
  letter-spacing: 8px;
  opacity: 0;
  transform-origin: left center;
}

.sub-text {
  font-family: 'Bebas Neue', 'Impact', sans-serif;
  font-size: 38px;
  letter-spacing: 16px;
  color: rgba(190,190,190,0.7);
  text-shadow: 0 0 12px rgba(255,255,255,0.15);
  opacity: 0;
  margin-top: 12px;
}

.flash {
  position: absolute;
  inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
  z-index: 850;
}
</style>
</head>
<body>
<div id="lower-stamp" data-composition-id="lower-stamp" data-width="1080" data-height="1920" data-start="0">
  <div class="vignette"></div>
  <div class="lower-content" id="lower-content">
    <div class="rule" id="rule"></div>
    <div class="main-text" id="main-text">THE WITNESS</div>
    <div class="sub-text" id="sub-text">DISAPPEARED · 1987</div>
  </div>
  <div class="flash" id="flash"></div>
  <div class="scanlines"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });

// Pre-flash — impact incoming
tl.to("#flash", { opacity: 0.72, duration: 0.04, ease: "none" }, 0.24);
tl.to("#flash", { opacity: 0, duration: 0.18, ease: "power2.out" }, 0.28);

// Rule slams in hard
tl.to("#rule", { scaleX: 1, duration: 0.14, ease: "power4.out" }, 0.28);

// Main text stamps down — scale from large, hard impact
tl.fromTo("#main-text",
  { scale: 1.55, opacity: 0 },
  { scale: 1, opacity: 1, duration: 0.18, ease: "power4.out" },
  0.28
);

// Secondary micro-flash on impact
tl.to("#flash", { opacity: 0.45, duration: 0.03, ease: "none", overwrite: "auto" }, 0.3);
tl.to("#flash", { opacity: 0, duration: 0.14, ease: "power2.out", overwrite: "auto" }, 0.33);

// Subtitle drops from above
tl.fromTo("#sub-text",
  { y: -22, opacity: 0 },
  { y: 0, opacity: 1, duration: 0.22, ease: "power3.out" },
  0.44
);

// Hold flicker
tl.to("#lower-stamp", { opacity: 0.84, duration: 0.04, ease: "none" }, 1.72);
tl.to("#lower-stamp", { opacity: 1, duration: 0.05, ease: "none", overwrite: "auto" }, 1.76);
tl.to("#lower-stamp", { opacity: 0.88, duration: 0.03, ease: "none" }, 2.8);
tl.to("#lower-stamp", { opacity: 1, duration: 0.04, ease: "none", overwrite: "auto" }, 2.83);

// Exit — slight scale-down then fade
tl.to(["#main-text", "#sub-text"], { scale: 0.94, opacity: 0, duration: 0.3, ease: "power2.in" }, 3.45);
tl.to("#rule", { opacity: 0, scaleX: 0, duration: 0.28, ease: "power2.in" }, 3.45);

window.__timelines["lower-stamp"] = tl;
</script>
</body>
</html>
