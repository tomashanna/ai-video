# 1.5 REFERENCES CANONICAL (≥5/8 — mandatory linkage)
# ═══════════════════════════════════════════════════════════════

references_canonical:
  - ref_id: "ref-09"                              # canonical-scenes/ref-09-victor-axel-cockpit.md
    informs:
      - "narrative_structure.pattern"                  # P9 primario
      - "narrative_structure.counterfactual_placement" # counterfactual OPENING before_choice_resolves
      - "narrative_structure.emotional_framing"        # stakes_lift
      - "narrative_structure.cliffhanger_archetype"    # P9 — outro variante (resolución + cliffhanger semillas)
      - "shot_list.shot_02.narration_in_this_shot"     # counterfactual OPENING Celeste cozy ANTES del path
      - "characters.char_a"                            # Bruno = Victor-analog (parece peligroso, te salva)
    why_relevant: "ref-09 (P9, 10/10 comprensión narrativa) es el referente MAESTRO de este video. Victor (esquelético + máscara, parece amenazante) es EL QUE TE SALVA dando órdenes que parecen siniestras pero son técnicas correctas → calco 1:1 con Bruno (musgo en la piel, parece infectado/contaminado, pero sus reglas raras 'No comas la fruta / No riegues de noche / Abre la válvula de CO2' son las que te sacan vivo). Calco: (a) counterfactual OPENING — Axel cozy al inicio (0:00-0:10) ANTES de que el path resuelva = sube stakes → mi Celeste cozy en shot_02; (b) 3 decisiones internas escaladas de categorías DIFERENTES (paneles/cerrar-ojos/cinturón → fruta/alimentar/regar); (c) cierre P9 'Felicidades, sigues con vida' sin twist verbal → el viewer entiende retroactivamente que el 'infectado' conocía las reglas porque el invernadero ya lo tocó; (d) outro NO festivo necesariamente — somber relief."

  - ref_id: "ref-03"                              # canonical-scenes/ref-03-bruno-pablo-mina.md
    informs:
      - "shot_list.shot_06.narration_in_this_shot"   # D1 categoría curiosidad/obediencia + objeto tentador
      - "shot_list.shot_07.narration_in_this_shot"   # consequence-A framing acción-condicional 'Si la enciendes' → 'Si comes la fruta'
      - "editing_targets.pacing_modulation"
    why_relevant: "El D1 (Celeste te extiende una fruta brillante: comerla vs devolverla) calca a ref-03 'enciendes tu linterna o esperas' → 'Si la enciendes, Bruno te agarra del brazo'. En ambos el personaje TIENTA al viewer a manipular/consumir un objeto seductor; obedecer el impulso mata. Calco: el framing acción-condicional DOMINANTE ('Si la enciendes' → 'Si comes la fruta'), 'Ahora decides' como gatillo universal, y el pacing lento del horror orgánico (Bruno arrastra al borde ↔ esporas brotan por la garganta). También 3 decisiones anidadas con escalada de stakes (ref-03 tiene 3 internas como mi video)."

  - ref_id: "ref-08"                              # canonical-scenes/ref-08-hugo-pablo-acuario.md
    informs:
      - "characters.char_b"                          # Celeste = bueno aparente (Pablo P3 + Hugo voz) — presente SOLO en hook/counterfactual/cliffhanger (§2)
      - "shot_list.shot_09.narration_in_this_shot"    # alimentar criatura orgánica (planta carnívora ↔ tiburones)
    why_relevant: "Préstamo de diseño + body horror. (1) ref-08 (Pablo P3 + Hugo que habla) informa el diseño de Celeste como bueno-aparente cálido. NOTA FIX § 2 (2026-06-01): tras el fix CANONICAL-STRUCTURE § 2, Celeste NO está en el played path → ya NO tiene líneas de tentación on-screen (shots 05/10); la tentación pasó al instinto/entorno + las contra-reglas de Bruno. Celeste aparece solo en hook/counterfactual/cliffhanger (narrador, sin diálogo). (2) El D2 (alimentar a la planta carnívora porque parece tener hambre vs no acercarte) calca a ref-08 Pablo: 'Pablo te da un cubo con carne y señala la compuerta superior del tanque... y te empuja' → la criatura orgánica enjaulada te traga el brazo. Calco el body horror de devoración orgánica específico al setting; la dinámica de 'empuje' a alimentar a la bestia ahora la encarna el INSTINTO (la planta llora de hambre + el cubo de carne), no un personaje presente."

  - ref_id: "ref-10"                              # canonical-scenes/ref-10-rurik-enzo-fundicion.md
    informs:
      - "shot_list.shot_15.narration_in_this_shot"    # D3 dinámica procedural + válvula (CO2 ↔ vapor a presión)
      - "shot_list.shot_18.narration_in_this_shot"    # body horror específico al setting (vapor/lianas)
      - "music_continuous_layers.drone_base"
    why_relevant: "El D3 (regar la planta para 'calmarla' vs abrir la válvula de CO2 con Bruno) calca a ref-10 Rurik: 'Hay una tubería enorme con vapor a presión. Rurik saca una llave inglesa y dice: Abre la válvula' → categoría sumisión/resistencia procedural. Calco: (a) la VÁLVULA como prop diegético de la decisión climática + dinámica de control procedural del personaje enmascarado/contaminado; (b) body horror específico al setting industrial-orgánico (Rurik vapor → quemadura ↔ Bruno abre CO2 'duerme' a la planta / regar despierta las lianas); (c) el outro Paz-perdida LABORAL (sala de control + café + cartas) → mi cozy de Celeste es laboral-jardín (regar al amanecer entre flores). Drone base industrial-orgánico continuo."

  - ref_id: "ref-06"                              # canonical-scenes/ref-06-enzo-axel-carretera.md
    informs:
      - "shot_list.shot_16.narration_in_this_shot"    # D3 clímax acción/confianza (resistir el impulso = sobrevivir)
      - "narrative_structure.canonical_constraints.consequence_framing_style"
    why_relevant: "ref-06 es P1 puro donde la opción ganadora va CONTRA el impulso ('Si tocas el claxon' → muerte; quedarte inmóvil → sobrevives). Calco esa dinámica en mis dilemas: el impulso nutricio/cómodo que Celeste activa (comer, alimentar, regar) es lo que mata; resistirlo y seguir las reglas raras de Bruno te salva. Framing acción-condicional 'Si tocas el claxon' → 'Si riegas la planta'. Body horror específico (claxon → Axel rompe la ventana y arrastra ↔ regar → lianas te envuelven)."

  # Refs NOT usados (declaro razón — recomendado):
  # - ref-11 (@referent-c atypical, NO referent-a canon — excluido per INDEX outliers flag)
  # - ref-12 (outro emocional 43s + apuñalamiento, tono melodramático ajeno al P9 clínico-orgánico)
  # - ref-13 (P6 hedonismo + Miro sin boca — cubierto indirectamente; mi cliffhanger NO es trampa hedonista)

