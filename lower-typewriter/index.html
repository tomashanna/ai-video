<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

#lower-typewriter {
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  background: #060606;
  position: relative;
}

.scanlines {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent 0px, transparent 3px,
    rgba(0,0,0,0.3) 3px, rgba(0,0,0,0.3) 4px
  );
  pointer-events: none;
  z-index: 900;
}

.vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 100%, transparent 0%, rgba(0,0,0,0.9) 100%);
  pointer-events: none;
  z-index: 890;
}

.lower-content {
  position: absolute;
  bottom: 210px;
  left: 80px;
  right: 80px;
}

.rule {
  width: 100%;
  height: 2px;
  background: rgba(240,240,240,0.42);
  margin-bottom: 22px;
  clip-path: inset(0 100% 0 0);
}

.main-text {
  font-family: 'Special Elite', 'Courier New', monospace;
  font-size: 84px;
  line-height: 1.05;
  color: #f0f0f0;
  text-shadow: 0 0 22px rgba(255,255,255,0.18);
  letter-spacing: 6px;
  text-transform: uppercase;
  white-space: nowrap;
  clip-path: inset(0 100% 0 0);
}

.cursor-row {
  display: flex;
  align-items: baseline;
  gap: 0;
}

.cursor {
  font-family: 'Special Elite', 'Courier New', monospace;
  font-size: 84px;
  color: #e0e0e0;
  opacity: 0;
  line-height: 1.05;
  letter-spacing: 0;
}

.sub-text {
  font-family: 'Special Elite', 'Courier New', monospace;
  font-size: 30px;
  letter-spacing: 8px;
  color: rgba(175,175,175,0.65);
  text-transform: uppercase;
  white-space: nowrap;
  clip-path: inset(0 100% 0 0);
  margin-top: 16px;
}

.flash {
  position: absolute;
  inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
  z-index: 850;
}
</style>
</head>
<body>
<div id="lower-typewriter" data-composition-id="lower-typewriter" data-width="1080" data-height="1920" data-start="0">
  <div class="vignette"></div>
  <div class="lower-content" id="lower-content">
    <div class="rule" id="rule"></div>
    <div class="cursor-row">
      <div class="main-text" id="main-text">THE WITNESS</div>
      <div class="cursor" id="cursor">|</div>
    </div>
    <div class="sub-text" id="sub-text">DISAPPEARED · 1987</div>
  </div>
  <div class="flash" id="flash"></div>
  <div class="scanlines"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });

// CRT power-on flash
tl.to("#flash", { opacity: 0.5, duration: 0.04, ease: "none" }, 0.18);
tl.to("#flash", { opacity: 0, duration: 0.12, ease: "power2.out" }, 0.22);

// Rule draws in with steps (typewriter feel)
tl.to("#rule", { clipPath: "inset(0 0% 0 0)", duration: 0.32, ease: "steps(16)" }, 0.22);

// Cursor appears
tl.to("#cursor", { opacity: 1, duration: 0.05, ease: "none" }, 0.36);

// Main text types in — "THE WITNESS" = 11 chars
tl.to("#main-text", { clipPath: "inset(0 0% 0 0)", duration: 0.6, ease: "steps(11)" }, 0.4);

// Cursor blinks while typing and holding — 10 blinks × 0.3s = 3.0s total
tl.to("#cursor", { opacity: 0, duration: 0.3, repeat: 9, yoyo: true, ease: "steps(1)", overwrite: "auto" }, 0.36);

// Subtitle types in — "DISAPPEARED · 1987" = 18 chars
tl.to("#sub-text", { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "steps(18)" }, 1.22);

// CRT flicker
tl.to("#lower-typewriter", { opacity: 0.84, duration: 0.04, ease: "none" }, 2.0);
tl.to("#lower-typewriter", { opacity: 1, duration: 0.05, ease: "none", overwrite: "auto" }, 2.04);

// Exit — fade out cleanly
tl.to(["#rule", "#main-text", "#cursor", "#sub-text"], { opacity: 0, duration: 0.38, ease: "power2.in" }, 3.42);

window.__timelines["lower-typewriter"] = tl;
</script>
</body>
</html>
