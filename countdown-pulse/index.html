<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

#countdown-pulse {
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  background: #080808;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* CRT scan lines overlay */
.scanlines {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent 0px,
    transparent 3px,
    rgba(0,0,0,0.32) 3px,
    rgba(0,0,0,0.32) 4px
  );
  pointer-events: none;
  z-index: 900;
}

/* Vignette */
.vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 68% 58% at 50% 50%, transparent 0%, rgba(0,0,0,0.82) 100%);
  pointer-events: none;
  z-index: 890;
}

/* Crosshair guide lines (film leader style) */
.ch-h {
  position: absolute;
  top: 50%;
  left: 0; right: 0;
  height: 1px;
  background: rgba(240,240,240,0.18);
  pointer-events: none;
}
.ch-v {
  position: absolute;
  left: 50%;
  top: 0; bottom: 0;
  width: 1px;
  background: rgba(240,240,240,0.18);
  pointer-events: none;
}

/* Film scratch */
.scratch {
  position: absolute;
  top: 0; bottom: 0;
  width: 2px;
  background: linear-gradient(to bottom, transparent 5%, rgba(255,255,255,0.75) 15%, rgba(255,255,255,0.5) 50%, rgba(255,255,255,0.75) 85%, transparent 95%);
  opacity: 0;
  pointer-events: none;
  z-index: 800;
}
#sc1 { left: 178px; }
#sc2 { left: 843px; }

/* Leader SVG wrapper */
.leader-wrap {
  position: absolute;
  top: calc(50% - 300px);
  left: calc(50% - 300px);
  width: 600px;
  height: 600px;
  opacity: 0;
}

.digit {
  font-family: 'Bebas Neue', 'Impact', sans-serif;
  font-weight: 400;
  font-size: 360px;
  line-height: 1;
  color: #f0f0f0;
  text-shadow: 0 0 60px rgba(255,255,255,0.45);
  position: absolute;
  top: calc(50% - 190px);
  left: 0;
  width: 100%;
  text-align: center;
  opacity: 0;
  user-select: none;
  letter-spacing: -4px;
}

/* Full-screen white flash */
.flash {
  position: absolute;
  inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
  z-index: 850;
}
</style>
</head>
<body>
<div id="countdown-pulse" data-composition-id="countdown-pulse" data-width="1080" data-height="1920" data-start="0">
  <div class="vignette"></div>
  <div class="ch-h"></div>
  <div class="ch-v"></div>

  <!-- Film leader SVG -->
  <div class="leader-wrap" id="leader-wrap">
    <svg id="leader-svg" viewBox="0 0 600 600" width="600" height="600">
      <!-- Outer ring -->
      <circle cx="300" cy="300" r="275" fill="none" stroke="#f0f0f0" stroke-width="2.5"/>
      <!-- Inner ring -->
      <circle cx="300" cy="300" r="215" fill="none" stroke="#f0f0f0" stroke-width="1.5"/>
      <!-- Mid ring -->
      <circle cx="300" cy="300" r="155" fill="none" stroke="#f0f0f0" stroke-width="1" opacity="0.5"/>
    </svg>
  </div>

  <div class="scratch" id="sc1"></div>
  <div class="scratch" id="sc2"></div>

  <div class="digit" id="d3">3</div>
  <div class="digit" id="d2">2</div>
  <div class="digit" id="d1">1</div>

  <div class="flash" id="flash"></div>
  <div class="scanlines"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
// Synchronous: add 12 tick marks to SVG at page load
(function() {
  const svg = document.getElementById('leader-svg');
  const ns = 'http://www.w3.org/2000/svg';
  for (let i = 0; i < 12; i++) {
    const angle = (i * 30 - 90) * Math.PI / 180;
    const isMajor = i % 3 === 0;
    const r1 = isMajor ? 255 : 260;
    const r2 = 277;
    const el = document.createElementNS(ns, 'line');
    el.setAttribute('x1', (300 + r1 * Math.cos(angle)).toFixed(2));
    el.setAttribute('y1', (300 + r1 * Math.sin(angle)).toFixed(2));
    el.setAttribute('x2', (300 + r2 * Math.cos(angle)).toFixed(2));
    el.setAttribute('y2', (300 + r2 * Math.sin(angle)).toFixed(2));
    el.setAttribute('stroke', '#f0f0f0');
    el.setAttribute('stroke-width', isMajor ? '2.5' : '1.5');
    svg.appendChild(el);
  }
})();

window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });

// Leader fades in
tl.fromTo("#leader-wrap", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0.08);

// Global flicker (finite, deterministic)
tl.to("#countdown-pulse", { opacity: 0.88, duration: 0.04, ease: "none" }, 0.55);
tl.to("#countdown-pulse", { opacity: 1,    duration: 0.04, ease: "none", overwrite: "auto" }, 0.59);
tl.to("#countdown-pulse", { opacity: 0.82, duration: 0.03, ease: "none" }, 1.72);
tl.to("#countdown-pulse", { opacity: 1,    duration: 0.05, ease: "none", overwrite: "auto" }, 1.75);
tl.to("#countdown-pulse", { opacity: 0.9,  duration: 0.04, ease: "none" }, 2.61);
tl.to("#countdown-pulse", { opacity: 1,    duration: 0.04, ease: "none", overwrite: "auto" }, 2.65);

// Film scratches
tl.to("#sc1", { opacity: 0.8, duration: 0.05, ease: "none" }, 0.3);
tl.to("#sc1", { opacity: 0,   duration: 0.05, ease: "none" }, 0.35);
tl.to("#sc2", { opacity: 0.6, duration: 0.07, ease: "none" }, 1.18);
tl.to("#sc2", { opacity: 0,   duration: 0.05, ease: "none" }, 1.25);
tl.to("#sc1", { opacity: 0.5, duration: 0.04, ease: "none" }, 2.44);
tl.to("#sc1", { opacity: 0,   duration: 0.06, ease: "none" }, 2.48);

// --- DIGIT 3 ---
tl.fromTo("#d3", { scale: 0.88, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.18, ease: "power3.out" }, 0.12);
// Brief flash between numbers
tl.to("#flash", { opacity: 0.9, duration: 0.04, ease: "none" }, 0.84);
tl.to("#flash", { opacity: 0,   duration: 0.1,  ease: "power2.out", overwrite: "auto" }, 0.88);
tl.to("#d3",   { opacity: 0,   duration: 0.04, ease: "none" }, 0.86);

// --- DIGIT 2 ---
tl.fromTo("#d2", { scale: 0.88, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.18, ease: "power3.out" }, 1.1);
tl.to("#flash", { opacity: 0.9, duration: 0.04, ease: "none" }, 1.84);
tl.to("#flash", { opacity: 0,   duration: 0.1,  ease: "power2.out", overwrite: "auto" }, 1.88);
tl.to("#d2",   { opacity: 0,   duration: 0.04, ease: "none" }, 1.86);

// --- DIGIT 1 ---
tl.fromTo("#d1", { scale: 0.88, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.18, ease: "power3.out" }, 2.1);
tl.to("#flash", { opacity: 0.9, duration: 0.04, ease: "none" }, 2.84);
tl.to("#flash", { opacity: 0,   duration: 0.1,  ease: "power2.out", overwrite: "auto" }, 2.88);
tl.to("#d1",   { opacity: 0,   duration: 0.04, ease: "none" }, 2.86);

// Leader fades out before GO
tl.to("#leader-wrap", { opacity: 0, duration: 0.2, ease: "power2.in" }, 2.9);

// Leader fades out, composition ends cleanly
tl.to("#leader-wrap", { opacity: 0, duration: 0.35, ease: "power2.in", overwrite: "auto" }, 3.0);

window.__timelines["countdown-pulse"] = tl;
</script>
</body>
</html>
