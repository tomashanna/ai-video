    (no usado en producción nuestra previa). Rotación OK + diversifica pattern catalog.

slot_H0_personal_stakes:
  habilitado: false
  razon: "P3 puro per ref-08 acuario precedent — H0 NO requerido. Hook directo al setting + dyad."

# ============================================================
# ESTRUCTURA TEMPORAL (PAUTA § 2 — 88s)
# ============================================================
estructura_temporal:
  hook_presentacion_0_10pct: 9s     # 0-9s — hook + dyad + countdown AVU LAST
  setup_salvador_10_30pct: 18s     # 9-27s — Salvador path setup (bueno aparente toma control)
  decision_1_30_45pct: 13s          # 27-40s — D1 setup + countdown + decision moment
  consequence_A1_45_55pct: 9s       # 40-49s — consequence A1 (butaca + película + cose)
  absorption_pull_back_55_60pct: 4s # 49-53s — absorption/pull back to D2 path
  decision_2_60_70pct: 9s           # 53-62s — D2 setup + countdown
  consequence_A2_70_80pct: 9s       # 62-71s — consequence A2 (cortafilm + función eterna trap)
  nico_return_80_85pct: 4s    # 71-75s — Nico return (TWIST setup)
  cliffhanger_outro_85_100pct: 13s  # 75-88s — counterfactual P3 reveal + outro
  total: 88s

# ============================================================
# NARRATION SCRIPT (19 segments — Spanish NEUTRAL + anti-cliché)
# ============================================================
narration_script:
  meta:
    target_total_duration: 88s
    register: tu_implicito_presente_indicativo
    language_register: spanish_neutral
    speakers: [narrator, salvador, nico]
    cliche_check_passed: true

  segments:
    - id: hook_narrator_framing
      order: 1
      timestamp_intent_s: [2.0, 5.0]
      speaker: narrator
      voice_id: "2gPFXx8pN3Avh27Dw5Ma"  # Oxley narrator default
      text_canonical: "Decide con quién pasarás la noche en este cine: el Salvador... o el Nico."
      wpm_target: 180
      lip_sync_required: false  # narrator voiceover off-screen

    - id: hook_salvador_warning
      order: 2
      timestamp_intent_s: [5.5, 7.5]
      speaker: salvador
      voice_id: "2gPFXx8pN3Avh27Dw5Ma"
      voice_effects_active: true
      text_canonical: "No me elijas. Algo enciende la película."  # ref-08 Hugo "No me elijas" precedent
      wpm_target: 145
      lip_sync_required: false  # boca cosida — eyes glow pulse instead

    - id: setup_salvador_intro
      order: 3
      timestamp_intent_s: [9.5, 14.5]
      speaker: narrator
      voice_id: "2gPFXx8pN3Avh27Dw5Ma"
      text_canonical: "Si eliges a Salvador, te lleva a la sala principal. Hay una sola función esta noche."
      wpm_target: 152
      lip_sync_required: false

    - id: setup_salvador_action
      order: 4
      timestamp_intent_s: [14.5, 21.0]
      speaker: narrator
      voice_id: "2gPFXx8pN3Avh27Dw5Ma"
      text_canonical: "Camina hasta la pantalla, levanta la mano enguantada y el proyector arranca solo."
      wpm_target: 158
      lip_sync_required: false

    - id: setup_salvador_film_reveal
      order: 5
      timestamp_intent_s: [21.0, 27.0]
      speaker: narrator
      voice_id: "2gPFXx8pN3Avh27Dw5Ma"
      text_canonical: "En la pantalla aparece tu cumpleaños de los nueve años. El que no recuerdas."
      wpm_target: 158
      lip_sync_required: false

    - id: decision_1_setup
      order: 6
      timestamp_intent_s: [27.0, 32.5]
      speaker: narrator
      voice_id: "2gPFXx8pN3Avh27Dw5Ma"
      text_canonical: "Te ofrece una butaca: fila tres, asiento siete. Tiende un boleto en blanco."
      wpm_target: 165
      lip_sync_required: false

    - id: decision_1_question
      order: 7
      timestamp_intent_s: [32.5, 35.5]
      speaker: narrator
      voice_id: "2gPFXx8pN3Avh27Dw5Ma"
      text_canonical: "Ahora decide: tomas el boleto o lo rechazas."
      wpm_target: 150
      lip_sync_required: false
      # countdown AVU activates after this segment ends per narrative_pacing

    - id: consequence_A1
      order: 8
      timestamp_intent_s: [38.8, 47.0]
      speaker: narrator
      voice_id: "2gPFXx8pN3Avh27Dw5Ma"
      text_canonical: "Si tomas el boleto, te sientas. Los apoyabrazos se cierran sobre tu regazo. El haz del proyector entra por tu boca abierta."
      wpm_target: 158
      lip_sync_required: false

    - id: consequence_B1_bridge
      order: 9
      timestamp_intent_s: [47.0, 53.0]
      speaker: narrator
      voice_id: "2gPFXx8pN3Avh27Dw5Ma"
      text_canonical: "Si lo rechazas, el Salvador apaga las luces de su cráneo y camina hacia la cabina de proyección."
      wpm_target: 158
      lip_sync_required: false

    - id: decision_2_setup
      order: 10
      timestamp_intent_s: [53.0, 58.5]
      speaker: narrator
      voice_id: "2gPFXx8pN3Avh27Dw5Ma"
      text_canonical: "Dentro de la cabina hay un asiento vacío y un cortafilm sobre la mesa. Una tijera del proyeccionista. Te lo ofrece."
      wpm_target: 165
      lip_sync_required: false

    - id: decision_2_question
      order: 11
      timestamp_intent_s: [58.5, 61.5]
      speaker: narrator
      voice_id: "2gPFXx8pN3Avh27Dw5Ma"
      text_canonical: "Decides: aceptas el cortafilm o sales."
      wpm_target: 150
      lip_sync_required: false

    - id: consequence_A2
      order: 12
      timestamp_intent_s: [64.8, 71.0]
      speaker: narrator
      voice_id: "2gPFXx8pN3Avh27Dw5Ma"
      text_canonical: "Si aceptas el cortafilm, corta solo el hilo del Salvador. El hilo salta a tu boca. Quedas sentado en su butaca, con tu cumpleaños en bucle en la pantalla."
      wpm_target: 158
      lip_sync_required: false

    - id: consequence_B2_bridge
      order: 13
      timestamp_intent_s: [71.0, 75.0]
      speaker: narrator
      voice_id: "2gPFXx8pN3Avh27Dw5Ma"
      text_canonical: "Si sales, el haz se apaga. Detrás de ti, una linterna se enciende."
      wpm_target: 158
      lip_sync_required: false

    - id: nico_offer
      order: 14
      timestamp_intent_s: [75.0, 77.0]
      speaker: nico
      voice_id: "qWWAqFomnJ99VwQLREfT"  # Kate
      text_canonical: "Por aquí. La función ya terminó."
      wpm_target: 165
      lip_sync_required: true  # ON-screen face visible

    - id: cliffhanger_counterfactual_intro
      order: 15
