# ═══════════════════════════════════════════════════════════════════════════════
# 1. PROJECT METADATA
# ═══════════════════════════════════════════════════════════════════════════════

project:
  project_id: "parque-acuatico-abandonado"
  format: "horror-choice"
  delivery: "reel"
  pattern: "P5"
  pattern_label: "Familiaridad aterradora / Extranjería protectora"
  pattern_rotation_check: "videos previous: matadero=P6, cinema-abandonado=P3. P5 NOT YET USED. ✅ rotation OK."
  setting: "Parque acuático abandonado al atardecer (dusk), piscinas secas, plaza central, slide tunnel decayed, faded mascot statuary"
  total_duration_s_intent: 91
  channel: "@elige_tucompanero"
  language: "Spanish neutral"  # tú/dices/eliges — NUNCA voseo (memory feedback_spanish_neutral)

  # P5 pattern theory — the engine of tension this video
  pattern_engine_note: |
    P5 "Familiaridad aterradora / Extranjería protectora" engine:
    - The MASCOT (Mateo, frog suit) is the most FAMILIAR figure in the park — looks
      like a kid-friendly character, holds the boleto (the "official" pass). Familiarity
      that should comfort instead reveals as predatorial when looked at closely (human
      eyes through the eye-holes, suit torn revealing dark texture beneath).
    - The LIFEGUARD (Bryan, sun-weathered weathered tank top) is the STRANGER — out of
      place at dusk (lifeguards work daylight), worn and weary, gives a quiet warning
      instead of an offer. Foreigner-as-protector archetype.
    - Tension engine: viewer's INSTINCT says "trust the mascot, he's part of this place"
      → choosing him is choosing familiarity-as-trap.
    - Counterfactual reveals the lifeguard was the real protector — the foreign warning
      was the safe path.
    - This is P5 (NOT P3 "ambos engañan" — here one IS familiar/dangerous, one IS
      foreign/safe). Closest to PATTERNS § 5 matriz expandida "Doble peligro visible"
      reframed via familiarity-foreignness lens (architect creative re-framing 2026-05-21
      for this video specifically).

