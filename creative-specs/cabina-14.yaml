aesthetic_strategy:
  ref_doc: aesthetic.md
  dual_palette_intent: "cool_dark_montaña_invernal_patagonica vs warm_refugio_amanecer_dorado_outro"
  cool_palette:
    primary: "azul/verde frío nocturno (#1a2530 / #2a3a40)"
    accents: "blancos nieve crushed + faro refugio lejano dorado (#d4a368)"
    crushed_blacks: aggressive
    bleach_bypass: medium_high
  warm_palette:  # solo H6 outro
    primary: "ámbar dorado amanecer (#d4a368 / #c79366)"
    accents: "rosa pálido cielo + lana cruda crema (#e8d4ad)"
    grading: warm_LUT_outro_specific  # ver INGENIERO-PAUTA-MASTER LUT specs
  vignette_intent: pronunciada  # Q19 referent-validated 2026-05-13
