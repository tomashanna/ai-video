# ═══════════════════════════════════════════════════════════════
# 5. NARRATIVE STRUCTURE
# ═══════════════════════════════════════════════════════════════

narrative_structure:
  counterfactual_placement: "good_path_at_end"   # P2 canonical (ref-03 + ref-10 + ref-08) — twist reveal POST-decision
  emotional_framing: "relief_contrast"            # amanecer rosa post-tormenta vs horror nevado
  cliffhanger_archetype: "paz_laboral_cozy_variant_montaña"

  canonical_constraints:
    no_retrospective_counterfactual: true
    si_elegiste_framing_required: true
    visual_matches_narration_literal: true
    first_person_pov_locked: true

  pattern_id: "P2"
  slot_d_malo_dialogue_pattern: "Iván habla en frases cortas operativas autoritarias (≤5 palabras): 'Subamos al techo.' / 'Recalibrá el anemómetro.' / 'Fin del turno.' (PAUTA § 10 cumple max 5 palabras)"
  consequence_b_twist_reveal: "Si esperás (path B), Iván resulta meteorólogo serio cumpliendo protocolo. Amanecer + llega camioneta naranja del relevo a las 7AM. Iván dice 'Fin del turno, bajemos.' — twist sin verbalizar (igual ref-03 Bruno)."
  silence_intentional_threat: "Slot B (8-25s) Iván habla cadencia operativa monótona, pero Renato susurra en respuesta 'Espera adentro' creando contraste — ref-08 Hugo dialogue precedente + ref-11 silencio threat."
  hook_setting_warning_premise: "Caption hook 'NADIE EN 40KM' rojo glow — establece aislamiento radical Slot A (ref-06 confined-space premise informa)."
  bueno_aparente_dialogue_in_hook: "Renato susurra 'No salgas con él' al hook (licencia ref-08 Hugo 'No me elijas')"
  confined_space_ratio: "85% del video adentro de la caseta meteorológica (cognado ref-06 90% en coche). 15% exterior tormenta (escena consequence A path) + amanecer (consequence B)."
  slot_a_atrapamiento_isolation: "Caseta 4x4m chapa + tormenta exterior (whiteout) + radio HF cruje sin señal estable + 40km al pueblo más cercano. Atrapamiento radical canonical Slot A."

  hook_sub_beats:
    - beat_id: "name_labels_intro"
      timestamp_intent_s: [0.0, 2.0]
      content: "Name labels IVÁN + RENATO monospaced font, Y 11.5% canonical"
    - beat_id: "caption_setting_warning"
      timestamp_intent_s: [2.0, 4.0]
      content: "Caption 'NADIE EN 40KM' rojo glow Y 62%, establece aislamiento radical"
    - beat_id: "push_in_micro_motion"
      timestamp_intent_s: [4.0, 5.5]
      content: "POV slow push-in toward dyad standing in caseta interior — feedback_hook_continuity_no_zoom_cut compliance"
    - beat_id: "countdown_3_2_1"
      timestamp_intent_s: [5.5, 8.0]
      content: "Film Leader Academy countdown AVU clip (LAST per GAP #18)"
      avu_clip: "countdown-3-2-1-film-leader-with-ticks.mp4"

