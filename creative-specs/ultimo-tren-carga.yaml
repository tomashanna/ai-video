      timestamp_intent_s: [1.5, 5.0]
      shot_anchor: "shot_01"
      content: "Tobias EXTIENDE el termo hacia cámara y dice (voz cálida, lip-sync) 'Ven conmigo. Abajo hace frío.' (lure cálido del bueno-aparente, estilo ref-12 'Ven conmigo'). Dario REACCIONA físico: gira la cabeza hacia el viewer y su lámpara de casco BARRE el piso. Narrator framing encima: 'El último tren ya pasó. Solo uno puede sacarte.' + caption warning rojo del setting (túnel sellado 3 AM). Music hook_crescendo sube."
