# ═══════════════════════════════════════════════════════════════
# 9. NARRATION SCRIPT (DERIVADO — single source of truth = narration_in_this_shot por shot)
# ═══════════════════════════════════════════════════════════════
# ⛔ SINGLE SOURCE OF TRUTH = `narration_in_this_shot` por shot (shot_list §10).
#    §9 narration_script = CONCATENACIÓN derivada, palabra-por-palabra, de los
#    narration_in_this_shot en orden de shot — driver del ENSAMBLE del master continuo Layer 3.
#    El caption-burn per-clip (HR#30) y el master continuo Layer 3 derivan del MISMO texto
#    per-shot → no hay desync (anti-pattern #16) + cobertura temporal completa (HR#30).
#    Narrador = Layer 3 continuous ÚNICAMENTE (HR#25 FIX A); EXCLUIDO de Layer 1.
#
# RECONCILIACIÓN FIX B (auditor F1, 2026-05-31) — qué cambió vs v11.1 pre-fix:
#   - shot_02: §9 = nis completo (se RE-INCORPORÓ '...comiendo fruta dulce de la planta madre' a nis → narrado+capcionado, freeze-extend cubre 6.55s).
#   - shot_03: §9 = nis corto; se CORTÓ '...Las puertas se cierran. Las plantas se mueven hacia tu calor' (era huérfano sin caption per-clip).
#   - shot_07: §9 ahora 'en el suelo' (drop 'húmedo') = nis.
#   - shot_09: §9 ahora 'hasta la planta' (drop 'enjaulada') = nis.
#   - shot_12: §9 ahora 'Te arrastra a la jaula' (= nis, no 'dentro de la jaula de vidrio').
#   - shot_16: §9 = nis; se CORTÓ el lead 'Bruno te pasa la manguera y la válvula de gas' (redundante con visual+dialog de shot_15; inflaba el freeze a 222WPM).
#   - shot_19/shot_20: §9 SPLIT en DOS segmentos (antes uno lumped en shot_20): seg shot_19 + seg shot_20.
#   - shot_21: anchor corregido shot_22 → shot_21 (la línea 'Bruno te saca...' vive en shot_21 nis).
#   - shot_22: solo el CTA 'En el delantal de Celeste...' ancla a shot_22.
#
# Estilo calibrado a primary source ref-03/09/10: 2ª persona presente, staccato,
# framing acción-condicional, "Ahora decides" gatillo, body horror nominal en climax.
# Total ≈ 187 palabras narrador + 21 diálogo → ~71s narrados en 90s (resto = countdowns + loadings + beats).
# Español NEUTRAL: come/riega/pruébala/eres/decides/eliges — NUNCA voseo.
# Segmentos NARRATOR → ensamblan el master continuo Layer 3. Segmentos char_a/char_b (dialog) →
#   son Layer 1 clip-scoped (FIX A), NO parte del master continuo; su fuente canónica = dialog_text del shot.

narration_script:
  - segment_id: "narrator_hook"
    speaker: "narrator"
    voice_id: "K3TeN3ZVK8WnOeJ0NYqZ"
    text_canonical: "Elige a tu compañero para esta noche. Bruno o Celeste."
    timestamp_intent_s: [2.0, 5.0]
