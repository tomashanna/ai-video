<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

#loader-segments {
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  background: #060606;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 60px;
}

.scanlines {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent 0px,
    transparent 3px,
    rgba(0,0,0,0.3) 3px,
    rgba(0,0,0,0.3) 4px
  );
  pointer-events: none;
  z-index: 900;
}

.vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 68% 52% at 50% 50%, transparent 0%, rgba(0,0,0,0.88) 100%);
  pointer-events: none;
  z-index: 890;
}

.label {
  font-family: 'Special Elite', 'Courier New', monospace;
  font-size: 52px;
  letter-spacing: 20px;
  color: #d8d8d8;
  text-shadow: 0 0 20px rgba(255,255,255,0.2);
  opacity: 0;
  z-index: 1;
}

.segments-row {
  display: flex;
  gap: 8px;
  align-items: center;
  opacity: 0;
  z-index: 1;
}

.seg {
  width: 60px;
  height: 24px;
  border-radius: 3px;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.18);
}

.sublabel {
  font-family: 'Special Elite', 'Courier New', monospace;
  font-size: 22px;
  letter-spacing: 8px;
  color: rgba(180,180,180,0.45);
  opacity: 0;
  z-index: 1;
  margin-top: -26px;
}

/* Horizontal static flicker */
.static-bar {
  position: absolute;
  left: 0; right: 0;
  height: 6px;
  background: rgba(255,255,255,0.07);
  opacity: 0;
  pointer-events: none;
  z-index: 800;
}
#sb1 { top: 300px; }
#sb2 { top: 1600px; }

.flash {
  position: absolute;
  inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
  z-index: 850;
}
</style>
</head>
<body>
<div id="loader-segments" data-composition-id="loader-segments" data-width="1080" data-height="1920" data-start="0">
  <div class="vignette"></div>
  <div class="static-bar" id="sb1"></div>
  <div class="static-bar" id="sb2"></div>

  <div class="label" id="label">LOADING</div>

  <div class="segments-row" id="seg-row">
    <div class="seg" id="s1"></div>
    <div class="seg" id="s2"></div>
    <div class="seg" id="s3"></div>
    <div class="seg" id="s4"></div>
    <div class="seg" id="s5"></div>
    <div class="seg" id="s6"></div>
    <div class="seg" id="s7"></div>
    <div class="seg" id="s8"></div>
    <div class="seg" id="s9"></div>
    <div class="seg" id="s10"></div>
    <div class="seg" id="s11"></div>
    <div class="seg" id="s12"></div>
  </div>

  <div class="sublabel" id="sublabel">0 / 12</div>

  <div class="flash" id="flash"></div>
  <div class="scanlines"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });

// Flicker
tl.to("#loader-segments", { opacity: 0.82, duration: 0.04, ease: "none" }, 0.42);
tl.to("#loader-segments", { opacity: 1,    duration: 0.04, ease: "none" }, 0.46);
tl.to("#loader-segments", { opacity: 0.88, duration: 0.03, ease: "none" }, 1.88);
tl.to("#loader-segments", { opacity: 1,    duration: 0.04, ease: "none" }, 1.91);

// Static bars
tl.to("#sb1", { opacity: 1, duration: 0.04, ease: "none" }, 0.7);
tl.to("#sb1", { opacity: 0, duration: 0.07, ease: "none" }, 0.74);
tl.to("#sb2", { opacity: 0.7, duration: 0.04, ease: "none" }, 2.05);
tl.to("#sb2", { opacity: 0,   duration: 0.06, ease: "none" }, 2.09);

// Entrance
tl.fromTo("#label",   { y: -22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.38, ease: "power3.out" }, 0.15);
tl.fromTo("#seg-row", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.42, ease: "power3.out" }, 0.3);
tl.fromTo("#sublabel",{ opacity: 0 }, { opacity: 1, duration: 0.28, ease: "power2.out" }, 0.5);

// Segments fill — white on dark, 12 × 0.15s stagger
const segs = ["#s1","#s2","#s3","#s4","#s5","#s6","#s7","#s8","#s9","#s10","#s11","#s12"];
const sublabelEl = document.getElementById("sublabel");
segs.forEach(function(id, i) {
  tl.to(id, {
    backgroundColor: "#e8e8e8",
    borderColor: "rgba(255,255,255,0.5)",
    boxShadow: "0 0 14px rgba(255,255,255,0.7), 0 0 4px rgba(255,255,255,0.9)",
    duration: 0.28,
    ease: "power2.out",
    onStart: function() { sublabelEl.textContent = (i + 1) + ' / 12'; }
  }, 0.5 + i * 0.15);
});

// Secondary pulse — dims then brightens (horror flicker on completion)
tl.to(".seg", {
  backgroundColor: "rgba(232,232,232,0.5)",
  boxShadow: "none",
  duration: 0.15,
  ease: "power2.in",
  stagger: { each: 0.03, ease: "none" }
}, 2.55);
tl.to(".seg", {
  backgroundColor: "#f0f0f0",
  boxShadow: "0 0 18px rgba(255,255,255,0.8)",
  duration: 0.15,
  ease: "power2.out",
  stagger: { each: 0.03, ease: "none" }
}, 2.8);

// Fill complete — fade everything out cleanly
tl.to(["#label", "#seg-row", "#sublabel"], { opacity: 0, duration: 0.5, ease: "power2.in" }, 3.05);

window.__timelines["loader-segments"] = tl;
</script>
</body>
</html>
