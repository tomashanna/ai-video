# LUTs reskineados: warm_glory = celebración/gol/copa; cool_cinematic_stadium = juego en tensión;
# cool_defeat = error/burla (paleta fría desaturada con tinte gris-azul — NO horror rojo, sino
# el frío del fracaso deportivo + abucheos). Sin "cool_horror".

narrative_sections:
  - section_id: "hook"
    shot_ids: ["shot_01"]
    audio_layer_continuity_within_section: ["drone_base", "ambient_stadium_crowd_continuous"]
    visual_style_lut: "cool_cinematic_stadium_v1"
  - section_id: "counterfactual_opening"
