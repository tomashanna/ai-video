[project]
name = "ai-video"
version = "0.2.0"
description = "Toolkit to design, generate, assemble and audit short AI-generated vertical videos."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tomás Hanna" }]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

[project.urls]
Repository = "https://github.com/tomashanna/ai-video"
Issues = "https://github.com/tomashanna/ai-video/issues"
Changelog = "https://github.com/tomashanna/ai-video/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Paid generative APIs (ElevenLabs, Gemini/Veo, Replicate/Kling).
providers = [
  "elevenlabs>=1.50",
  "google-genai>=1.0",
  "replicate>=1.0",
  "httpx>=0.27",
]
# Local media analysis (Whisper captions, frame metrics). Heavy: pulls torch.
media = [
  "openai-whisper>=20240930",
  "pillow>=10.0",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "scikit-image>=0.22",
]
# Referent research tooling (OCR, audio features, semantic similarity).
research = [
  "librosa>=0.10",
  "easyocr>=1.7",
  "pytesseract>=0.3",
  "sentence-transformers>=3.0",
]

[project.scripts]
ai-video = "ai_video.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
  "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_video"]

[tool.hatch.build.targets.wheel.force-include]
"src/ai_video/prompts" = "ai_video/prompts"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]  # makes the top-level evals/ package importable from tests
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = [
  "ffmpeg: needs ffmpeg/ffprobe on PATH (auto-skipped otherwise)",
  "slow: slower integration-style tests",
]
filterwarnings = ["ignore::DeprecationWarning:google.*"]

[tool.coverage.run]
source = ["ai_video"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "evals"]
extend-exclude = [".agents", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "E501",    # long lines: many audits embed long Spanish messages/prompts
  "S101",    # assert is fine in tests and internal invariants
  "S603",    # subprocess with list args is the safe pattern we enforce
  "S607",    # partial executable paths (ffmpeg/ffprobe on PATH) are intended
  "S311",    # random is used for jitter, not crypto
  "RUF001", "RUF002", "RUF003",  # Spanish text/emoji in strings and comments
  "SIM105", "SIM108", "SIM102", "SIM115",
  "B905",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "E402", "E702", "E741", "RUF059", "RUF005", "RUF007", "F841", "RUF015", "E731", "SIM110"]
"evals/**" = ["S"]
"src/ai_video/{audits,build,research,providers,editor,spec}/*.py" = [
  # Legacy tool modules (pre-package scripts): style-only rules deferred to a
  # follow-up refactor; correctness rules (F, B except B023/B007, S) stay on.
  "E402", "E702", "E741", "E731",
  "S110", "S112", "B007", "B023", "B904",
  "SIM103", "SIM110", "RUF005", "RUF007", "RUF013", "RUF015", "RUF046", "RUF059",
  "F841", "UP042",
]

[tool.ruff.format]
quote-style = "preserve"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["ai_video", "evals"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
ignore_missing_imports = true
check_untyped_defs = false
no_implicit_optional = true

# Strict on the infrastructure + new modules (the robustness layer).
[[tool.mypy.overrides]]
module = [
  "ai_video.config",
  "ai_video.paths",
  "ai_video.budget",
  "ai_video.retry",
  "ai_video.proc",
  "ai_video.log",
  "ai_video.errors",
  "ai_video.cli",
  "ai_video.spec.schema",
  "ai_video.spec.validate",
  "ai_video.core.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

# Legacy tool modules that still carry inferred-dict typing debt (heterogeneous
# dict literals). Everything else under ai_video/ is type-checked. Shrink this list.
[[tool.mypy.overrides]]
module = [
  "ai_video.audits.audit_audio",
  "ai_video.audits.audit_clip_timing_vs_audio",
  "ai_video.audits.audit_engineer_brief_vs_spec",
  "ai_video.audits.audit_frames_granular",
  "ai_video.audits.audit_narrative",
  "ai_video.audits.audit_render_audio_coverage",
  "ai_video.audits.audit_shot_spec_compliance",
  "ai_video.audits.audit_ui_safe_zones",
  "ai_video.audits.continuity_check",
  "ai_video.audits.quality_gate_per_clip",
  "ai_video.build.build_clip_atomic",
  "ai_video.build.orchestrator_cp_by_cp",
  "ai_video.spec.migrate_enums",
]
ignore_errors = true
