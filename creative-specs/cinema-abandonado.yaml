# ============================================================
# SLOTS A-H (PAUTA-MASTER § 2 estructura primaria)
# ============================================================

slot_A_escenario:
  setting_id: 14  # variant (no en lista canónica 8 — cinema is NEW pero análogo a setting 3 acuario "exhibición")
  setting_name: "Cine abandonado años 50 — sala principal + cabina de proyección + lobby"
  function_lugar: "exhibición de películas / refugio nocturno cerrado al público"
  elementos_diegeticos:
    - "Salvador 35mm runner (rueda de bobina visible, haz de luz cortando polvo)"
    - "Pantalla blanca al fondo (a veces oscurece, a veces muestra imágenes)"
    - "Cartel EXIT verde fluorescente (parpadea intermitente)"
    - "Caja de popcorn (con kernels jumping ocasional)"
    - "Boleto en blanco (signo de cliffhanger — fecha sin imprimir)"
  iluminacion_dominante: "haz de proyector con dust particles + tungsten warm de luces de butacas + verde fluorescente cartel EXIT"
  material_paredes_suelo: "terciopelo rojo desgastado butacas + alfombra raida pasillo + paneles madera con manchas humedad + linóleo lobby con marcas pegajosas"
  atrapamiento_fisico_test: "puertas laterales cerradas, salida principal solo accesible si proyeccionista quiere o si Nico (acomodador) acompaña"
  aislamiento_social_test: "edificio cerrado al público hace décadas — nadie sabe que entraste"

slot_B_malo_aparente:
  name: NICO
  role_actual: malo_aparente_que_salva  # P3 inversion — el "amenazante" es quien salva
  plantilla_base: "Humano + cabeza desproporcionadamente grande + ojos negros sin pupilas (categoría 2 PAUTA § 8 — humano + cabeza geométrica imposible)"
  visual_description: |
    Humanoide bajo corpulento (1.55m), cabeza desproporcionadamente grande tipo Funko (40%
    del torso), ojos enormes negros completamente sin pupilas ni iris (charcoal pure 2cm
    diámetro cada uno). Piel tez beige amarillenta cera, sin imperfecciones — superficie
    plástica de muñeco antiguo. Saco rojo bordó estilo acomodador de cine años 50 con galones dorados
    descosidos, manchas oscuras en lapelas. Pantalones negros brillantes desgastados.
    Zapatos charol lustrados que no calzan bien (~1cm más largos que pie real). Lleva
    LINTERNA tipo Maglite chrome con haz directional. Lleva CAJA DE POPCORN rayada
    blanco/rojo años 50 — los kernels jumpean ocasional como si estuvieran palpitando
    desde dentro. Postura ligeramente inclinada hacia adelante, head turn slow.
  reference_anchor_required: true
  voice_id_canonical: "qWWAqFomnJ99VwQLREfT"  # Kate canonical validated matadero CP2
  voice_id_label: "Kate (BFP — Bright Friendly Positive)"
  lip_sync_required: true  # face visible on-screen
  active_gesture_potential: |
    linterna sweep beam viewer direction + popcorn box visibly shaking + eyes never blink
    (or blink every 4-5s very slow) + head tilt curious + occasionally extends popcorn box
    toward viewer offering

slot_C_bueno_aparente:
  name: SALVADOR  # nombre canónico para el bueno aparente — "SALVADOR" como apodo
  full_role_name: "El Proyeccionista"
  role_actual: bueno_aparente_que_daña  # P3 trampa
  plantilla_base: "Esquelético + máscara grotesca + uniforme decadente (categoría 5 PAUTA § 8 mezclada con § 9 liminal-uncanny — visualmente extreme)"
  visual_description: |
    Humanoide alto extremadamente delgado (2.05m), miembros largos, piel pálida grisácea
    cera-translúcida (puedes ver venas oscuras debajo). Ojos hundidos negros profundos
    que GLOW warm tungsten orange-amber cuando "habla" (luz desde dentro del cráneo).
    BOCA COSIDA con hilo de film celluloide marrón translúcido — 12-15 puntadas
    irregulares cruzando los labios horizontalmente. Uniforme proyeccionista años 1950:
    camisa blanca arrugada manchada de aceite negro en cuello + chaleco gris ratón
    desgastado con bolsillos para herramientas + corbatín negro deshilachado + guantes
    blancos de algodón sucios con manchas de celuloide quemado. Pantalones grises altos.
    Postura recta, head erect, manos enguantadas relajadas a los lados o gesticulando
    como si proyectara invisible film. Cuando "habla" la luz interior de la cabeza
    pulsa al ritmo del audio narration.
  reference_anchor_required: true
  voice_id_canonical: "2gPFXx8pN3Avh27Dw5Ma"  # Oxley canonical validated matadero CP2
  voice_id_label: "Oxley (deep male grave)"
  voice_effects_chain: ["pitch_-200", "highpass_120", "lowpass_3500", "reverb_old_film_20"]
  lip_sync_required: false  # boca cosida — NO mouth movement, solo eyes glow pulse sync
  active_gesture_potential: |
    gloved hands gesturing projecting invisible film + head turns slow + eyes glow pulse
    sync with narration audio (when "speaks") + breath vapor visible cold cinema
  alive_signals_compensation:  # signature limitation = boca cosida no expression
    - "Eyes glow tungsten warm pulse intensifying when speaks (despite stitched mouth)"
    - "Hand gestures gloved white — projecting invisible film motion"
    - "Head turn slow toward viewer when narrating"
    - "Breath vapor visible from nose only (mouth blocked by stitches)"
    - "Celluloid thread on lips subtle vibration when audio plays"
  has_dialogue_on_screen: true  # ⚠️ ref-08 Hugo precedent — bueno aparente PUEDE hablar

slot_D_regla_del_malo:  # ⚠️ P3 inversion — la regla es del SALVADOR (bueno aparente que daña)
  texto: "Quédate hasta el final de la función."
  tipo: "Sumisión a un procedimiento ritual (no salir de la sala)"
  count_palabras: 6  # 5-10 cumplido
  conecta_con_dilemas: true
  consecuencia_inmediata_si_rompe: |
    Si intentas levantarte → la película retrocede sola y la butaca te empuja hacia atrás
    + el hilo de celuloide de la boca del Salvador se extiende hacia tu boca

slot_E_dilemas:
  - id: D1
    timestamp_intent: "~30-35s — primer dilema interno"
    categoria: 4  # Confianza vs desconfianza
    setup: |
      El Salvador camina hacia la pantalla y enciende el proyector con un gesto. Sale
      una película muda en blanco y negro — eres tú mismo, de pequeño, en un cumpleaños
      que no recuerdas. Te ofrece una butaca: fila 3 asiento 7. Te tiende un boleto en
      blanco.
    pregunta: "¿Tomas el boleto y te sientas o lo rechazas?"
    opcion_A_impulso: "Tomar boleto (curiosidad — ver tu propia película)"  # IMPULSO primario
    opcion_B_estoica: "Rechazar el boleto y permanecer de pie"  # CONTRA impulso
    opcion_ganadora: B  # Rechazar = sobrevivir D1 (winning option contra impulso)
    consecuencia_A_body_horror: |
      Te sientas. La butaca cierra los apoyabrazos sobre tu regazo (clamp metálico audible).
      La película muestra tu cumpleaños — pero quien sopla las velas no eres tú, es el
      Salvador. El haz del proyector se extiende y entra por tu boca. Tu mandíbula se
      cose con el mismo hilo de celuloide.
    consecuencia_B_apertura: |
      Rechazas el boleto. El Salvador inclina la cabeza, las luces dentro de su cráneo
      se atenúan. Camina al lobby. Te hace seña de que lo sigas hacia la cabina de
      proyección.

  - id: D2
    timestamp_intent: "~52-58s — segundo dilema interno (categoría diferente)"
    categoria: 5  # Sumisión-instinto / resistencia-estoica
    setup: |
      Estás frente a la cabina de proyección. La puerta tiene una placa: "ÚLTIMA
      FUNCIÓN — NO INTERRUMPIR". El Salvador abre la puerta. Adentro: un asiento
      vacío, una rebobinadora gira sola, y en una mesa hay UN CORTAFILM (tijera de
      proyeccionista para cortar película). Te mira y te lo ofrece con la mano enguantada.
    pregunta: "¿Aceptas el cortafilm o sales de la cabina?"
    opcion_A_impulso: "Aceptar el cortafilm (parece protección)"  # parece sensato
    opcion_B_estoica: "Salir de la cabina"  # contra impulso (¿salir sin protección?)
    opcion_ganadora: B  # Salir = encuentra al Nico que te lleva a la salida
    consecuencia_A_body_horror: |
      Aceptas el cortafilm. Pesa más de lo que debería. La puerta se cierra detrás.
      El Salvador apunta a la rebobinadora — la película muestra ahora tu cara cosida.
      El cortafilm se mueve solo en tu mano y corta el hilo de celuloide de la boca
      del Salvador. El hilo salta de sus labios a los tuyos, los cose en silencio. Te
      sientas en el asiento de la cabina. Empieza una función que no termina más.
    consecuencia_B_apertura: |
      Retrocedes. Sales de la cabina. El haz del proyector se apaga. El Salvador se
      queda inmóvil en la puerta, mirándote sin parpadear. Detrás de ti, una luz: el
      Nico con su linterna.

slot_F_body_horror:
  tipo_principal: "pérdida progresiva de identidad/libertad + asfixia inversa (boca cosida con celuloide)"
  imagenes_validables:
    - "Mandíbula se cose con hilo de celuloide marrón (12 puntadas visibles cierran labios)"
    - "Butaca cierra apoyabrazos sobre regazo con clamp metálico audible"
    - "Haz del proyector entra por boca abierta + sale por ojos (luz tungsten warm interna)"
    - "Cortafilm (tijera del proyeccionista) corta hilo celuloide del Salvador + salta al viewer + cose sus labios"
  test_pasa: "imagen IA generable: SÍ — todas son acciones físicas concretas en setting cine"
  NO_cliché_check: |
    Evitado "bucle eterno" → "función eterna" (specific cine vocabulary)
    Evitado "te conviertes en cena" → "tu mandíbula se cose con celuloide" (concrete physical)
    Evitado "nunca encuentras la salida" → "la película retrocede cuando te levantas" (concrete trap)
    Evitado "el peor momento de tu vida" → "cumpleaños que no recordabas" (specific memory category)

slot_G_cliffhanger_archetype:
  archetype: "Paz perdida (counterfactual outro canónico 7/8 — ref-08 anclaje)"
  rotation_check: "video-log.md consultado 2026-05-20: matadero v1 usó P6 Hedonismo Eterno cliffhanger TRAP. Cinema #2 usa P3 + Paz perdida outro estándar. Pattern y archetype rotados."
  elementos_sensoriales_validados:  # PAUTA § 13 + ref-03 outro
    - "café (taza humeante)"
    - "amanecer (luz dorada por puerta lateral del cine al sol)"
    - "olor a celuloide quemado (sensory unique al setting cine)"
    - "boleto sin imprimir (objeto físico — counterfactual prop)"
    - "linterna del Nico apuntando al piso (gesto pacífico)"
  texto_intent: |
    "Si hubieras elegido a Nico, te habría guiado con la linterna hasta la puerta lateral del cine.
    Te habría entregado un boleto sin fecha y te habría dicho 'no regreses el martes'.
    Habrías salido al amanecer con el olor a celuloide quemado en la ropa."

slot_H_ambient_creatures:
  setting_aplicable: "Cine abandonado"
  criatura_seleccionada: "rata gris pequeña corriendo entre filas de butacas (visible ~5% frame width, motion lateral fugaz 1-2 apariciones)"
  proposito: "scroll-stop pasivo + comment-driver + setting alive cumple GAP #23"

