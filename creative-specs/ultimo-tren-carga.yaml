      content: "Dyad simultánea Dario + Tobias con name labels monospaced GRANDES (Y11.5), persistentes through-countdown. Hook_crescendo music cue ENTRA aquí (crescendo orquestal-industrial sobre drone_base, estilo ref-12)"
