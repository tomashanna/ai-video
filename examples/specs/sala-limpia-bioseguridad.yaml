  signature_staging: "Axel traje de presión positiva blanco con visor de domo y tres respiradores circulares que se inflan a destiempo guía al viewer entre campana de flujo laminar, autoclave y ducha de descontaminación bajo tubos UV violeta, mientras la cuarentena sella el laboratorio hasta el amanecer"

# ═══════════════════════════════════════════════════════════════
# 1.6 VIDEO CAPABILITIES (Pattern 7 Capability Matrix — MANDATORIO)
