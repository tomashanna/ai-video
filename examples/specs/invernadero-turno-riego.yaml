# 4. CHARACTERS (real invented names + name_validation gate)
# ═══════════════════════════════════════════════════════════════

characters:
  - character_id: "char_a"
    name: "Bruno"
    name_validation:
      is_real_invented_name: true
      blacklist_check_passed: true                 # NO job description (no "Jardinero/Guardia/Botánico")
      canonical_8_refs_pattern: "real_first_name"   # Bruno = nombre canónico recurrente (ref-03)
    role: "malo_aparente"                          # APARIENCIA: parece peligroso/infectado. VERDAD P9: es el salvador.
    archetype: "P9 — Peligroso te ayuda (el contaminado por el invernadero conoce las reglas de supervivencia)"
    visual_signature: |
      Jardinero humano de turno noche, complexión normal, ≈1.85m, mono de trabajo verde oliva
      gastado con guantes de jardinería cortados en los dedos. Voz tranquila, postura calmada
      pero seria. LA FIRMA UNCANNY (legible-pero-sutil, estática, face/neck-coupled): el
      INVERNADERO LO ESTÁ RECLAMANDO — tiene MUSGO y VETAS VERDES vivas creciéndole bajo y sobre
      la piel del CUELLO (lado derecho, subiendo desde el cuello de la camisa hacia la mandíbula)
      y en los NUDILLOS de ambas manos, con PEQUEÑAS HOJAS diminutas brotando entre los nudillos.
      No es monstruoso: lee como "este tipo está infectado/contaminado, es raro y peligroso" — el
      viewer desconfía de él y confía en la dulce Celeste. Cara humana completa, ojos cansados
      pero amables. Contraste vs Celeste: musgo-contaminación-seriedad vs lozanía-floral-dulzura.
    voice_id_canonical: "K3TeN3ZVK8WnOeJ0NYqZ"     # placeholder validado del catálogo; engineer confirma/ajusta voz propia de personaje vs narrador en CP2 (ver MODEL-CAPABILITIES-MATRIX character_voices)
    anchor_image_id: "char_a_v1"
    visual_signature_critical_loci: ["neck_moss", "knuckle_moss"]   # MODEL-BEHAVIOR-LOG Entry 1 — locus-coupled
    locus_anchor_required: true                    # firma rara (musgo) aislable del rostro en close-ups POV → locus anchors obligatorios
    locus_anchors:
      - locus_id: "neck_moss"
        anchor_image_id: "char_a_v1_neck"
        when_used: "shots que aíslan el cuello de Bruno sin la cara completa en frame (ej. close-up POV del cuello/musgo)"
      - locus_id: "knuckle_moss"
        anchor_image_id: "char_a_v1_knuckles"
        when_used: "shots que aíslan las manos/nudillos de Bruno (ej. Bruno abre la válvula, detalle de hojas entre nudillos)"

  - character_id: "char_b"
    name: "Celeste"
    name_validation:
      is_real_invented_name: true
      blacklist_check_passed: true                 # NO job description
      canonical_8_refs_pattern: "real_first_name"
    role: "bueno_aparente"                         # APARIENCIA: cálida, maternal, dulce. VERDAD P9: es el peligro oculto.
    archetype: "P9 dyad partner — la cálida nutricia cuyo path cozy es el counterfactual letal (lo cómodo te entrega a la planta / te envenena con esporas)"
    visual_signature: |
      Jardinera de turno noche, mujer de sonrisa dulce y maternal, ≈1.65m, mejillas sonrosadas
      lozanas, pelo recogido con una flor tropical real prendida. Viste un delantal de jardinería
      ESTAMPADO DE FLORES sobre ropa de trabajo color crema. Postura acogedora: siempre ofreciendo,
      invitando a tocar y probar, sonriendo con calidez. Su uncanny es por CONTRASTE — se ve
      demasiado sana y radiante para el invernadero nocturno húmedo, una lozanía casi vegetal en
      la piel (un brillo verde sutil bajo la luz de luna verdosa). NO tiene deformidad obvia: el
      horror es que lo SANO y nutricio es lo que mata. Sostiene fruta brillante del invernadero.
      Contraste vs Bruno: lozanía-floral-dulzura vs musgo-contaminación-seriedad.
    voice_id_canonical: "K3TeN3ZVK8WnOeJ0NYqZ"     # placeholder; engineer asigna voz cálida femenina propia en CP2
    anchor_image_id: "char_b_v1"
    visual_signature_critical_loci: []             # sin rasgo raro aislable de la cara → no requiere locus anchor
    locus_anchor_required: false

narrator_voice: "K3TeN3ZVK8WnOeJ0NYqZ"            # narrador canónico (David C2 — 157 WPM medido; engineer aplica atempo → ~165 WPM canónico)

# ═══════════════════════════════════════════════════════════════
# 5. NARRATIVE STRUCTURE (counterfactual + emotional framing)
# ═══════════════════════════════════════════════════════════════

narrative_structure:
  model_constraints_acknowledged: true                  # HR#28/#29 — narración por shot trimmed a canonical@165 ≤ min(dur, hailuo_std 5.9s); shots con narración más larga → split o freeze-extend (declarado per shot)
  pattern: "P9"
  counterfactual_placement: "before_choice_resolves"   # CANONICAL preferred (ref-09 10/10, PAUTA § 24)
  emotional_framing: "stakes_lift"                     # before_choice_resolves + stakes_lift → 10/10 combo (PAUTA § 24.8)
  cliffhanger_archetype: "P9"                          # outro variante P9 (resolución somber + cliffhanger semillas) — NO twist verbal

  canonical_constraints:
    no_retrospective_counterfactual: true
    si_elegiste_framing_required: true                 # PRINCIPIO: marcar la rama vía acción condicional ("Si comes la fruta")
    consequence_framing_style: "accion_condicional"    # D19 (2026-05-29 primary source): NUNCA bare label "Si elegiste A"
    visual_matches_narration_literal: true
    first_person_pov_locked: true

  hook_sub_beats:                                      # PAUTA § 19.5 ordering canonical (countdown LAST)
    - beat_id: "name_labels_intro"
      timestamp_intent_s: [0.0, 2.0]
      content: "Dyad simultánea Bruno + Celeste con name labels monospaced GRANDES (Y11.5)"
    - beat_id: "caption_setting_warning"
      timestamp_intent_s: [2.0, 4.5]
      content: "Narrator framing 'Elige a tu compañero para esta noche. Bruno o Celeste.' + caption warning del setting (invernadero sellado)"
    - beat_id: "push_in_micro_motion"
      timestamp_intent_s: [4.5, 6.0]
      content: "POV slow push-in hacia el dyad entre helechos (NO zoom-cut — feedback_hook_continuity_no_zoom_cut)"
    - beat_id: "countdown_3_2_1"
      timestamp_intent_s: [6.0, 9.0]
      content: "Film Leader Academy countdown vía AVU clip (digit 1.0s c/u)"
      avu_clip: "countdown-3-2-1-film-leader-with-ticks.mp4"

