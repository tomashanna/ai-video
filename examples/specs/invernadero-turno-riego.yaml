music_continuous_layers:
  - layer_id: "drone_base"                             # LAYER 1 drone (continuous 80-100%)
    scope: "cross_clip_continuous"
    sections: [{from: 0, to: 90, intent: "drone orgánico cálido-húmedo, tensión sostenida subharmónica con textura vegetal"}]
    eleven_labs_prompt: "low organic drone, warm humid greenhouse tension, deep sustained bass tone with subtle wet vegetal texture, faint high-frequency insect-like shimmer, no melody, dark cinematic horror ambient bed"
    compose_strategy: "single_continuous_90s"
    target_lufs_pre_mix: -27
    sidechain_duck_target: true
  - layer_id: "ambient_greenhouse"                     # LAYER 2 ambient (scene-specific)
    scope: "cross_clip_continuous"
    sections: [{from: 6, to: 75, intent: "ambiente invernadero nocturno: goteo de condensación + vapor siseando + hojas crujiendo + zumbido lejano de bombas de riego"}]
    eleven_labs_prompt: "tropical greenhouse night room tone, dripping condensation, hissing warm vapor, creaking leaves and stems, distant irrigation pump hum, faint dripping water, humid, no music"
    compose_strategy: "loop_10s_stretched"
    target_lufs_pre_mix: -30
  - layer_id: "ambient_dawn_warm"                      # LAYER 2 ambient variante cozy (counterfactual/resolución/outro)
    scope: "cross_clip_continuous"
    sections: [{from: 9, to: 17, intent: "amanecer cálido entre flores"}, {from: 78, to: 90, intent: "resolución + outro cozy"}]
    eleven_labs_prompt: "warm greenhouse dawn ambience, gentle morning birdsong faint through glass, soft watering can trickle, calm warm air, peaceful, no horror"
    compose_strategy: "single_8s_reusable"
    target_lufs_pre_mix: -29
  - layer_id: "accent_climax"                           # LAYER 3 accent (event-driven D3 clímax)
    scope: "clip_scoped_or_effect"
    sections: [{from: 58, to: 70, intent: "tensión rising en decisión 3 + body horror lianas/vapor"}]
    eleven_labs_prompt: "rising dark cinematic strings tension, wet organic creaking building, pressurized hiss swell, climax buildup, no drums"
    compose_strategy: "single_12s"
    target_lufs_pre_mix: -25
  - layer_id: "outro_drone"
