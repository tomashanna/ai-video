  sfx_categories:
    - viento_andino_continuous_ambient  # volume 0.10-0.18 layer continua
    - chapa_cabina_cruje_isolated_events  # volume 0.20-0.30
    - cable_telesilla_metal_creak  # volume 0.18-0.25
    - radio_walkie_crackle  # H2
    - aullido_lejano_sub_bass_ambient_creature  # Slot H, volume 0.18
    - sub_bass_golpes_base_cabina  # H5 D3 setup, volume 0.40
    - mandibula_cae_metal_floor_impact  # H5 revelación, volume 0.50
    - viento_succion_ventanuco_roto  # H5 revelación, volume 0.45
    - fogata_refugio_crackle  # H6 outro, volume 0.20
    - perro_respiracion_dormida  # H6 outro, volume 0.15
    - radio_AM_folclore_distant  # H6 outro, volume 0.12

