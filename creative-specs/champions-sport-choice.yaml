# CREATIVE-SPEC — champions-sport-choice (PRIMER VIDEO formato sport-choice)
# schema: v11.1 (HYBRID + canonical refs structural linkage)
# Author: 🏛️ ARQUITECTO (creative-director) — formato NUEVO sport-choice 2026-05-31
# Genre: sport-choice × reel | Pattern P3 (rama corta del foil = "lo seguro/fácil" del rival favorito)
#   | Dyad FOOTBALLER (likeness foto-real)
# ───────────────────────────────────────────────────────────────────────────────────────
# FORMATO sport-choice: HEREDA 100% la ESTRUCTURA de horror-choice (schema v11.1, POV 1ª persona,
#   hook dyad con name labels GRANDES, 3 decisiones con countdown + botones A/B, framing acción-
#   condicional "Si encaras / Si devuelves", counterfactual opening, resolución + cliffhanger/CTA,
#   ~90s, español neutral, narrador David C2 K3TeN3ZVK8WnOeJ0NYqZ, captions Whisper, @elige_tucompanero).
#   CAMBIA SOLO la HISTORIA/LÓGICA: NO horror, NO sobrenatural. 100% DRAMA DEPORTIVO.
#     - La ELECCIÓN del hook = EQUIPO. Elegir a un jugador = jugás PARA su equipo.
#       Si eliges a Saka → juegas para el ARSENAL.  Si eliges a Dembélé → juegas para el PSG.
#     - Las DECISIONES = jugadas reales de fútbol dentro del partido (encarar/devolver, buscar
#       ángulo/asistir, definir cruzado/picar). CONSECUENCIAS 100% fútbol:
#         · opción ARRIESGADA-pero-CORRECTA → la jugada de gol avanza.
#         · opción ERRADA → error → la jugada se cae → PSG capitaliza → PIERDES y eres LA BURLA
#           (memes, redes, abucheos de la hinchada). NO muerte, NO horror.
#     - Acertar las 3 → GOL → ARSENAL CAMPEÓN, levantas la orejona, GLORIA.
# ───────────────────────────────────────────────────────────────────────────────────────
# ESTRUCTURA APROBADA (ramas asimétricas en UN video):
#   · RAMA CORTA (~3 shots, ocupa el slot del counterfactual de APERTURA): "Si eliges a
#     Dembélé → juegas para el PSG" → glimpse veloz del favorito, la jugada sale redonda → gol,
#     PSG campeón, gloria rápida. Es el FOIL (camino-no-tomado) que NO spoilea la rama de Saka.
#   · RAMA PROFUNDA (núcleo interactivo, las 3 decisiones): "Si eliges a Saka → juegas para el
#     Arsenal" → D1 banda (encarar/devolver) → D2 borde del área (ángulo/asistir) → D3 clímax
#     mano a mano con el arquero (cruzado/picar). Acierto en las 3 → gol → Arsenal campeón.
#     Error en cualquiera → la jugada se cae → PSG gana → eres la burla.
# ───────────────────────────────────────────────────────────────────────────────────────
# REGLA DE AMBIENTE (user): cada visual_intent UBICA la escena ANTES de la acción, en orden:
#   (1) cámara POV jugador → (2) ZONA del campo (banda/borde del área/mano a mano/medio campo)
#   → (3) GEOGRAFÍA (arco, compañeros kit propio rojo, rivales kit PSG azul, balón, líneas de cal)
#   → (4) ESTADIO Champions lleno + reflectores → (5) ACCIÓN/animación. Premium broadcast (85mm,
#   profundidad de campo). DEBE quedar CLARÍSIMO qué pasa en el partido en cada shot.
# ───────────────────────────────────────────────────────────────────────────────────────
# SCAFFOLD: reskin de champions-arsenal-wins.yaml (22 shots) — shot_ids, duration_intent_s,
#   secciones, transiciones, UI timeline, anchors (char_a=Dembélé #10 PSG, char_b=Saka #7 Arsenal)
#   INTACTOS para CP-compatibilidad. Solo se reskineó la historia a sport-choice (cero horror).
# Self-audit HR#27: 3 validators corridos, 0 findings 🔴 (ver architect_annotations + reporte chat).

schema_version: "v11.1"
schema_revised: "2026-05-22"
schema_purpose: "HYBRID architecture canonical V4+ — per-clip atomic captions burned + Layer 3 cross-clip + HyperFrames UI overlay + canonical refs structural linkage — sport-choice football drama (NO horror)"

# ═══════════════════════════════════════════════════════════════
# 1. PROJECT METADATA
# ═══════════════════════════════════════════════════════════════

project:
  project_id: "champions-sport-choice"
  format: "sport-choice"
  delivery: "reel"
  pattern: "P3"                          # rama corta del foil = "lo fácil/seguro" del favorito PSG (counterfactual opening)
  pattern_rotation_check: "FIRST video del formato sport-choice (no hay prior en video-log de sport-choice). Pattern P3 declarado para satisfacer el enum canónico del validator {P1,P2,P3,P6,P9}. HR#14 N/A (sin consecutivo previo del mismo formato)."
  setting: "Final de la Champions League en el Puskás Aréna de Budapest, minuto decisivo del partido, POV de un jugador sobre el césped que debe elegir compañero/equipo y resolver la jugada que define la final"
  total_duration_s_intent: 90            # banda 80-100s; target 90s
  channel: "@elige_tucompanero"
  language: "Spanish neutral"            # tú/dices/eliges — NUNCA voseo
  topical: true
  topical_window: "Final Champions 2025/26 Arsenal vs PSG — publicar en ventana del partido"
  location: "estadio de futbol Puskás Aréna final Champions césped jugada decisiva sport-choice"
  signature_staging: "POV de un jugador en el césped del Puskás Aréna en el minuto decisivo de la final de la Champions; a su izquierda Saka, su posible compañero del Arsenal, con la camiseta roja de mangas blancas dorsal 7 y una sonrisa amplia que pide el balón, y a su derecha Dembélé, el favorito del PSG, con la camiseta azul marino de franja roja dorsal 10 y bigote, mientras 67000 hinchas rugen, los reflectores caen sobre las líneas de cal y la jugada que reparte la orejona espera por su decisión"

# ═══════════════════════════════════════════════════════════════
# 1.6 VIDEO CAPABILITIES (Pattern 7 Capability Matrix — MANDATORIO)
# ═══════════════════════════════════════════════════════════════

video_capabilities:
  source_clips_origin: "ai_generated"
  has_ai_generated_clips: true
  has_tts_narration: true
  has_human_voiceover: false
  audio_mix_target: "lufs_-14"
  has_sfx_layer: true
  has_captions_baked: true
  has_layer_2_effects: true
  has_layer_3_music: true
  has_layer_4_ui: true
  format_type: "interactive_choice"      # sport-choice ES interactive_choice (hereda mecánica horror-choice)
  duration_intent_s: 90
  target_fps: 30
  output_resolution: "1080x1920"
  model_constraints_acknowledged: true   # HR#28/#29 — narración@165 ≤ min(dur, clip_max tier) por shot
  name_label_fontsize_intent: "large"
  topical_real_person_exception: true    # jugadores reales (Saka / Dembélé)

# ═══════════════════════════════════════════════════════════════
# 1.5 REFERENCES CANONICAL (≥5/8 — mandatory linkage)
# ═══════════════════════════════════════════════════════════════
# NOTA formato nuevo: sport-choice HEREDA la mecánica estructural de horror-choice, así que las
# refs canónicas se citan por su valor ESTRUCTURAL (placement del counterfactual, framing acción-
# condicional, dyad bueno/foil, escalada de 3 decisiones, outro cozy), NO por su contenido de horror.

references_canonical:
  - ref_id: "ref-09"                              # canonical-scenes/ref-09-victor-axel-cockpit.md
    informs:
      - "narrative_structure.counterfactual_placement"
      - "narrative_structure.emotional_framing"
      - "shot_list.shot_02.narration_in_this_shot"
    why_relevant: "ref-09 obtuvo 10/10 en comprensión narrativa con counterfactual OPENING ANTES de que resuelva la rama jugable = sube stakes (PAUTA § 24). Calco esa colocación para la RAMA CORTA: 'Si eliges a Dembélé juegas para el PSG → la mete → PSG campeón' se enuncia temprano (shots 02-04) como el camino-no-tomado glorioso, creando contraste emocional antes de entrar a la rama interactiva de Saka. También la cadena de 3 decisiones escaladas."

  - ref_id: "ref-03"                              # canonical-scenes/ref-03-bruno-pablo-mina.md
    informs:
      - "narrative_structure.canonical_constraints.consequence_framing_style"
      - "shot_list.shot_07.narration_in_this_shot"
      - "editing_targets.pacing_modulation"
    why_relevant: "ref-03 fija el framing acción-condicional dominante ('Si la enciendes...') + 'Ahora decides' como gatillo universal. Calco ese estilo a las JUGADAS de fútbol ('Si encaras al lateral...', 'Si devuelves seguro...', 'Si la cruzas...', 'Si picas...') y el pacing que acelera en la consecuencia (gol o error)."

  - ref_id: "ref-06"                              # canonical-scenes/ref-06-enzo-axel-carretera.md
    informs:
      - "shot_list.shot_16.narration_in_this_shot"
      - "narrative_structure.canonical_constraints.si_elegiste_framing_required"
    why_relevant: "ref-06 cierra el path donde la opción correcta te lleva al payoff y la errada al fracaso específico del setting, con framing acción-condicional + CTA verbal final ('Elige a tu compañero para...'). Calco la dinámica del clímax (D3 mano a mano): definir bien = gol y campeón; errar = PSG gana y eres la burla."

  - ref_id: "ref-08"                              # canonical-scenes/ref-08-hugo-pablo-acuario.md
    informs:
      - "project.pattern"
      - "characters.char_a"
      - "shot_list.shot_22.narration_in_this_shot"
    why_relevant: "ref-08 (dyad bueno-aparente que HABLA on-screen + outro cozy específico al setting) informa: Saka habla on-screen pidiendo el balón ('Confía en mí, yo la meto') y el outro cozy = vuelta olímpica con la orejona en lugar de horror. El FOIL (Dembélé, el favorito 'obvio/fácil') ocupa la rama corta no-jugable, calcando la lógica P3 sin su muerte."

  - ref_id: "ref-10"                              # canonical-scenes/ref-10-rurik-enzo-fundicion.md
    informs:
      - "characters.char_b.visual_signature"
      - "music_continuous_layers.drone_base"
      - "shot_list.shot_05.narration_in_this_shot"
    why_relevant: "ref-10 (escalada de control + drone base de tensión sostenida) informa cómo escalan las 3 decisiones de la rama de Saka (la presión sube banda → borde del área → mano a mano) y el drone base de tensión deportiva sostenida bajo el rugido del estadio."

  # Refs NOT usados (declaro razón):
  # - ref-11 (@referent-c atypical, NO referent-a canon — excluido per INDEX outliers flag)
  # - ref-12 (outro melodramático + apuñalamiento — tono horror ajeno al drama deportivo)
  # - ref-13 (P6 hedonismo — pattern no aplicable a este concepto)

# ═══════════════════════════════════════════════════════════════
# 2. ASSEMBLY STRATEGY
# ═══════════════════════════════════════════════════════════════

assembly_strategy: "per_clip_atomic_hybrid"     # Hard Rule #25 — V4+ canonical

# ═══════════════════════════════════════════════════════════════
# 3. HYBRID LAYERS DECLARATION (Hard Rule #25)
# ═══════════════════════════════════════════════════════════════

hybrid_layers:
  layer_1_per_clip_atomic:
    description: "Per-shot mp4 con visual + audio clip-scoped + captions BURNED en frame data"
    captions_source: "whisper_from_clip_audio"
    captions_burn_script: "scripts/build_clip_atomic.py --bake-captions"
    audio_bundled_per_clip:
      - "narrator_segments_within_this_clip"
      - "character_dialog_within_this_clip"        # Saka (lip-sync) + Dembélé (1-2 líneas)
      - "diegetic_sfx_within_this_clip"            # crowd roar / whistle / net / chants + abucheos en errores
      - "clip_scoped_ambient_short"
    output_path_convention: "<project>/assets/clips-atomic/shot_NN_<descriptor>_atomic.mp4"
    manifest_path_convention: "<project>/assets/clips-atomic/shot_NN_<descriptor>_manifest.yaml"

  layer_2_effects_between_clips:
    description: "Transiciones + stings en boundaries (hard-cut+whoosh, white-flash en el remate, freeze-filter en decisión)"
    effects_library_ref: ".claude/skills/ai-video-production/templates/effects-library/transitions/"
    transition_variety_min: 3
    non_diegetic_sfx_placement: "effect_layer"

  layer_3_cross_clip_continuous:
    description: "Audio que NO corta en boundaries — overlaid post-concat con sidechain duck"
    layers:
      - "narrator_master_continuous"
      - "music_drone_base"
      - "ambient_stadium_crowd_continuous"
    sidechain_target_db: -6
    overlay_pipeline: "scripts/build-video-hybrid.py --post-concat-overlay"

  layer_4_hyperframes_ui_overlay:
    description: "Countdown film-leader + decision UI (loading Y52 / countdown Y46) + name labels LARGE + outro card"
    elements:
      - "countdown_3_2_1_hook"
      - "decision_freeze_d1"
      - "decision_freeze_d2"
      - "decision_freeze_d3"
      - "outro_card_cliffhanger"
      - "watermark_handle_persistent"

