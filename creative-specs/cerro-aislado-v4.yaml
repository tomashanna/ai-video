# ═══════════════════════════════════════════════════════════════
# 3. HYBRID LAYERS DECLARATION
# ═══════════════════════════════════════════════════════════════

hybrid_layers:
  layer_1_per_clip_atomic:
    description: "Per-shot mp4 with visual + clip-scoped audio + captions BURNED into frame data"
    captions_source: "whisper_from_clip_audio"
    captions_burn_script: "scripts/build_clip_atomic.py --bake-captions"
    audio_bundled_per_clip:
      - "narrator_segments_within_this_clip"
      - "character_dialog_within_this_clip"
      - "diegetic_sfx_within_this_clip"
      - "clip_scoped_ambient_short"
    output_path_convention: "cerro-aislado-v4/assets/clips-atomic/shot_NN_<descriptor>_atomic.mp4"
    manifest_path_convention: "cerro-aislado-v4/assets/clips-atomic/shot_NN_<descriptor>_manifest.yaml"

  layer_2_effects_between_clips:
    description: "Transitions + stings + cross-fade + flash + glitch applied AT shot boundaries"
    effects_library_ref: ".claude/skills/ai-video-production/templates/effects-library/"
    transition_variety_min: 3
    non_diegetic_sfx_placement: "effect_layer"

  layer_3_cross_clip_continuous:
    description: "Audio layers that MUST NOT cut at shot boundaries — overlaid POST-concat with sidechain duck"
    layers:
      - "narrator_master_continuous"
      - "music_drone_base_cold"
      - "ambient_caseta_continuous"
      - "ambient_wind_exterior_low"
    sidechain_target_db: -6
    overlay_pipeline: "scripts/build-video-hybrid.py --post-concat-overlay"

  layer_4_hyperframes_ui_overlay:
    description: "Countdown clips + decision UI + outro card + watermark via HyperFrames timeline.main"
    elements:
      - "countdown_3_2_1_hook"
      - "decision_freeze_d1"
      - "outro_card_cliffhanger"
      - "watermark_handle_persistent"

