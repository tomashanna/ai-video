# cabina-14.yaml — CREATIVE SPEC v1.0
#
# Basado en CREATIVE-SPEC-TEMPLATE.yaml v3 + grounded en PAUTA-MASTER.md
# (autoridad empírica derivada de 8 videos canónicos en /videosref_elige_tu_compa/).
#
# NOTAS DE FRAMING IMPORTANTES (decisiones explícitas):
#   1. Pattern P3 (Seguro era trampa) — el VISUALMENTE amable (EMI cute fucsia)
#      es la trampa real. El VISUALMENTE uncanny extreme (TADEO gaucho correoso)
#      es el guardián real. Estructura espejo a ref-08 (Pablo cute = malo,
#      Hugo esqueleto = bueno).
#   2. Slot D (regla del malo): atipicamente las 3 reglas explícitas vienen
#      del GUARDIÁN (Tadeo), NO del villano (Emi). EMI es la "dinámica de
#      control" que empuja casualmente a romperlas con peticiones amistosas.
#      Esta inversión refuerza el pattern P3 sin romper la mecánica de
#      Slot D (las reglas siguen existiendo, solo cambia quién las pronuncia).
#   3. Setting fresco: telesilla suspendido. NO usado en ningún canónico ni
#      en producciones nuestras. Atrapamiento físico literal (30m sobre vacío).
#   4. Mood: folklore patagónico invernal. Bariloche/Cerro Catedral estética.
#      Mate, lana cruda, perros ovejeros, gaucho-uncanny en outro.
#   5. Ambient creature (Slot H): silueta cuadrúpeda larga cruza nieve a 30m
#      abajo durante H2 (4s, en plano POV ventanuco) mientras narración
#      principal continúa con las 3 reglas. Conecta con "algo golpea cabina"
#      de H5.
#   6. Plot twist coherente — H5 revelación EMI cumple 3 condiciones (lógica
#      en 1 frase + imagen visual + narración explícita). Ver plot_twist
#      section abajo.

# ============================================================
# META
# ============================================================
project_id: cabina-14
template_used: elige-tu-companero
delivery_format: reel_9_16
duration_target: 95s  # sweet spot V15 80-100s
budget_target_usd: 10
created_at: 2026-05-15
status: draft  # esperando architect audit + user approval

# ============================================================
# SLOTS A-H (estructura primaria — PAUTA-MASTER §§ 7-14)
# ============================================================

# Slot A — Escenario (PAUTA § 7)
slot_A_escenario:
  setting_id: custom_montaña_invernal  # NO existe en catálogo 8 canónicos — extrapolación
  setting_name: "Cabina de telesilla 14 suspendida a 30m sobre nieve, Cerro Catedral / Bariloche"
  function_lugar: "telesilla averiado durante tormenta de nieve — encerrados 6 horas hasta reparación"
  elementos_diegeticos:
    - "Cabina chapa roja oxidada con número 14 pintado blanco descolorido"
    - "Asientos cuerina gastada frente a frente"
    - "Vidrios biselados con escarcha (3 ventanucos: 2 laterales + 1 frontal)"
    - "Pestillo de ventanuco lateral (signal trampa H5)"
    - "Radio walkie crepitante con anuncio inicial"
    - "Sticker descolorido logo estación + placa metálica grabada con número 14"
    - "Cable del telesilla visible arriba (cruje con viento)"
    - "Luz dorada del refugio a 800m a través de tormenta (recordatorio inalcanzable)"
  iluminacion_dominante: "azul/verde frío nocturno invernal Bariloche + crushed blacks + único punto cálido = faro lejano refugio 800m a través de nieve cayendo"
  material_paredes_suelo: "chapa roja oxidada interior + asientos cuerina marrón gastada + piso metálico estriado con marcas de borceguíes"
  validacion_pauta:
    atrapamiento_fisico: true   # 30m sobre vacío, salir = caer
    aislamiento_social: true    # solo 3 en cabina, refugio inalcanzable
    funcion_especifica: true    # NO genérico "lugar frío" — telesilla averiado con anuncio radio específico
    iluminacion_dramatica: true # azul invernal + flicker walkie + foco refugio lejano

# Slot B — Visual del malo APARENTE (PAUTA § 8)
# NOTA P3: el malo aparente AQUÍ es el visualmente uncanny extreme (TADEO),
# que terminará siendo el BUENO REAL. La inversión es la sustancia del pattern P3.
slot_B_malo_aparente:
  name: TADEO  # 3 sílabas, fonéticamente grave
  rol_real: GUARDIAN  # P3: el malo aparente VISUAL es el bueno real
  plantilla_base: "Categoría 4 — humano + alteración corporal extrema AMORFA (referencia ref-03 Bruno cuello largo + ref-10 Enzo flaco esquelético) con detalle local patagónico"
  visual_description: |
    Anciano gaucho-AMORFO patagónico, ~2.05m alto cuando estaría parado, extremadamente
    delgado al punto de ser esquelético.
    Cara: piel correosa color papel envejecido amarillento, profundos surcos verticales
    en las mejillas hundidas, pómulos altos huesudos protruyentes, cuencas oculares
    visiblemente más profundas que humano normal, ojos castaño opaco SIN parpadeo
    perceptible — uno levemente más bajo que el otro (asimetría sutil pero visible).
    Bigote canoso largo cayendo sobre boca apretada que parece demasiado pequeña para
    la cara. Boina de paño negro vieja inclinada a un lado sobre cráneo alargado vertical.
    Cuello significativamente más largo y delgado que un humano normal (1.8x — AMORFO,
    NOTORIO uncanny, NO sutil), las venas del cuello visibles, traquea protruyendo.
    Cuerpo: abrigo de lana cruda color crema apolillado con parches marrones cosidos a mano,
    pañuelo rojo nudo al cuello tipo gaucho. Hombros caídos asimétricos (derecho más bajo).
    Pantalón bombacha azul oscuro metido en borceguíes de cuero gastado.
    Manos: dedos visiblemente AMORFOS, demasiado largos (2.0x), nudosos, artríticos,
    con falanges visibles, sosteniendo termo de aluminio abollado verde militar y
    bombilla de metal labrada. Las manos parecen "demasiado grandes" para sus brazos.
    Postura: sentado erguido con espalda contra el respaldo, manos sobre
    rodillas. Habla muy bajo, casi en susurro, sin abrir la boca mucho.
    Movimiento: micro-quietud absoluta entre frases. Cuando habla, solo
    la mandíbula se mueve un mínimo. Cuando algo cambia (golpe radio,
    silueta cruza), gira solo los ojos hacia el sonido, NO la cabeza.
    Detalle clave: cuando en H5 protege al viewer, abre los brazos
    en forma de cruz protectora — momento en que se ven los dedos
    extralargos extendidos.
  has_dialogue: true  # da las 3 reglas (Slot D) y la narrativa lo permite (PAUTA § 3 dice variable)
  reference_anchor_required: true
  validacion_pauta:
    scroll_stop: true       # uncanny extreme cuello+dedos largos en silencio
    incorrecto_innombrable: true  # gaucho-pero-no-quite-gaucho, viejo-pero-no-quite-humano
    no_halloween_costume: true    # detalles sutiles (cuello 1.4x, dedos 1.6x) — no obvio fantasía

# Slot C — Visual del bueno APARENTE (PAUTA § 9)
# NOTA P3: el bueno aparente AQUÍ es el visualmente amable (EMI),
# que terminará siendo el MALO REAL (trampa).
slot_C_bueno_aparente:
  name: EMI  # 2 sílabas, ahora femenino — chica argentina joven adulta
  rol_real: VILLAIN  # P3: el bueno aparente VISUAL es la trampa real
  plantilla_base: "Categoría AMORFA cute-but-wrong (referencia ref-08 Pablo cute tubérculo + ref-12 Teresa rasgos sutilmente off — EMI es joven femenina con proporciones AMORFAS)"
  gender: female  # CAMBIO 2026-05-15 user feedback CP1
  visual_description: |
    Joven argentina ~19 años, contextura compacta y baja ~1.55m, AMORFA en
    sus proporciones de manera sutil pero clara.
    Cara: cara redonda demasiado redonda, cabeza visiblemente más grande de
    lo que correspondería a su cuerpo (proporción cabeza-cuerpo 1:5 en vez
    de 1:7 humano normal). Mejillas coloradas por frío demasiado rosadas
    como pintadas. Ojos castaños demasiado grandes para la cara, brillantes
    con catch-light reflectivo cat-eye anormal que persiste incluso sin
    fuente de luz visible. Sonrisa muy simétrica casi siempre presente,
    boca demasiado pequeña para los ojos enormes, dientes blancos perfectos
    suspiciously uniformes cuando se ven. Pestañas pobladas exageradas.
    Cuello demasiado corto (0.6x normal) — la cabeza parece reposar
    directamente sobre los hombros.
    Pelo: castaño claro, ondas naturales, dos colas/coletas bajas con
    pompones de lana, flequillo recto cubriendo frente.
    Vestuario: campera de plumas color fucsia/rosa fluo (TURISTA típico),
    gorro de lana con pompón blanco descolorido enorme (más grande de lo
    normal), buff de cuello con estampado naïve de pingüinos, calzas térmicas
    rosas, zapatillas trekking blancas con detalles rosas suspiciously
    limpias para tormenta, guantes de polar negros — manos demasiado pequeñas
    para los brazos. Pulseras de cordón colorido en muñecas.
    Postura: cruzado de piernas en el asiento, relajado, mascando chicle
    rosa visible cuando habla. Movimientos demasiado fluidos, gestos
    expansivos amplios. Cuando inclina la cabeza, lo hace 5-10° más allá
    de lo normal humano.
    Detalle clave (H5 revelación): cuando se cae la máscara, la mandíbula
    SE DESPRENDE del rostro como una pieza separada y cae al piso metálico
    haciendo ruido sordo, los ojos se vuelven completamente negros sin
    pupila (orbe negro liso), y los brazos se extienden al doble de
    largo saliendo disparados por el ventanuco lateral. El cuerpo
    fucsia queda sentado y aparentemente "normal" mientras los brazos
    largos están afuera buscando agarrar.
  has_dialogue: true  # EMI habla casual — propuestas amables que rompen las reglas
  reference_anchor_required: true
  validacion_pauta:
    contraste_visual_con_TADEO: true  # cute/fucsia/joven/horizontal vs uncanny/lana-cruda/anciano/vertical
    postura_no_amenazante_inicial: true  # cruzado piernas, sonrisa, ofrece chicle
    outcome_NO_es_cozy: true  # P3: EMI no termina en counterfactual paz — TADEO sí

# Slot D — REGLAS / DINÁMICA DE CONTROL (PAUTA § 10)
# NOTA framing P3 — atipicamente las 3 reglas vienen del guardián (TADEO),
# y la "dinámica de control del malo" (EMI) es la presión casual a romperlas.
slot_D_regla_del_malo:
  textual_reglas_explicitas_dichas_por_TADEO:
    - texto: "No le contestes."
      count_palabras: 3
    - texto: "No abras el ventanuco."
      count_palabras: 4
    - texto: "No mires hacia abajo."
      count_palabras: 4
  tipo: "Sumisión a procedural protector (las 3 reglas son el sistema que te mantiene vivo)"
  conecta_con_dilemas: true  # cada uno de los 3 dilemas testea una de las 3 reglas
  dinamica_control_EMI_implicita: |
    EMI empuja casualmente a romper cada regla con tono amable adolescente:
    - Pide chiste → rompe "no le contestes"
    - Se desabrocha cinturón "para acomodarse" → empuja a moverse/responder
    - Pone mano en pestillo "para mirar abajo" → rompe "no abras ventanuco" + "no mires hacia abajo"
  consecuencia_inmediata_si_rompe: |
    - Romper "no le contestes" → pulmones colapsan (aire de cabina succionado)
    - Romper "no te muevas/desabrochar" → ráfaga sacude cabina, salís disparado lateral
    - Romper "abrir ventanuco / mirar abajo" → brazo largo entra, te arrastra al vacío

# Slot E — 3 dilemas internos (PAUTA § 11 → 3-4 decisiones empírico)
# Cada uno testea una de las 3 reglas de TADEO + EMI lo empuja a romperla
slot_E_dilemas:
  - id: D1
    timestamp_intent: "post-H2 setup (22-40s)"
    regla_testeada: "No le contestes"
    categoria: 2  # Acción vs pasividad
    setup: |
      Emi te ofrece un chicle Bazooka. Sonrisa simétrica.
      "Loco qué chamuyo este telesilla, bro. ¿Sabés algún chiste para
      pasar el rato?" Cuarenta minutos en silencio. La cabina se mece.
      Tu lengua se calienta sola (impulso de contestar).
    pregunta: "AHORA DECIDE. A. CONTESTAR. B. SILENCIO."
    opcion_A_impulso: "A. CONTESTAR — romper silencio por incomodidad social"
    opcion_B_estoica: "B. SILENCIO — seguir regla 1 de TADEO"
    opcion_ganadora: B
    consecuencia_A_body_horror: |
      Tu voz sale sin sonido. El aire de la cabina es succionado hacia
      donde estaba EMI. Sentís peso en el pecho. Tus pulmones colapsan
      desde adentro mientras EMI sigue sonriendo sin moverse. La sonrisa
      no se mueve.
    consecuencia_B_apertura: |
      Tadeo te asiente despacio. EMI te mira fijo. Cierra la boca
      lentamente. La sonrisa permanece visible pero los ojos quedan
      vacíos por 1 segundo antes de re-encenderse.

  - id: D2
    timestamp_intent: "post-D1 (40-58s)"
    regla_testeada: "No mires hacia abajo / No te muevas de tu postura"
    categoria: 3  # Sumisión vs resistencia estoica (DIFERENTE a D1)
    setup: |
      Una hora después. EMI se desabrocha el cinturón de la cabina.
      "Me acalambro, bro." Se estira hacia adelante. Sus rodillas
      tocan las tuyas. El movimiento hace que la cabina se sacuda
      ligeramente. Tadeo tensa los dedos largos sobre el suyo propio.
    pregunta: "AHORA DECIDE. A. DESABROCHARTE. B. NO MOVERTE."
    opcion_A_impulso: "A. DESABROCHARTE — imitar para estirar la pierna y aliviar tensión postural"
    opcion_B_estoica: "B. NO MOVERTE — seguir regla 3 de TADEO"
    opcion_ganadora: B
    consecuencia_A_body_horror: |
      Una ráfaga sacude la cabina. La puerta lateral se abre por la fuerza
      del viento. Sin cinturón, salís disparado por la apertura. Caída de
      30 metros sobre rocas afiladas semi-cubiertas de nieve. Plano
      cenital del impacto.
    consecuencia_B_apertura: |
      Tadeo cruza su brazo largo sobre tu pecho, fijándote contra el
      respaldo. EMI vuelve a abrocharse, lento. Te mira con la sonrisa
      intacta. Sus ojos parpadean (primera vez en el video).

  - id: D3
    timestamp_intent: "post-D2 (58-82s) — incluye revelación EMI"
    regla_testeada: "No abras el ventanuco"
    categoria: 1  # Curiosidad vs obediencia (DIFERENTE a D1 y D2)
    setup: |
      Tres de la madrugada. Algo golpea la base de la cabina desde abajo.
      Una. Dos. Tres veces. Sub-bass profundo. EMI se inclina hacia el
      ventanuco lateral. "Ufa loco, mirá qué es." Pone la mano en el
      pestillo. Sus dedos están MÁS LARGOS que al inicio del video
      (setup element sutil).
    pregunta: "AHORA DECIDE. A. ABRIR EL VENTANUCO. B. NO ABRIR."
    opcion_A_impulso: "A. ABRIR — curiosidad de qué golpea + Emi insiste"
    opcion_B_estoica: "B. NO ABRIR — seguir regla 2 de TADEO"
    opcion_ganadora: B
    consecuencia_A_body_horror: |
      Abrís pestillo. Un brazo larguísimo entra por la apertura, te
      agarra por la chaqueta, te arrastra afuera de la cabina hacia
      la nieve. Quedás suspendido a 30m en el aire, succionado hacia
      abajo. Te congelás a mitad de caída antes de impactar.
    consecuencia_B_apertura: |
      [REVELACIÓN EMI — pattern P3 payoff]
      Tadeo te empuja contra el rincón opuesto, cubriéndote con sus
      brazos extendidos en cruz protectora. El ventanuco se rompe igual
      desde afuera. EMI se ríe — pero la risa NO sale por la boca,
      sale por el ventanuco roto. Su MANDÍBULA SE DESPRENDE del rostro
      y cae al piso metálico (cling sordo). Sus ojos se vuelven
      completamente NEGROS sin pupila. Sus BRAZOS se duplican en largo
      y salen disparados por el ventanuco buscando lo que estaba afuera.
      El cuerpo fucsia queda quieto en el asiento mientras los brazos
      están afuera trabajando.

# Slot F — Body horror específico (PAUTA § 12)
slot_F_body_horror:
  tipos_principales:
    - "Caída/impacto físico"     # D2 conseq A (30m sobre rocas)
    - "Asfixia/colapso pulmonar" # D1 conseq A (succión aire cabina)
    - "Penetración por extremidad alargada" # D3 conseq A (brazo largo agarra y arrastra)
    - "Congelamiento"             # D3 conseq A (te congelás a mitad de caída)
  imagenes_validables:
    - "Pulmones colapsan desde adentro — peso en el pecho, sin aire"
    - "Cuerpo lanzado por apertura lateral, caída 30m sobre rocas semi-cubiertas de nieve"
    - "Brazo larguísimo entrando por ventanuco roto agarrando chaqueta"
    - "Cuerpo suspendido en aire congelándose a mitad de caída"
    - "Mandíbula de EMI cayendo al piso metálico como pieza desensamblada"
    - "Ojos de EMI volviéndose orbe negro liso sin pupila"
    - "Brazos de EMI duplicando largo saliendo por ventanuco roto"
  test_pasa: "IA puede generar todas estas imágenes — body horror visualizable concreto"
  cumple_pauta: true  # NUNCA "mueres" abstracto — siempre imagen específica al setting

# Slot G — Cliffhanger archetype (PAUTA § 13 — Paz perdida domina 7/8 canónicos)
slot_G_cliffhanger_archetype:
  archetype: "Paz perdida"  # 7/8 canónicos = default empírico
  rotation_check: "video-log: último P6 (3x) + P4 (2x) → P3 nuevo + Paz perdida outro OK"
  elementos_sensoriales_validados_seleccionados:  # 4 elementos warm
    - "Mate amargo en termo aluminio verde (mismo termo que TADEO sostiene en cabina — continuidad visual)"
    - "Bizcochuelos de grasa apilados en plato de loza"
    - "Manta de lana cruda sobre las piernas del viewer (POV)"
    - "Perro ovejero patagónico echado a los pies"
    - "Amanecer rosado sobre Cerro Catedral nevado por la ventana del refugio"
    - "Radio AM lejana pasando folclore (Yupanqui o similar)"
  texto_intent: |
    "Y si hubieras pasado la noche con TADEO...
    habrían visto el amanecer en el refugio.
    Mate amargo. Manta de lana sobre las piernas.
    El labrador del puesto echado sobre tus botas.
    La radio AM pasando un partido viejo.
    Una noche en paz."
  cta_engagement: "¿SOBREVIVISTE? 💬 COMENTA A o B"  # regla V7 obligatoria

# Slot H — Ambient creature (PAUTA § 14 — opcional)
slot_H_ambient_creatures:
  setting_aplicable: "Montaña invernal nocturna patagónica"
  criatura_seleccionada: |
    Silueta cuadrúpeda larga (no-puma, no-guanaco — más largo de lo natural,
    proporciones uncanny) cruza lentamente la nieve a 30m abajo de la cabina,
    visible a través del ventanuco lateral.
  timing_intent: |
    Aparece durante H2 (setup, 9-22s) por ~4 segundos en plano POV
    lateral mirando hacia el ventanuco. Mientras la NARRACIÓN PRINCIPAL
    continúa con las 3 reglas de TADEO, la silueta cruza en background.
    Específicamente: cuando TADEO susurra "no mires hacia abajo", el plano
    POV ESTÁ mirando hacia abajo de reojo y la silueta atraviesa la nieve
    en ese momento. El viewer la registra inconscientemente sin que la
    narración la mencione.
  duration_on_screen: 4s  # NO 0.4s (corrección user) — visible mientras narración corre
  proposito: |
    1. Carga atmosférica patagónica (folklore de "algo cruza la nieve")
    2. Setup element del "algo golpea cabina" de H5 — semilla narrativa
    3. Refuerza regla "no mires hacia abajo" mostrando POR QUÉ
  audio_companion: "aullido sub-bass lejano, volume 0.18, 3s duration sync con la silueta cruzando"

# ============================================================
# PATTERN — P3 (PAUTA § 15)
# ============================================================
plot_pattern:
  matriz_pattern_id: 3  # "Seguro era trampa" — bueno aparente era el peligro real (ref-08 Pablo traidor)
  matriz_appearance: "asimétrico (1 uncanny extreme + 1 cute amable)"
  matriz_truth: "el cute amable es el peligro real, el uncanny extreme es el guardián"
  has_twist: true  # P3 sí requiere twist (revelación retroactiva)
  rotation_check: "video-log consultado: últimos = P6(3x) + P4(2x) + P10(1x). P3 NO usado nunca por nosotros. FRESCO."
  referencia_canónica: "ref-08 Pablo/Hugo estructura (cute traidor / uncanny extreme guardián)"

# ============================================================
# H0 OPCIONAL — Personal stakes
# ============================================================
slot_H0_personal_stakes:
  habilitado: false
  razon: "P3 motor narrativo = ruptura de prejuicio visual del viewer. H0 personal stakes distraería del setup necesario para procesar EMI/TADEO contrastes en primeros 9s."

# ============================================================
# PLOT TWIST COHERENCE (PATTERNS § 6.5 — 3 condiciones obligatorias)
# ============================================================
plot_twist:
  twist_location: "H5 consecuencia B (78-82s)"
  twist_frase_unica: |
    "EMI no era un chico. Era una entidad que esperaba que rompieras
    una de las 3 reglas para arrastrarte por el ventanuco con sus
    brazos largos. TADEO era el guardián de la cabina."
  condicion_1_logica_clara: |
    El viewer puede explicar el twist en 1 frase post-video:
    "El cute era trampa, el uncanny era refugio."
  condicion_2_imagenes_acompañan:
    setup_elements:
      - id: dedos_emi_más_largos
        location: "D3 setup (post-58s)"
        descripcion: "close-up de los dedos de EMI tocando el pestillo — visiblemente MÁS LARGOS que al inicio"
        data_duration_required: 3.0s  # setup element (PATTERNS § 6.5 Regla 2)
        caption_companion: "Algo en sus manos cambió."
    payoff_elements:
      - id: mandíbula_cae
        location: "D3 consecuencia B (78-80s)"
        descripcion: "mandíbula de EMI cayendo al piso metálico, ojos negros, brazos saliendo por ventanuco"
        data_duration_required: 3.0s
        caption_companion: "NO ERA UN CHICO"  # keyword highlight rojo
  condicion_3_narracion_explica_link: |
    NARRADOR omnisciente, sobre plano close-up rostro TADEO bloqueando ventanuco:
    "Lo que tenía que parecer un chico, no era un chico.
    Lo que tenía que parecer un guardia, te estaba protegiendo."

# ============================================================
# ESTRUCTURA TEMPORAL (V15)
# ============================================================
estructura_temporal:
  H1_intro_materialization_0_9: 9s     # teaser → materialization EMI/TADEO + countdown
  H2_setup_reglas_9_22: 13s            # radio crepita + 3 reglas TADEO + silueta cruza nieve (Slot H)
  H3_dilema1_hablar_22_40: 18s         # D1 setup + countdown + loading + consecuencias A/B
  H4_dilema2_cinturon_40_58: 18s       # D2 setup + countdown + loading + consecuencias A/B
  H5_dilema3_ventanuco_revelacion_58_82: 24s  # D3 setup (con dedos más largos) + decision + revelación EMI
  H6_cliffhanger_TADEO_outro_82_95: 13s  # warm transition + counterfactual + CTA narrado
  total: 95s

# ============================================================
# NARRATION SCRIPT
# ============================================================
narration_script:
  meta:
    target_total_duration: 95s
    target_pace_wpm: 90  # ingeniero validará contra INGENIERO-PAUTA-MASTER referent measurements (2.43-2.75 w/s en canónicos)
    register: tu_implicito_presente_indicativo
    speakers:
      - narrator      # voz susurro grave omnisciente
      - emi           # adolescente alegre casual (voice ID joven argentino)
      - tadeo         # anciano patagónico voz baja procedural (voice ID grave senior)

  segments:
    # H1 — INTRO (0-9s)
    - id: hook_intro
      order: 1
      speaker: narrator
      lip_sync_required: false  # voiceover only — no character habla on-screen
      text: "Cabina catorce. Treinta metros sobre la nieve."
      target_duration: 3.5s
      pause_after_strict_seconds: 0.3

    - id: presentacion_dyad
      order: 2
      speaker: narrator
      lip_sync_required: false  # voiceover only — no character habla on-screen
      text: "Elige a tu compañero. EMI… o TADEO."
      target_duration: 3.5s
      pause_after_strict_seconds: 2.0  # countdown 3-2-1 corre acá

    # H2 — SETUP + 3 reglas + silueta cruza (9-22s)
    - id: setup_radio
      order: 3
      speaker: narrator
      lip_sync_required: false  # voiceover only — no character habla on-screen
      text: "La radio crepita."
      target_duration: 1.5s
      pause_after_strict_seconds: 0.3

    - id: anuncio_radio
      order: 4
      speaker: narrator
      lip_sync_required: false  # voiceover only — no character habla on-screen  # voz amortiguada radio efecto
      text: "Falla mecánica en cabina catorce. Reparación: seis horas. No abandonen la cabina."
      target_duration: 5s
      audio_treatment: "radio_walkie_filter + crackle"
      pause_after_strict_seconds: 0.3

    - id: tadeo_introduccion
      order: 5
      speaker: narrator
      lip_sync_required: false  # voiceover only — no character habla on-screen
      text: "Tadeo te mira sin parpadear. Susurra tres reglas."
      target_duration: 3s
      pause_after_strict_seconds: 0.4

    - id: tadeo_regla_1
      order: 6
      speaker: tadeo
      lip_sync_required: true  # TADEO habla on-screen — close-up boca visible  # voz baja susurro patagónico
      lip_sync_required: true  # TADEO susurra on-screen — close-up boca visible
      text: "No le contestes."
      target_duration: 1.2s
      pause_after_strict_seconds: 0.4
      visual_intent: "close-up boca de TADEO, dedos largos sobre rodilla"

    - id: tadeo_regla_2
      order: 7
      speaker: tadeo
      lip_sync_required: true  # TADEO habla on-screen — close-up boca visible
      text: "No abras el ventanuco."
      target_duration: 1.5s
      pause_after_strict_seconds: 0.5  # silueta cruza nieve EN ESTE GAP (Slot H)
      visual_intent: "plano POV mirando ventanuco lateral — silueta cuadrúpeda larga cruza nieve 30m abajo (4s)"

    - id: tadeo_regla_3
      order: 8
      speaker: tadeo
      lip_sync_required: true  # TADEO habla on-screen — close-up boca visible
      text: "No mires hacia abajo."
      target_duration: 1.5s
      pause_after_strict_seconds: 0.4
      visual_intent: "plano POV ventanuco aún visible silueta + corte a TADEO"

    - id: emi_sonrie
      order: 9
      speaker: narrator
      lip_sync_required: false  # voiceover only — no character habla on-screen
      text: "Emi sonríe. Demasiado."
      target_duration: 2s
      pause_after_strict_seconds: 0.5

    # H3 — D1 hablar (22-40s)
    - id: d1_setup_emi_ofrece
      order: 10
      speaker: emi
      lip_sync_required: true  # EMI habla on-screen — boca visible al viewer  # voz casual argentina joven
      lip_sync_required: true  # EMI habla on-screen — boca visible al viewer (POV)
      text: "Loco qué chamuyo este telesilla, bro. ¿Sabés algún chiste para pasar el rato?"
      target_duration: 4s
      pause_after_strict_seconds: 0.3

    - id: d1_setup_tension
      order: 11
      speaker: narrator
      lip_sync_required: false  # voiceover only — no character habla on-screen
      text: "Cuarenta minutos en silencio. La cabina se mece. Tu lengua se calienta sola."
      target_duration: 4s
      pause_after_strict_seconds: 0.4

    - id: d1_decide
      order: 12
      speaker: narrator
      lip_sync_required: false  # voiceover only — no character habla on-screen
      text: "Ahora decide. A. Contestar. B. Silencio."
      target_duration: 3s
      pause_after_strict_seconds: 2.5  # loading bar 2.5s

    - id: d1_consequence_A
      order: 13
      speaker: narrator
      lip_sync_required: false  # voiceover only — no character habla on-screen
      text: "Tu voz sale sin sonido. El aire de la cabina se va con tus pulmones."
      target_duration: 4s
      pause_after_strict_seconds: 0.3
      branch: A
      visual_intent: "body horror: viewer asfixiándose, EMI sonríe quieto"

    - id: d1_bridge_to_B
      order: 14
      speaker: narrator
      lip_sync_required: false  # voiceover only — no character habla on-screen
      text: "Si elegiste silencio."  # caption tenue azul "SI ELEGISTE SILENCIO:"
      target_duration: 1.2s
      pause_after_strict_seconds: 0.2
      bridge_separator: true  # white flash 0.15s antes

    - id: d1_consequence_B
      order: 15
      speaker: narrator
      lip_sync_required: false  # voiceover only — no character habla on-screen
      text: "Tadeo asiente despacio. Emi cierra la boca lentamente."
      target_duration: 3s
      pause_after_strict_seconds: 0.4
      branch: B

    # H4 — D2 cinturón (40-58s)
    - id: d2_setup_emi_desabrocha
      order: 16
      speaker: narrator
      lip_sync_required: false  # voiceover only — no character habla on-screen
      text: "Una hora después. Emi se desabrocha el cinturón."
      target_duration: 3s
      pause_after_strict_seconds: 0.3

    - id: d2_emi_speaks
      order: 17
      speaker: emi
      lip_sync_required: true  # EMI habla on-screen — boca visible al viewer
      text: "Me acalambro, bro."
      target_duration: 1.5s
      pause_after_strict_seconds: 0.3

    - id: d2_setup_proximity
      order: 18
      speaker: narrator
      lip_sync_required: false  # voiceover only — no character habla on-screen
      text: "Se estira. Sus rodillas tocan las tuyas. Tadeo tensa los dedos."
      target_duration: 4s
      pause_after_strict_seconds: 0.4

    - id: d2_decide
      order: 19
      speaker: narrator
      lip_sync_required: false  # voiceover only — no character habla on-screen
      text: "Ahora decide. A. Desabrocharte. B. No moverte."
      target_duration: 3s
      pause_after_strict_seconds: 2.5  # loading 2.5s

    - id: d2_consequence_A
      order: 20
      speaker: narrator
      lip_sync_required: false  # voiceover only — no character habla on-screen
      text: "Una ráfaga sacude la cabina. Sin cinturón, salís disparado al vacío."
      target_duration: 4s
      pause_after_strict_seconds: 0.3
      branch: A
      visual_intent: "body horror: cuerpo lanzado lateral, caída 30m sobre rocas"

    - id: d2_bridge_to_B
      order: 21
      speaker: narrator
      lip_sync_required: false  # voiceover only — no character habla on-screen
      text: "Si no te moviste."
      target_duration: 1.2s
      pause_after_strict_seconds: 0.2
      bridge_separator: true

    - id: d2_consequence_B
      order: 22
      speaker: narrator
      lip_sync_required: false  # voiceover only — no character habla on-screen
      text: "Tadeo cruza el brazo sobre tu pecho. Emi vuelve a abrocharse. Te mira fijo."
      target_duration: 4s
      pause_after_strict_seconds: 0.4
      branch: B

    # H5 — D3 ventanuco + revelación EMI (58-82s)
    - id: d3_setup_golpes
      order: 23
      speaker: narrator
      lip_sync_required: false  # voiceover only — no character habla on-screen
      text: "Tres de la madrugada. Algo golpea la base de la cabina. Una. Dos. Tres veces."
      target_duration: 5s
      pause_after_strict_seconds: 0.4
      visual_intent: "POV mirando piso de la cabina, sub-bass golpes"

    - id: d3_emi_invita
      order: 24
      speaker: emi
      lip_sync_required: true  # EMI habla on-screen — boca visible al viewer
      text: "Ufa loco, mirá qué es."
      target_duration: 2s
      pause_after_strict_seconds: 0.3
      visual_intent: "close-up dedos EMI sobre pestillo — VISIBLY MÁS LARGOS que al inicio (3s data-duration, setup element)"

    - id: d3_decide
      order: 25
      speaker: narrator
      lip_sync_required: false  # voiceover only — no character habla on-screen
      text: "Ahora decide. A. Abrir el ventanuco. B. No abrir."
      target_duration: 3s
      pause_after_strict_seconds: 2.5  # loading 2.5s

    - id: d3_consequence_A
      order: 26
      speaker: narrator
      lip_sync_required: false  # voiceover only — no character habla on-screen
      text: "Un brazo entra por la apertura. Te arrastra al vacío. Te congelás antes de caer."
      target_duration: 5s
      pause_after_strict_seconds: 0.3
      branch: A
      visual_intent: "body horror: brazo largo agarra viewer, suspendido en aire congelándose"

    - id: d3_bridge_to_B
      order: 27
      speaker: narrator
      lip_sync_required: false  # voiceover only — no character habla on-screen
      text: "Si no abriste."
      target_duration: 1.2s
      pause_after_strict_seconds: 0.2
      bridge_separator: true

    - id: d3_revelacion_emi
      order: 28
      speaker: narrator
      lip_sync_required: false  # voiceover only — no character habla on-screen
      text: "Tadeo te cubre con sus brazos. El ventanuco se rompe igual. Emi se ríe — pero la risa no sale por la boca."
      target_duration: 6s
      pause_after_strict_seconds: 0.3
      branch: B
      visual_intent: "mandíbula EMI cae al piso, ojos negros, brazos duplican largo saliendo por ventanuco roto (payoff element, 3s data-duration)"
      keyword_highlight: "NO ERA UN CHICO"  # caption rojo

    - id: d3_narrador_cierra_twist
      order: 29
      speaker: narrator
      lip_sync_required: false  # voiceover only — no character habla on-screen
      text: "Lo que tenía que parecer un chico, no era un chico. Lo que tenía que parecer un guardia, te estaba protegiendo."
      target_duration: 6s
      pause_after_strict_seconds: 0.5
      visual_intent: "close-up rostro TADEO mirándote en silencio post-evento"

    # H6 — Cliffhanger TADEO outro (82-95s)
    - id: h6_bridge_warm
      order: 30
      speaker: narrator
      lip_sync_required: false  # voiceover only — no character habla on-screen
      text: "Y si hubieras pasado la noche con Tadeo…"  # caption amarillo cálido
      target_duration: 2.5s
      pause_after_strict_seconds: 0.3
      bridge_separator: warm_white  # warm white transition 0.4s

    - id: h6_cliffhanger
      order: 31
      speaker: narrator
      lip_sync_required: false  # voiceover only — no character habla on-screen
      text: "habrían visto el amanecer en el refugio. Mate amargo. Manta de lana sobre las piernas. El labrador del puesto echado sobre tus botas. La radio AM pasando un partido viejo. Una noche en paz."
      target_duration: 8s
      pause_after_strict_seconds: 0.3
      visual_intent: |
        Cliffhanger 6:15 AM. Refugio gaucho patagónico interior. TADEO
        sentado en sillón viejo cebra. Mate humeante en mano correosa.
        Manta de lana cruda sobre piernas del viewer (POV). Labrador
        echado sobre las botas. Ventana al fondo con primer sol rosado
        sobre Cerro Catedral nevado. Radio AM lejana folclore.

    - id: cta_engagement
      order: 32
      speaker: narrator
      lip_sync_required: false  # voiceover only — no character habla on-screen
      text: "¿Sobreviviste? Comenta A o B."  # caption última, 60px uppercase
      target_duration: 2.5s
      pause_after_strict_seconds: 0

