    compose_strategy: "loop_15s_stretched"
    target_lufs_pre_mix: -30

  - layer_id: "ambient_wind_exterior_low"
    scope: "cross_clip_continuous"
    sections: [{from: 0, to: 50, intent: "exterior storm wind muffled through chapa walls"}]
    eleven_labs_prompt: "blizzard wind muffled through metal walls, distant howl, snow whisper texture, no music"
    compose_strategy: "single_50s_layered"
    target_lufs_pre_mix: -32

  - layer_id: "ambient_wind_exterior_blizzard_HIGH"
    scope: "cross_clip_continuous"
    sections: [{from: 40, to: 65, intent: "exterior storm full force — path A horror climax"}]
    eleven_labs_prompt: "full blizzard wind, howling fury, ice particles, debris hitting metal, intense horror atmosphere"
    compose_strategy: "single_25s"
    target_lufs_pre_mix: -25

  - layer_id: "accent_climax_horror"
    scope: "clip_scoped_or_effect"
    sections: [{from: 52, to: 60, intent: "rising tension climax — Iván push to precipicio"}]
    eleven_labs_prompt: "dark cinematic strings rising, climax-buildup, sub-bass drop, no drums, horror climax"
    compose_strategy: "single_8s"
    target_lufs_pre_mix: -23

  - layer_id: "music_drone_base_warm_transition"
