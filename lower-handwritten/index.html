<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

#lower-handwritten {
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  background: #060606;
  position: relative;
}

.scanlines {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent 0px, transparent 3px,
    rgba(0,0,0,0.28) 3px, rgba(0,0,0,0.28) 4px
  );
  pointer-events: none;
  z-index: 900;
}

.vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 100%, transparent 0%, rgba(0,0,0,0.9) 100%);
  pointer-events: none;
  z-index: 890;
}

.lower-content {
  position: absolute;
  bottom: 210px;
  left: 80px;
  right: 80px;
}

.rule {
  width: 0%;
  height: 1px;
  background: rgba(230,230,230,0.38);
  margin-bottom: 22px;
}

.main-text {
  font-family: 'Caveat', cursive;
  font-size: 108px;
  line-height: 1.05;
  color: #f0f0f0;
  text-shadow: 0 0 22px rgba(255,255,255,0.2);
  letter-spacing: 3px;
  clip-path: inset(0 100% 0 0);
}

.sub-text {
  font-family: 'Caveat', cursive;
  font-size: 40px;
  letter-spacing: 6px;
  color: rgba(175,175,175,0.62);
  opacity: 0;
  margin-top: 12px;
}

.flash {
  position: absolute;
  inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
  z-index: 850;
}
</style>
</head>
<body>
<div id="lower-handwritten" data-composition-id="lower-handwritten" data-width="1080" data-height="1920" data-start="0">
  <div class="vignette"></div>
  <div class="lower-content" id="lower-content">
    <div class="rule" id="rule"></div>
    <div class="main-text" id="main-text">The Witness</div>
    <div class="sub-text" id="sub-text">Disappeared · 1987</div>
  </div>
  <div class="flash" id="flash"></div>
  <div class="scanlines"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });

// Rule draws in smoothly — like a pen stroke
tl.to("#rule", { width: "100%", duration: 0.62, ease: "power2.inOut" }, 0.12);

// Main text reveals left to right — smooth handwriting feel
tl.to("#main-text", { clipPath: "inset(0 0% 0 0)", duration: 0.72, ease: "power2.out" }, 0.25);

// Subtitle fades in with gentle rise
tl.fromTo("#sub-text",
  { y: 12, opacity: 0 },
  { y: 0, opacity: 1, duration: 0.48, ease: "power2.out" },
  0.85
);

// Organic float — gentle y breathing
tl.to("#main-text", { y: -5, duration: 1.05, ease: "sine.inOut" }, 1.3);
tl.to("#main-text", { y: 0, duration: 1.05, ease: "sine.inOut" }, 2.35);

// Soft CRT flicker
tl.to("#lower-handwritten", { opacity: 0.86, duration: 0.04, ease: "none" }, 2.0);
tl.to("#lower-handwritten", { opacity: 1, duration: 0.05, ease: "none", overwrite: "auto" }, 2.04);

// Exit — drifts upward and fades
tl.to(["#rule", "#main-text", "#sub-text"], { y: -16, opacity: 0, duration: 0.44, ease: "power2.in" }, 3.42);

window.__timelines["lower-handwritten"] = tl;
</script>
</body>
</html>
