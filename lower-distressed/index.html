<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

#lower-distressed {
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  background: #060606;
  position: relative;
}

.scanlines {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent 0px, transparent 3px,
    rgba(0,0,0,0.32) 3px, rgba(0,0,0,0.32) 4px
  );
  pointer-events: none;
  z-index: 900;
}

.vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 100%, transparent 0%, rgba(0,0,0,0.92) 100%);
  pointer-events: none;
  z-index: 890;
}

.lower-content {
  position: absolute;
  bottom: 210px;
  left: 80px;
  right: 80px;
}

.rule {
  width: 100%;
  height: 2px;
  background: rgba(240,240,240,0.38);
  margin-bottom: 20px;
  transform-origin: left center;
  transform: scaleX(0);
}

.main-text {
  font-family: 'IM Fell English', serif;
  font-style: italic;
  font-size: 92px;
  line-height: 1.08;
  color: #ebebeb;
  text-shadow: 0 0 24px rgba(255,255,255,0.18), 1px 1px 0 rgba(0,0,0,0.9);
  opacity: 0;
  letter-spacing: 2px;
}

.sub-text {
  font-family: 'IM Fell English', serif;
  font-size: 30px;
  letter-spacing: 9px;
  color: rgba(170,170,170,0.62);
  text-transform: uppercase;
  opacity: 0;
  margin-top: 14px;
}

/* Horizontal static flicker bar */
.static-bar {
  position: absolute;
  left: 0; right: 0;
  height: 5px;
  background: rgba(255,255,255,0.06);
  opacity: 0;
  pointer-events: none;
  z-index: 800;
}
#sb1 { bottom: 380px; }
#sb2 { bottom: 680px; }

.flash {
  position: absolute;
  inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
  z-index: 850;
}
</style>
</head>
<body>
<div id="lower-distressed" data-composition-id="lower-distressed" data-width="1080" data-height="1920" data-start="0">
  <div class="vignette"></div>
  <div class="static-bar" id="sb1"></div>
  <div class="static-bar" id="sb2"></div>
  <div class="lower-content" id="lower-content">
    <div class="rule" id="rule"></div>
    <div class="main-text" id="main-text">The Witness</div>
    <div class="sub-text" id="sub-text">Disappeared · 1987</div>
  </div>
  <div class="flash" id="flash"></div>
  <div class="scanlines"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });

// Rule slams in
tl.to("#rule", { scaleX: 1, duration: 0.32, ease: "power3.out" }, 0.1);

// Static bar flickers
tl.to("#sb1", { opacity: 1, duration: 0.05, ease: "none" }, 0.2);
tl.to("#sb1", { opacity: 0, duration: 0.06, ease: "none" }, 0.25);

// Main text flickers into existence — deterministic jitter
tl.to("#main-text", { opacity: 0.65, x: -2, duration: 0.06, ease: "none" }, 0.28);
tl.to("#main-text", { opacity: 0.15, x: 3, duration: 0.04, ease: "none" }, 0.34);
tl.to("#main-text", { opacity: 0.82, x: -1, duration: 0.07, ease: "none" }, 0.38);
tl.to("#main-text", { opacity: 0.4, x: 2, duration: 0.04, ease: "none" }, 0.45);
tl.to("#main-text", { opacity: 1, x: 0, duration: 0.1, ease: "power2.out" }, 0.49);

// Subtitle flickers in
tl.to("#sub-text", { opacity: 0.72, duration: 0.05, ease: "none" }, 0.88);
tl.to("#sub-text", { opacity: 0.28, duration: 0.04, ease: "none" }, 0.93);
tl.to("#sub-text", { opacity: 1, duration: 0.08, ease: "power2.out", overwrite: "auto" }, 0.97);

// Static bar during hold
tl.to("#sb2", { opacity: 0.8, duration: 0.04, ease: "none" }, 1.62);
tl.to("#sb2", { opacity: 0, duration: 0.06, ease: "none", overwrite: "auto" }, 1.66);

// Intermittent flicker during hold
tl.to("#main-text", { opacity: 0.7, x: 1, duration: 0.04, ease: "none" }, 1.84);
tl.to("#main-text", { opacity: 1, x: 0, duration: 0.05, ease: "none", overwrite: "auto" }, 1.88);
tl.to("#main-text", { opacity: 0.82, x: -1, duration: 0.03, ease: "none" }, 2.68);
tl.to("#main-text", { opacity: 1, x: 0, duration: 0.05, ease: "none", overwrite: "auto" }, 2.71);

// CRT global flicker
tl.to("#lower-distressed", { opacity: 0.85, duration: 0.04, ease: "none" }, 2.2);
tl.to("#lower-distressed", { opacity: 1, duration: 0.05, ease: "none", overwrite: "auto" }, 2.24);

// Exit — all fade with slight upward drift
tl.to(["#rule", "#main-text", "#sub-text"], { opacity: 0, y: -18, duration: 0.4, ease: "power2.in" }, 3.42);

window.__timelines["lower-distressed"] = tl;
</script>
</body>
</html>
