# ═══════════════════════════════════════════════════════════════
# 7. MUSIC LAYERS (3 mandatory — PAUTA § 25)
# ═══════════════════════════════════════════════════════════════

music_continuous_layers:
  - layer_id: "drone_base"                             # LAYER 1 drone (continuous 80-100%)
    scope: "cross_clip_continuous"
    sections: [{from: 0, to: 90, intent: "drone subharmónico de tensión deportiva sostenida bajo el rugido del estadio"}]
    eleven_labs_prompt: "low subharmonic drone, sustained deep bass tension, no melody, dark cinematic sports-thriller bed, faint orchestral swell undertone"
    compose_strategy: "single_continuous_90s"
    target_lufs_pre_mix: -27
    sidechain_duck_target: true
  - layer_id: "ambient_celebration_warm"               # LAYER 2 ambient cozy (counterfactual/resolution/outro)
    scope: "cross_clip_continuous"
    sections: [{from: 9, to: 18, intent: "celebración gloriosa cálida (rama corta PSG gol)"}, {from: 76, to: 90, intent: "vuelta olímpica + outro copa Arsenal"}]
    eleven_labs_prompt: "triumphant stadium celebration ambience, distant euphoric crowd cheering warm, confetti rustle, victory tone, uplifting, no horror"
    compose_strategy: "single_8s_reusable"
    target_lufs_pre_mix: -26
  - layer_id: "accent_climax"                           # LAYER 3 accent (event-driven D3 clímax)
    scope: "clip_scoped_or_effect"
    sections: [{from: 58, to: 70, intent: "tensión rising en decisión 3 (mano a mano) + remate clímax"}]
    eleven_labs_prompt: "rising dark cinematic strings tension, pounding low pulse building, climax buildup, no resolution"
    compose_strategy: "single_12s"
    target_lufs_pre_mix: -25
  - layer_id: "outro_drone"
    scope: "cross_clip_continuous"
    sections: [{from: 82, to: 90, intent: "cliffhanger sostenido final sobre la celebración"}]
    eleven_labs_prompt: "sustained low hum gradual fade blended with faint triumphant swell, cliffhanger atmospheric, loop cue"
    compose_strategy: "single_8s_fade_in"
    target_lufs_pre_mix: -27

cross_clip_continuous_audio_layers:
  layer_3_continuous:
    - "drone_base"
    - "ambient_stadium_crowd_continuous"
    - "ambient_celebration_warm"
    - "outro_drone"
    - "narrator_master_continuous"
  layer_1_clip_scoped:
    - "saka_dialog_within_clip"
    - "dembele_dialog_within_clip"
