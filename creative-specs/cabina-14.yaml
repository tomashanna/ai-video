  slot_A_iluminacion_dramatica: true

  # Personajes
  slot_B_definido: true  # TADEO uncanny extreme
  slot_B_scroll_stop: true
  slot_B_no_halloween_costume: true
  slot_C_definido: true  # EMI cute fucsia
  slot_C_contraste_visual_con_B: true  # cute/fucsia/joven/horizontal vs uncanny/lana/anciano/vertical
  slot_C_name_labels_obligatorio: true
  slot_C_outcome_segun_pattern: P3_VILLAIN  # P3 inverso: EMI cute = villain, no termina cozy

  # Slot D
  slot_D_regla_count_palabras: 3_reglas_cortas  # 3 reglas de 3-4 palabras c/u
  slot_D_conecta_con_dilemas: true  # cada dilema testea una regla
  slot_D_inversion_framing_P3: true  # reglas vienen de TADEO (bueno real) — documentado

  # Dilemas
  slot_E_count_dilemas: 3  # PAUTA empírica 3-4 (default 3)
  slot_E_categorias_diferentes: true  # acción/pasividad → sumisión/resistencia → curiosidad/obediencia
  slot_E_cada_genera_duda_real: true  # tentaciones genuinamente deseables (charlar, estirar, mirar)
  slot_E_estructura_setup_pregunta_countdown_loading: true

  # Body horror
  slot_F_especifico_al_setting: true  # caída sobre rocas + congelamiento + succión por ventanuco
  slot_F_visualizable_IA: true
  slot_F_sensorial: true  # peso pulmones, frío, viento succión
  slot_F_no_generico_mueres: true

  # Cliffhanger
  slot_G_paz_perdida: true  # 7/8 empírico — default
  slot_G_elementos_sensoriales_validados: true  # mate, perro, amanecer, lana, radio AM
  slot_G_warm_palette: true  # ámbar dorado outro
  slot_G_CTA_engagement_60px: true  # regla V7

  # Ambient (Slot H)
  slot_H_ambient_creature_incluida: true
  slot_H_subtle_not_overt: true
  slot_H_conecta_narrativamente: true  # planta semilla de "algo golpea cabina" H5

  # Pattern
  pattern_rotado_video_log: true  # P3 nunca usado por nosotros, fresco
  pattern_setting_no_repetido: true  # telesilla nuevo, no en 8 canónicos ni en producciones nuestras

  # Plot twist coherencia (PATTERNS § 6.5)
  plot_twist_3_condiciones: true
  plot_twist_logica_clara_1_frase: true
  plot_twist_imagenes_acompañan: true  # dedos más largos setup + mandíbula cae payoff
  plot_twist_narracion_explica_link: true  # "no era un chico / te estaba protegiendo"
  plot_twist_setup_element_data_duration_3s: true  # dedos EMI 3s, no <1s

  # Lenguaje
  segunda_persona_implicita: true
  presente_indicativo_consecuencias: true
  oraciones_cortas_promedio: 5.4_palabras_estimado
  frases_nominales_climax: true  # "Tu lengua se calienta sola." "Una noche en paz."

  # Producción
  POV_80_percent_planos: true
  hard_cuts_white_flash_entre_decisiones: true
  countdown_3_2_1_loading_bar_cada_decision: true
  watermark_creator_persistente: true

  # Reglas territoriales
  no_engineer_territory_crossed: true  # arquitecto NO toca LUFS/CSS/ffmpeg/voice IDs específicos

  # Lista de invenciones prohibidas (auto-check)
  no_bajaria_estandar_invented: true  # uso "Elige a tu compañero" universal
  no_motor_duda_artificial_invented: true  # uso "decisiones ambiguas" de PAUTA § 6
