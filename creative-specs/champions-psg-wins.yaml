narrative_structure:
  model_constraints_acknowledged: true                  # HR#28/#29 — narración@165 ≤ min(dur, clip_max tier) por shot
  counterfactual_placement: "before_choice_resolves"   # CANONICAL preferred (ref-09 10/10, PAUTA § 24)
