# ═══════════════════════════════════════════════════════════════
# 9. NARRATION SCRIPT (DERIVADO — single source of truth = narration_in_this_shot por shot)
# ═══════════════════════════════════════════════════════════════
# ⛔ SINGLE SOURCE OF TRUTH = `narration_in_this_shot` por shot (shot_list §10).
#    §9 narration_script = CONCATENACIÓN derivada, palabra-por-palabra, de los narration_in_this_shot
#    en orden de shot — driver del ENSAMBLE del master continuo Layer 3. El caption-burn per-clip (HR#30)
#    y el master continuo Layer 3 derivan del MISMO texto per-shot → no desync (anti-pattern #16) +
#    cobertura temporal completa (HR#30). Narrador = Layer 3 continuous ÚNICAMENTE (HR#25); EXCLUIDO de Layer 1.
#
# Estilo calibrado a primary source ref-03/06/10: 2ª persona presente, staccato, framing acción-condicional,
# "Ahora decides" gatillo, body horror nominal en climax. Narración clara NO tenebrosa (PAUTA § narración clara).
# Español NEUTRAL: pisas/corres/esperas/eliges/decides — NUNCA voseo.
# Segmentos NARRATOR → ensamblan el master continuo Layer 3. Segmentos char_a (dialog Dario) →
#   son Layer 1 clip-scoped, NO parte del master continuo; su fuente canónica = dialog_text del shot.

# v11.2 A2/A3: re-chunkeado ≤13 palabras/segmento (≤4.73s @165WPM) para que cada shot quepa ≤5.0s SIN
#   truncar y SIN freeze-extend. Timeline reconciliada a banda 80-100s (NB-3): la narración termina ~78s;
#   con countdowns/loadings/beats no-narrados (hook 9s, freezes, reaction inserts, resolución visual) el
#   corte total cae ~88-92s. Engineer ajusta el corte final dentro de 80-100s. HISTORIA IDÉNTICA — solo re-chunk.
