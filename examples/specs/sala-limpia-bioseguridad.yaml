# ═══════════════════════════════════════════════════════════════
# 1.5 REFERENCES CANONICAL (≥5/8 — mandatory linkage)
# ═══════════════════════════════════════════════════════════════

references_canonical:
  - ref_id: "ref-10"                              # canonical-scenes/ref-10-rurik-enzo-fundicion.md
    informs:
      - "characters.char_a.visual_signature"
      - "narrative_structure.cliffhanger_archetype"
      - "shot_list.shot_06.narration_in_this_shot"   # dinámica de control procedural del malo enmascarado
      - "music_continuous_layers.drone_base"
    why_relevant: "Rurik (hazmat amarillo + máscara sin boca visible) es el referente más afín a Axel: malo P1 con dinámica de control PROCEDURAL ('Ponte el traje. Abre la válvula') y body horror específico al setting industrial (metal fundido, vapor a presión → quemadura). Calco la estructura de 2-3 órdenes escaladas que el viewer obedece o resiste, la solución de lip-sync para personaje sin boca (voz off, no boca animada), y el outro Paz-perdida laboral cozy (sala de control + café). Axel hereda: máscara/visor sin boca, dialogue mínimo críptico imperativo, body horror del setting (vapor esterilizante)."

  - ref_id: "ref-03"                              # canonical-scenes/ref-03-bruno-pablo-mina.md
    informs:
      - "narrative_structure.hook_sub_beats"
      - "shot_list.shot_07.narration_in_this_shot"   # D1 consequence acción-condicional 'Si lo levantas'
      - "editing_targets.pacing_modulation"
    why_relevant: "Dilema D1 (curiosidad/obediencia) calca a ref-03 'enciendes tu linterna o esperas' → 'Si la enciendes, Bruno te agarra del brazo'. El malo TIENTA al viewer a manipular un objeto peligroso (linterna ↔ vial fluorescente); obedecer mata. Calco el framing acción-condicional dominante ('Si la enciendes' → 'Si lo levantas') + el 'Ahora decides' como gatillo universal + el pacing del horror lento (Bruno arrastra al borde ↔ vial revienta por presión)."

  - ref_id: "ref-09"                              # canonical-scenes/ref-09-victor-axel-cockpit.md
    informs:
      - "narrative_structure.counterfactual_placement"
      - "narrative_structure.emotional_framing"
      - "shot_list.shot_02.narration_in_this_shot"   # counterfactual OPENING antes de que la rama resuelva
    why_relevant: "ref-09 obtuvo 10/10 en comprensión narrativa con counterfactual OPENING ('Si hubieras elegido Axel, habrían hablado toda la noche...') ANTES de que el path peligroso resuelva = sube stakes (PAUTA § 24, before_choice_resolves + stakes_lift). Calco esa colocación: el cozy de Hugo se enuncia temprano (shot_02) para crear contraste emocional antes de que el viewer entre al path de Axel. También calco la cadena de 3 decisiones escaladas con categorías distintas + cierre 'sigues con vida'."

  - ref_id: "ref-08"                              # canonical-scenes/ref-08-hugo-pablo-acuario.md
    informs:
      - "characters.char_b"
      - "narration_script.segment_id=narrator_cozy_counterfactual"
      - "shot_list.shot_09.has_lip_sync_required"     # bueno aparente PUEDE hablar
    why_relevant: "ref-08 refuta 'bueno aparente siempre calla': Hugo (bueno) HABLA en el hook. Licencia a Hugo (nuestro bueno) a tener 1 línea cálida on-screen (variabilidad, no obligación). Además el outro cozy de ref-08 es LABORAL ('limpiado los cristales, tomado café frente a las medusas') → calco un cozy laboral análogo al BSL-4: café de la sala de descanso + cartas mientras esperan el relevo del amanecer por la esclusa. Hugo también valida 'bueno visualmente extreme' (PAUTA § 5): nuestro Hugo es filiforme translúcido luminiscente, NO tame."

  - ref_id: "ref-06"                              # canonical-scenes/ref-06-enzo-axel-carretera.md
    informs:
      - "shot_list.shot_18.narration_in_this_shot"    # D3 clímax acción/confianza
      - "narrative_structure.canonical_constraints.si_elegiste_framing_required"
    why_relevant: "ref-06 es P1 puro (Axel sigue peligroso, solo se va — no twist, no redención): calco el cierre del path B donde el peligro NO te persigue activamente, te ofrece chances que rechazas y al resistir sobrevives 'con vida'. Body horror específico (claxon → rompe ventana, arrastra). Mi D3 (ducha de descontaminación: 'métete y respira hondo') calca la dinámica de obediencia fatal del clímax + el framing acción-condicional 'Si tocas el claxon' → 'Si entras y respiras'."

  # Refs NOT usados (declaro razón — recomendado):
  # - ref-11 (@referent-c atypical, NO referent-a canon — excluido per INDEX outliers flag)
  # - ref-12 (outro emocional 43s + apuñalamiento, tono melodramático ajeno a P1 clínico)
  # - ref-13 (P6 hedonismo + cabeza sin boca cubierta indirectamente por solución ref-10 máscara)

# ═══════════════════════════════════════════════════════════════
# 2. ASSEMBLY STRATEGY
# ═══════════════════════════════════════════════════════════════

assembly_strategy: "per_clip_atomic_hybrid"     # Hard Rule #25 — V4+ canonical

# ═══════════════════════════════════════════════════════════════
# 3. HYBRID LAYERS DECLARATION (Hard Rule #25)
# ═══════════════════════════════════════════════════════════════

hybrid_layers:
  layer_1_per_clip_atomic:
    description: "Per-shot mp4 con visual + audio clip-scoped + captions BURNED en frame data"
    captions_source: "whisper_from_clip_audio"
    captions_burn_script: "scripts/build_clip_atomic.py --bake-captions"
    audio_bundled_per_clip:
      - "narrator_segments_within_this_clip"
      - "character_dialog_within_this_clip"        # Axel (voz off filtrada — sin boca) + Hugo (lip-sync)
      - "diegetic_sfx_within_this_clip"
      - "clip_scoped_ambient_short"
    output_path_convention: "<project>/assets/clips-atomic/shot_NN_<descriptor>_atomic.mp4"
    manifest_path_convention: "<project>/assets/clips-atomic/shot_NN_<descriptor>_manifest.yaml"

  layer_2_effects_between_clips:
    description: "Transiciones + stings en boundaries (hard-cut+whoosh, white-flash en body horror, UV-strobe-glitch en decisión)"
    effects_library_ref: ".claude/skills/ai-video-production/templates/effects-library/transitions/"
    transition_variety_min: 3
    non_diegetic_sfx_placement: "effect_layer"

  layer_3_cross_clip_continuous:
    description: "Audio que NO corta en boundaries — overlaid post-concat con sidechain duck"
    layers:
      - "narrator_master_continuous"
      - "music_drone_base"
      - "ambient_continuous_environment"
    sidechain_target_db: -6
    overlay_pipeline: "scripts/build-video-hybrid.py --post-concat-overlay"

  layer_4_hyperframes_ui_overlay:
    description: "Countdown film-leader + decision UI (loading Y52 / countdown Y46) + outro card"
    elements:
      - "countdown_3_2_1_hook"
      - "decision_freeze_d1"
      - "decision_freeze_d2"
      - "decision_freeze_d3"
      - "outro_card_cliffhanger"
      - "watermark_handle_persistent"

# ═══════════════════════════════════════════════════════════════
# 4. CHARACTERS (real invented names + name_validation gate)
# ═══════════════════════════════════════════════════════════════

characters:
  - character_id: "char_a"
    name: "Axel"
    name_validation:
      is_real_invented_name: true
      blacklist_check_passed: true                 # NO job description (no "Matarife/Cocinera/Técnico")
      canonical_8_refs_pattern: "real_first_name"   # Axel = nombre canónico recurrente (ref-06/ref-09)
    role: "malo_aparente"
    archetype: "P1 — Verdad visible (el peligroso obvio ES peligroso; obedecerlo mata)"
    visual_signature: |
      Figura humanoide voluminosa, OPACA, dentro de un traje de presión positiva
      blanco-marfil sellado, costuras gruesas selladas con cinta gris, guantes
      integrados de neopreno blanco. La firma vive en el VISOR: un domo de cristal
      esférico transparente que reemplaza toda la cabeza — NO hay cara, boca ni ojos
      detrás, solo penumbra y reflejos UV violeta. En el frente del domo, TRES
      respiradores circulares negros dispuestos en triángulo (válvulas tipo filtro
      HEPA) que se INFLAN y DESINFLAN a destiempo entre sí, como si respirara mal.
      Postura técnica autoritaria, gestos lentos y deliberados, siempre señalando o
      deslizando objetos hacia el viewer. Tubo corrugado de aire conectado a la
      espalda. Contraste vs Hugo: volumen-opaco-respiradores vs filiforme-translúcido-luminoso.
    voice_id_canonical: null                       # Axel NO tiene voz propia separada; sus 2-3 líneas
                                                   #   crípticas van en voz off filtrada (intercom/respirador)
                                                   #   per solución ref-10 Rurik enmascarado. Engineer detalle: INGENIERO-PAUTA lip-sync rule.
    anchor_image_id: "char_a_v1"
    locus_anchor_required: false                   # MODEL-BEHAVIOR-LOG Entry 1: la firma vive en el visor
                                                   #   (objeto/traje), NO en anatomía rara aislable → bajo riesgo, sin locus anchor.

  - character_id: "char_b"
    name: "Hugo"
    name_validation:
      is_real_invented_name: true
      blacklist_check_passed: true
      canonical_8_refs_pattern: "real_first_name"   # Hugo = nombre canónico (ref-08 bueno aparente)
    role: "bueno_aparente"
    archetype: "P1 dyad partner — bueno visualmente extreme (PAUTA § 5), contraste tonal/comportamental"
    visual_signature: |
      Humanoide altísimo y filiforme (≈2.1m), calvo, cráneo alargado liso. PIEL
      TRANSLÚCIDA azulada con venas luminiscentes cian que brillan bajo la luz UV
      violeta del laboratorio — se ve la red de venas glowing bajo la superficie.
      Ojos grandes serenos, oscuros, sin amenaza. Viste una bata corta de laboratorio
      color hueso, brazos largos delgados. Postura NO amenazante: sentado en un
      taburete, anotando en una libreta, ofreciendo una taza térmica humeante.
      Movimientos suaves y pausados. Contraste vs Axel: delgadez-translucidez-luz propia
      vs volumen-opacidad-respiradores. NO es tame: es visualmente extreme, pero su
      comportamiento (calma, anota, ofrece) lo lee como "bueno".
    voice_id_canonical: "K3TeN3ZVK8WnOeJ0NYqZ"     # Hugo PUEDE hablar (variabilidad ref-08). 1 línea cálida.
    anchor_image_id: "char_b_v1"
    locus_anchor_required: false                   # piel translúcida = propiedad de superficie del cuerpo entero
                                                   #   (no feature aislada del rostro) → bajo riesgo.

narrator_voice: "K3TeN3ZVK8WnOeJ0NYqZ"            # David C2 (157.2 WPM medido; engineer aplica atempo ×1.05 → ~165 WPM)

# ═══════════════════════════════════════════════════════════════
# 5. NARRATIVE STRUCTURE (counterfactual + emotional framing)
# ═══════════════════════════════════════════════════════════════

narrative_structure:
  model_constraints_acknowledged: true                  # HR#28/#29 — narración trimmed a canonical@165 ≤ min(dur,5.9 hailuo_std) V5 fix (10 shots)
  counterfactual_placement: "before_choice_resolves"   # CANONICAL preferred (ref-09 10/10, PAUTA § 24)
  emotional_framing: "stakes_lift"
  cliffhanger_archetype: "P1"                          # Paz perdida cozy laboral (no twist; Axel siguió peligroso)
  pattern: "P1"

  canonical_constraints:
    no_retrospective_counterfactual: true
    si_elegiste_framing_required: true                 # marcar la rama vía acción condicional ("Si lo levantas")
    consequence_framing_style: "accion_condicional"    # D19 corregido 2026-05-29: NO bare label "Si elegiste A"
    visual_matches_narration_literal: true
    first_person_pov_locked: true

  hook_sub_beats:                                      # PAUTA § 19.5 ordering canonical (countdown LAST)
    - beat_id: "name_labels_intro"
      timestamp_intent_s: [0.0, 2.0]
      content: "Dyad simultánea Axel + Hugo con name labels monospaced (Y11.5)"
    - beat_id: "caption_setting_warning"
      timestamp_intent_s: [2.0, 4.5]
      content: "Narrator framing 'Elige a tu compañero para esta noche. Axel o Hugo.' + caption warning del setting BSL-4"
    - beat_id: "push_in_micro_motion"
      timestamp_intent_s: [4.5, 6.0]
      content: "POV slow push-in hacia el dyad (NO zoom-cut — feedback_hook_continuity_no_zoom_cut)"
    - beat_id: "countdown_3_2_1"
      timestamp_intent_s: [6.0, 9.0]
      content: "Film Leader Academy countdown vía AVU clip (digit 1.0s c/u)"
      avu_clip: "countdown-3-2-1-film-leader-with-ticks.mp4"

