  - segment_id: "narrator_hook"
    speaker: "narrator"
    voice_id: "K3TeN3ZVK8WnOeJ0NYqZ"
    text_canonical: "Final de la Champions. Minuto decisivo. A tu lado, Dembélé. Frente a ti, Saka."
