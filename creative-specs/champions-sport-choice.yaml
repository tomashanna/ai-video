    requires: ["clip_raw_mp4", "narration_segment_or_silence", "spec_text_canonical_optional"]
    emits: ["clip_atomic_mp4", "manifest_yaml", "bake_report_json"]
  script_b_audit_shot_spec_compliance:
    invoked_per_shot_during_cp4_audit: true
    dimensions_8: ["dim0_scope_creep", "dim1_narrator_vs_spec", "dim2_caption_vs_spec", "dim3_caption_vs_narrator_sync", "dim4_5_visual_vs_intent", "dim6_characters_vs_anchor", "dim7_action_vs_narration"]
    halt_on_any_fail: true
    regen_anchors_if_dim6_fails_cp1: true
  script_c_orchestrator:
    enforces_cp_by_cp: true
