    passed: false  # auto: true si ≥2
    # Caso maikol-crucero issue 15: Chelo aparece en 1:18-1:19 sin presentación previa → counterfactual no carga

  # D17 — Lip sync mark per shot (PAUTA-MASTER § 3 Lip sync intent)
