        leathery papery yellowed skin with deep vertical lines on sunken
        cheeks, high protruding cheekbones, eye sockets noticeably deeper
        than human normal, opaque brown eyes that don't blink — one slightly
        lower than the other (subtle but visible asymmetry). Long graying
        white moustache covering a small tight mouth that looks too small
        for the face. Old black wool beret tilted to one side on vertically
        elongated skull. Neck significantly longer and thinner than human
        normal (1.8x — NOTORIO AMORPHOUS, NOT subtle), visible neck veins,
        trachea protruding. Wearing moth-eaten cream wool coat with hand-
        stitched brown patches, red gaucho-style scarf knotted at neck.
        Shoulders asymmetrically dropped (right shoulder lower). Dark blue
        bombacha pants tucked into worn leather boots. Hands AMORPHOUS with
        fingers visibly too long (2.0x), knotty, arthritic, visible
        phalanges, holding an aluminum dented olive-green thermos and metal
        mate bombilla. Hands appear too large for arms. Sitting upright
        rigid. Plain dark gray background, neutral pose, soft cinematic
        lighting, 8k photorealistic.
